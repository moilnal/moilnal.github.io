<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모일날</title>
  <meta name="description" content="안 되는 날만 콕! 모두 되는 날을 찾아드려요">

  <!-- 카톡 등 공유 미리보기 (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="모일날">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="모일날 · 우리 언제 모일까? 📅">
  <meta property="og:description" content="안 되는 날만 콕! 모두 되는 날을 찾아드려요">
  <meta property="og:url" content="https://moilnal.github.io/">
  <meta property="og:image" content="https://moilnal.github.io/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="모일날 - 우리 언제 모일까?">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="모일날 · 우리 언제 모일까? 📅">
  <meta name="twitter:description" content="안 되는 날만 콕! 모두 되는 날을 찾아드려요">
  <meta name="twitter:image" content="https://moilnal.github.io/og-image.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #f7f4fb;          /* 연한 라벤더 배경 */
      --card: #ffffff;
      --text: #3d3a4a;
      --muted: #9a96a8;
      --line: #ece8f3;
      --accent: #a78bdb;      /* 파스텔 보라: 오늘, 선택 강조 */
      --accent-soft: #efe9fa;
      --accent-deep: #7c5cc4; /* 진한 보라: 확정된 날 */
      --ok: #5bbf8a;          /* 초록: 모두 가능한 날, 응답 완료 */
      --no-rgb: 224, 90, 106; /* 빨강: 안 되는 날 (배경 진하기에 사용) */
      --sat: #4a7bd8;
      --sun: #e05a6a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    button { font-family: inherit; color: inherit; }

    .app { max-width: 420px; margin: 0 auto; }

    /* ---------- 상단: 앱 이름 + 설정 ---------- */
    .top { position: relative; margin-bottom: 16px; }

    /* 앱 이름은 작게 (그 아래 모임명이 크게) */
    h1 {
      font-size: 15px;
      font-weight: 800;
      line-height: 40px;
      text-align: center;
      color: var(--accent);
    }

    .gear {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: none;
      font-size: 18px;
      cursor: pointer;
      opacity: 0.6;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(120, 100, 160, 0.08);
    }

    /* ---------- 참여자 영역 ---------- */
    .people { padding: 12px 14px 14px; margin-bottom: 12px; }

    /* 맨 위 한 줄: 인원 조절 + 진행 상황 */
    .people-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stepper { display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; }
    .stepper .icon { font-size: 16px; margin-right: 2px; }
    .stepper button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }
    .stepper button:disabled { opacity: 0.35; cursor: default; }
    #sizeLabel { min-width: 36px; text-align: center; }

    .progress { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .bar {
      width: 56px;
      height: 6px;
      border-radius: 3px;
      background: var(--line);
      overflow: hidden;
    }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }
    .progress.all { color: var(--ok); }
    .progress.all .bar i { background: var(--ok); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .chip {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 12px 0 3px;
      border: 2px solid var(--line);
      border-radius: 19px;
      background: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .chip.pending { opacity: 0.6; }           /* 아직 응답 안 한 사람: 살짝 흐리게 */
    .chip.sel { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
    .chip.empty {
      border-style: dashed;
      border-color: #cfc6e0;
      background: #fcfbfe;
      color: var(--muted);
    }

    /* 칩의 이모지 부분: 탭하면 이모지 변경 */
    .chip .emo {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #f4f1f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }
    .chip.sel .emo { background: #fff; }
    .chip.empty .emo { background: none; font-size: 15px; }

    /* 칩의 이름 부분: 탭하면 입력 모드 */
    .chip .nm { padding-left: 7px; line-height: 34px; }
    .chip .check { margin-left: 4px; color: var(--ok); font-weight: 800; }

    /* 추천 줄: "✨ 추천" + 날짜 칩 3개 */
    .rec {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .rec[hidden] { display: none; }
    .rec-label {
      flex: none;
      display: flex;
      flex-direction: column;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }
    .rec-label small { font-size: 10px; font-weight: 600; color: var(--muted); }
    .rec-chips {
      flex: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .rec-chip {
      height: 34px;
      padding: 0 4px;
      border: 1.5px solid;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .rec-chip.ok { background: #eaf8f0; border-color: #bfe6cf; color: #2f8a5b; }
    .rec-chip.some { background: #fdeef0; border-color: #f5c9cf; color: #a33d4b; }
    .rec-chip .n {
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      border-radius: 8px;
      background: var(--sun);
      color: #fff;
      font-size: 10px;
      line-height: 15px;
      text-align: center;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }
    .hint:empty { display: none; }

    /* 입력 모드 안내: "멍청 님 입력 중" + 완료 */
    .hint.editing {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--accent-soft);
      border-radius: 12px;
      padding: 6px 6px 6px 12px;
      color: var(--text);
    }
    .hint.editing b { font-weight: 700; }
    .done-btn {
      height: 34px;
      padding: 0 16px;
      flex-shrink: 0;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff !important;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ---------- 달력 ---------- */
    .calendar { padding: 14px 4px 16px; }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      margin-bottom: 8px;
    }

    .month-nav button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 22px;
      cursor: pointer;
    }
    .month-nav button:active { background: #e2d8f5; }

    #title { font-size: 19px; font-weight: 700; }

    .weekdays, #grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
    }

    .weekdays div {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      padding: 6px 0;
    }

    .cell {
      min-height: 66px;
      min-width: 0;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 0;
      container-type: inline-size;   /* 이모지 크기를 칸 폭 기준으로 정하기 위함 */
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      transition: background 0.15s;
    }

    .num {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
    }

    .weekdays .sun, .cell.sun .num { color: var(--sun); }
    .weekdays .sat, .cell.sat .num { color: var(--sat); }

    .cell.past { opacity: 0.35; cursor: default; }

    /* 추천 칩을 눌렀을 때 해당 날짜 칸이 잠깐 반짝임 */
    @keyframes flash {
      0%, 100% { box-shadow: 0 0 0 0 rgba(167, 139, 219, 0); transform: scale(1); }
      25%, 75% { box-shadow: 0 0 0 3px var(--accent); transform: scale(1.08); }
      50% { box-shadow: 0 0 0 3px rgba(167, 139, 219, 0.3); transform: scale(1); }
    }
    .cell.flash { animation: flash 0.9s ease; position: relative; z-index: 1; }

    /* 모두 가능한 날: 초록 동그라미 테두리 */
    .cell.allok .num { box-shadow: 0 0 0 2px var(--ok); }

    /* 오늘: 보라색으로 채운 숫자 */
    .cell.today .num { background: var(--accent-soft); color: var(--accent-deep); font-weight: 800; }

    /* 확정된 날: 진한 보라색으로 꽉 찬 동그라미 + 📌, 다른 표시보다 눈에 띄게 */
    .cell.confirmed { position: relative; box-shadow: inset 0 0 0 2px var(--accent-deep); }
    .cell.confirmed .num {
      width: 26px;
      height: 26px;
      background: var(--accent-deep);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(124, 92, 196, 0.45);
    }
    .cell .pin { position: absolute; top: 1px; right: 2px; font-size: 10px; line-height: 1; }

    /* 이모지 최대 2개 + "+n", 한 줄로 겹치지 않게 */
    .faces {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 3px;               /* X 배지가 옆 이모지를 덮지 않을 만큼 띄움 */
      line-height: 1;
      max-width: 100%;
    }

    /* 칸 폭에 맞춰 이모지 크기를 살짝 줄여서 좁은 폰에서도 한 줄에 들어가게 */
    .face {
      position: relative;
      font-size: min(11px, 22cqw);
      line-height: 1;
    }

    .face .x {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 0 0 0 1px #fff;
      color: #fff;
      font-size: 7px;
      font-style: normal;
      font-weight: 800;
      line-height: 8px;
      text-align: center;
    }

    /* 지금 입력 중인 사람의 X는 조금 더 크게 */
    .face.mine .x {
      right: -3px;
      bottom: -3px;
      width: 11px;
      height: 11px;
      font-size: 9px;
      line-height: 11px;
    }

    .more { font-size: 9px; font-weight: 700; letter-spacing: -0.3px; }

    .cnt {
      margin-top: auto;
      font-size: 10px;
      font-weight: 700;
      color: #a33d4b;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .lg-today { width: 12px; height: 12px; border-radius: 50%; background: var(--accent-soft); box-shadow: inset 0 0 0 1px #d6c9ef; }
    .lg-confirm { width: 12px; height: 12px; border-radius: 50%; background: var(--accent-deep); }
    .lg-ok { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ok); }

    .legend-tip {
      margin-top: 6px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ---------- 팝업 (하단 시트 / 위쪽 작은 팝업) ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(40, 30, 60, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      margin: 0 auto;
      background: #fff;
      border-radius: 22px 22px 0 0;
      padding: 10px 20px 28px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }
    .overlay.show .sheet { transform: none; }

    /* 이름 입력 팝업은 키보드에 가리지 않게 화면 위쪽에 띄움 */
    .overlay.top .sheet {
      top: 12vh;
      bottom: auto;
      left: 16px;
      right: 16px;
      max-width: 388px;
      border-radius: 20px;
      padding: 18px 18px 20px;
      transform: translateY(-16px);
    }
    .overlay.top.show .sheet { transform: none; }
    .overlay.top .handle { display: none; }

    .handle {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--line);
      margin: 0 auto 14px;
    }

    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .sheet-desc { font-size: 14px; color: var(--muted); margin-bottom: 16px; }

    .who-list { list-style: none; }
    .who-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
      font-weight: 600;
    }
    .who-list li:last-child { border-bottom: none; }
    .who-list .emo { font-size: 22px; }

    /* "누구를 뺄까요?" 선택 목록 */
    .pick-list { display: flex; flex-direction: column; gap: 8px; }
    .pick-list button {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 50px;
      padding: 0 14px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
      font-size: 16px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .pick-list .emo { font-size: 22px; }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .emoji-grid button {
      aspect-ratio: 1;
      border: 2px solid transparent;
      border-radius: 14px;
      background: #faf8fd;
      font-size: 26px;
      cursor: pointer;
    }
    .emoji-grid button.cur { border-color: var(--accent); background: var(--accent-soft); }
    .emoji-grid button:disabled { opacity: 0.2; cursor: default; }

    /* 빈자리 채우기 팝업: 이모지 버튼 + 이름 입력 + 저장 */
    .add-row { display: flex; gap: 8px; }
    .emoji-btn {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #fcfbfe;
      font-size: 22px;
      cursor: pointer;
    }
    .add-row input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: #fcfbfe;
      outline: none;
    }
    .add-row input:focus { border-color: var(--accent); }
    .save-btn {
      height: 46px;
      padding: 0 16px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff !important;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .add-sheet .emoji-grid { margin-top: 14px; }
    .add-sheet .emoji-grid button { font-size: 22px; border-radius: 12px; }

    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      height: 48px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.ghost { background: #f1eef6; }
    .btn.danger { background: var(--sun); color: #fff; }
    .btn.primary { background: var(--accent-deep); color: #fff; }
    .sheet-actions { margin-top: 18px; }

    /* 확정 배너 (추천 줄 자리) */
    .banner {
      margin-top: 12px;
      padding: 10px 10px 10px 12px;
      border-radius: 14px;
      background: var(--accent-deep);
      color: #fff;
    }
    .banner[hidden] { display: none; }
    .banner-main { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
    .banner-title { flex: 1; min-width: 0; }
    .dday {
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.22);
      font-size: 12px;
      font-weight: 800;
    }
    .banner-btn {
      height: 28px;
      padding: 0 10px;
      border: none;
      border-radius: 9px;
      background: #fff;
      color: var(--accent-deep) !important;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .banner-warn {
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 9px;
      background: #fff4d6;
      color: #8a5a00;
      font-size: 13px;
      font-weight: 600;
    }
    .banner.past { background: #f1eef6; color: var(--muted); }
    .banner.past .banner-main { font-size: 14px; }
    .btn.full { width: 100%; flex: none; }

    /* ---------- 안내 토스트 ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 36px;
      transform: translate(-50%, 20px);
      background: rgba(50, 42, 70, 0.92);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 20px;
      width: max-content;
      max-width: calc(100vw - 32px);
      text-align: center;
      line-height: 1.4;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- 공유 버전 추가 ---------- */
    /* 상단 왼쪽: 멤버 초대 */
    .link-btn {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 34px;
      padding: 0 12px;
      border: none;
      border-radius: 17px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(120, 100, 160, 0.12);
      color: var(--accent-deep) !important;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 저장 중일 때 화면 맨 위 얇은 진행 표시 */
    .busy-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent) no-repeat;
      background-size: 50% 100%;
      animation: busy 1s linear infinite;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 30;
    }
    .busy-bar.show { opacity: 1; }
    @keyframes busy {
      from { background-position: -100% 0; }
      to { background-position: 200% 0; }
    }

    /* 초기화 되돌리기 배너 */
    .undo-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 8px 8px 14px;
      border-radius: 14px;
      background: #fff4d6;
      color: #8a5a00;
      font-size: 14px;
      font-weight: 600;
    }
    .undo-bar[hidden] { display: none; }
    .undo-bar button {
      height: 32px;
      padding: 0 14px;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #8a5a00 !important;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 로딩 / 오류 화면 */
    .status {
      padding: 56px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
    .status .btn { display: block; margin: 18px auto 0; max-width: 240px; }
    .status[hidden], .main[hidden] { display: none; }

    /* 설정 시트 */
    .menu { display: flex; flex-direction: column; gap: 8px; }
    .menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 0 14px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .menu .room-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .menu .room-when { flex: none; font-size: 12px; color: var(--muted); font-weight: 500; }
    .sheet-section { margin: 20px 0 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .menu button.danger-text { color: var(--sun) !important; }

    /* 모임명 (앱 이름 아래 크게, 탭하면 이름 수정) */
    .room-title-row { text-align: center; margin: -10px 0 14px; }
    .room-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 4px 8px;
      border: none;
      border-radius: 10px;
      background: none;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      cursor: pointer;
    }
    .room-title-row[hidden] { display: none; }
    .room-title .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room-title .pen { flex: none; font-size: 14px; opacity: 0.55; }

    /* 내 모임 목록: 이름 + 정보, 오른쪽 ⋯ */
    .room-list { display: flex; flex-direction: column; gap: 8px; }
    .room-row {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }
    .room-row.current { border-color: var(--accent); background: var(--accent-soft); }
    .room-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 9px 4px 9px 14px;
      border: none;
      background: none;
      text-align: left;
      cursor: pointer;
    }
    .room-name { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .more-btn {
      flex: none;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: none;
      font-size: 20px;
      font-weight: 800;
      color: var(--muted) !important;
      cursor: pointer;
    }
    .status .sub { font-size: 13px; margin-top: 4px; }
    .copy-input {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      resize: none;
    }
  </style>
</head>
<body>
  <div id="busy" class="busy-bar"></div>

  <div class="app">
    <header class="top">
      <button id="linkBtn" class="link-btn" hidden>👋 멤버 초대</button>
      <h1>모일날</h1>
      <button id="gearBtn" class="gear" aria-label="설정" hidden>⚙️</button>
    </header>

    <div id="roomTitleRow" class="room-title-row" hidden>
      <button id="roomTitle" class="room-title" aria-label="모임 이름 바꾸기">
        <span id="roomTitleText" class="t"></span><span class="pen">✏️</span>
      </button>
    </div>

    <div id="undoBar" class="undo-bar" hidden>
      <span>초기화됨</span>
      <button id="undoBtn">되돌리기</button>
    </div>

    <div id="status" class="status">불러오는 중…</div>

    <div id="main" class="main" hidden>
      <section class="card people">
        <div class="people-top">
          <div class="stepper">
            <span class="icon">👥</span>
            <button id="minusBtn" aria-label="인원 줄이기">−</button>
            <span id="sizeLabel"></span>
            <button id="plusBtn" aria-label="인원 늘리기">+</button>
          </div>
          <div id="progress" class="progress">
            <div class="bar"><i id="barFill"></i></div>
            <span id="progressText"></span>
          </div>
        </div>
        <div id="chips" class="chips"></div>
        <div id="hint" class="hint"></div>
        <div id="banner" class="banner" hidden></div>
        <div id="rec" class="rec" hidden>
          <div class="rec-label"><span id="recTitle">✨ 추천</span><small id="recPending">(응답 중)</small></div>
          <div id="recChips" class="rec-chips"></div>
        </div>
      </section>

      <section class="card calendar">
        <div class="month-nav">
          <button id="prev" aria-label="이전 달">‹</button>
          <div id="title"></div>
          <button id="next" aria-label="다음 달">›</button>
        </div>

        <div class="weekdays">
          <div class="sun">일</div><div>월</div><div>화</div><div>수</div>
          <div>목</div><div>금</div><div class="sat">토</div>
        </div>

        <div id="grid"></div>

        <div class="legend">
          <span><i class="lg-today"></i>오늘</span>
          <span><i class="lg-ok"></i>모두 가능</span>
          <span><i class="lg-confirm"></i>확정</span>
        </div>
        <p class="legend-tip">
          날짜를 누르면 안 되는 사람을 볼 수 있어요<br>
          이름을 고른 뒤 누르면 내 안 되는 날로 표시돼요
        </p>
      </section>
    </div>
  </div>

  <div id="overlay" class="overlay">
    <div class="sheet">
      <div class="handle"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script>
    // ===== Supabase 연결 (공개용 publishable 키라 코드에 넣어도 됨) =====
    const SUPABASE_URL = 'https://tkwvtgolxzthojkfzhsd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MvRrvStiLVCCIkCX5Ktb6A_MlHF1uKk';

    // ===== 기본 설정 =====
    const EMOJIS = [
      '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮',
      '🐷', '🐸', '🐵', '🐧', '🐤', '🦄', '🐙', '🐳', '😀', '😎', '🤓', '🥳'
    ];
    const MAX_PEOPLE = 15;
    const MIN_PEOPLE = 2;
    const DEFAULT_SIZE = 4;
    const MAX_FACES = 2;
    const LOCAL_KEY = 'moilnal-local';
    const DOW = ['일', '월', '화', '수', '목', '금', '토'];

    // 서버 오류 코드 → 안내 문구
    const ERRORS = {
      name_taken: '이미 있는 이름이에요',
      emoji_taken: '다른 사람이 쓰고 있는 이모지예요',
      room_full: '빈자리가 없어요',
      invalid_name: '이름은 1~20자로 써주세요',
      invalid_emoji: '고를 수 없는 이모지예요',
      invalid_size: `인원은 ${MIN_PEOPLE}~${MAX_PEOPLE}명이에요`,
      size_below_members: '이름이 있는 사람보다 적게 줄일 수 없어요',
      member_not_found: '참여자를 찾을 수 없어요',
      date_out_of_range: '고를 수 없는 날짜예요',
      invalid_date: '고를 수 없는 날짜예요',
      nothing_to_undo: '되돌릴 내용이 없어요 (24시간이 지났어요)',
      room_not_found: '모임을 찾을 수 없어요',
      room_deleted: '삭제된 모임이에요',
      restore_expired: '삭제한 지 24시간이 지나서 복구할 수 없어요',
      invalid_room_name: '모임 이름은 1~20자로 써주세요'
    };
    const DEFAULT_ROOM_NAME = '새 모임';
    const FLASH_KEY = 'moilnal-flash';   // 다른 모임으로 이동한 뒤 보여줄 안내 (sessionStorage)
    const NETWORK_ERROR = '연결이 불안정해요, 다시 시도해주세요';

    const db = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    // ===== 이 기기에만 저장 (localStorage) =====
    // rooms: 내가 들어갔던 모임 목록 [{ id, name, label, visitedAt }]
    // me:    모임별 "나는 누구" { 모임ID: 참여자ID }
    function loadLocal() {
      try {
        const s = JSON.parse(localStorage.getItem(LOCAL_KEY));
        if (s && Array.isArray(s.rooms)) return { rooms: s.rooms, me: s.me || {} };
      } catch (e) {}
      return { rooms: [], me: {} };
    }
    function saveLocal() {
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(local)); } catch (e) {}
    }
    let local = loadLocal();

    // ===== 화면 상태 (서버의 get_room 결과로 채움) =====
    let roomId = null;
    let state = {
      name: DEFAULT_ROOM_NAME, // 모임명
      size: DEFAULT_SIZE,
      participants: [],     // [{ id, name, emoji, done }]
      marks: {},            // { '2026-11-12': [참여자 id, ...] }
      confirmed: null,      // { key: '2026-11-07', known: [id, ...] }
      undoUntil: null,      // 초기화 되돌리기 가능한 시각
      selectedId: null      // 지금 입력 중인 사람 (null이면 보기 모드)
    };
    let newEmoji = null;   // 빈자리를 채울 때 자동으로 들어갈 이모지
    let changing = false;  // 확정 배너의 [변경]을 누른 상태
    let draft = false;     // ?new 로 연 임시 모임 (첫 입력 때 서버에 만들어짐)
    let creating = null;   // create_room 진행 중인 Promise (두 번 만들지 않게)

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let current = new Date(today.getFullYear(), today.getMonth(), 1);

    // ===== 작은 도우미들 =====
    const $ = id => document.getElementById(id);

    function h(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function dateKey(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function findPerson(id) {
      return state.participants.find(p => p.id === id);
    }

    function usedEmojis(exceptId) {
      return state.participants.filter(p => p.id !== exceptId).map(p => p.emoji);
    }

    function emptySlots() {
      return state.size - state.participants.length;
    }

    let toastTimer;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    // 짧게 누르기(탭)와 길게 누르기(0.5초)를 구분
    function onPress(el, onTap, onLong) {
      let timer = null, fired = false, sx = 0, sy = 0;
      const cancel = () => { clearTimeout(timer); timer = null; };

      el.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        fired = false;
        sx = e.clientX; sy = e.clientY;
        cancel();
        timer = setTimeout(() => {
          timer = null;
          fired = true;
          if (navigator.vibrate) navigator.vibrate(15);
          onLong();
        }, 500);
      });
      el.addEventListener('pointermove', e => {
        if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel();
      });
      el.addEventListener('pointerup', cancel);
      el.addEventListener('pointerleave', cancel);
      el.addEventListener('pointercancel', cancel);
      el.addEventListener('click', e => {
        if (fired) { fired = false; return; }   // 길게 누른 뒤 손을 뗄 때는 탭으로 치지 않음
        onTap(e);
      });
      el.addEventListener('contextmenu', e => e.preventDefault());
    }

    // ===== 서버와 주고받기 =====
    let pending = 0;          // 진행 중인 저장 요청 수
    let writeSeq = 0;         // 저장을 시작할 때마다 1씩 증가 (오래된 불러오기 결과 버리기용)
    let refetchWanted = false;
    let refetchTimer = null;

    function setBusy() {
      $('busy').classList.toggle('show', pending > 0);
    }

    function errorMessage(err) {
      return (err && ERRORS[err.message]) || NETWORK_ERROR;
    }

    async function callRpc(name, args) {
      if (!db) throw new Error('network');
      const { data, error } = await db.rpc(name, args);
      if (error) throw error;
      return data;
    }

    // 화면을 먼저 바꾸고(optimistic) 서버에 저장. 실패하면 화면을 되돌림
    async function write(name, args, optimistic) {
      writeSeq++;
      const backup = JSON.stringify({
        name: state.name, size: state.size, participants: state.participants,
        marks: state.marks, confirmed: state.confirmed, undoUntil: state.undoUntil
      });
      if (optimistic) { optimistic(); render(); }

      pending++;
      setBusy();
      try {
        await ensureRoom();   // ?new 임시 모임이면 첫 입력 때 서버에 모임을 만듦
        const data = await callRpc(name, { p_room_id: roomId, ...args });
        return { ok: true, data };
      } catch (err) {
        if (optimistic) {
          const b = JSON.parse(backup);
          Object.assign(state, b, { undoUntil: b.undoUntil ? new Date(b.undoUntil) : null });
          render();
        }
        toast(errorMessage(err));
        return { ok: false, error: err };
      } finally {
        pending--;
        setBusy();
        scheduleRefetch();   // 저장이 끝나면 서버 최신 상태로 맞춤
      }
    }

    // ?new 임시 모임을 서버에 만들고 주소를 ?g=모임ID 로 바꿈
    function ensureRoom() {
      if (!draft) return Promise.resolve();
      if (!creating) {
        creating = callRpc('create_room', {}).then(id => {
          roomId = id;
          draft = false;
          try { history.replaceState(null, '', location.pathname + '?g=' + encodeURIComponent(id)); } catch (e) {}
          rememberRoom(true);
          subscribe();
        }).finally(() => { creating = null; });
      }
      return creating;
    }

    function scheduleRefetch() {
      refetchWanted = true;
      clearTimeout(refetchTimer);
      refetchTimer = setTimeout(refetch, 300);
    }

    async function refetch() {
      if (!roomId || pending > 0) return;   // 저장이 끝나면 다시 예약됨
      refetchWanted = false;
      const seq = writeSeq;
      let data;
      try {
        data = await callRpc('get_room', { p_room_id: roomId });
      } catch (err) {
        if (err && err.message === 'room_not_found') return showNotFound();
        return;   // 잠깐 끊긴 경우: 다음 알림/화면 복귀 때 다시 시도
      }
      if (seq !== writeSeq || pending > 0) {   // 불러오는 사이 새 저장이 시작됨 → 이 결과는 버림
        scheduleRefetch();
        return;
      }
      if (data.deleted) return showDeleted(data);   // 누군가 모임을 삭제함
      if ($('main').hidden) showMain();             // 삭제됐던 모임이 복구됨
      applyRoom(data);
      rememberRoom(false);
      render();
    }

    // 다른 모임 등 현재 모임이 아닌 곳에 쓰기 (화면 되돌리기 없이 안내만)
    async function runRpc(name, args) {
      pending++;
      setBusy();
      try {
        return { ok: true, data: await callRpc(name, args) };
      } catch (err) {
        toast(errorMessage(err));
        return { ok: false, error: err };
      } finally {
        pending--;
        setBusy();
      }
    }

    function applyRoom(data) {
      state.name = data.name || DEFAULT_ROOM_NAME;
      state.size = data.size;
      state.participants = (data.members || []).map(m => ({
        id: m.id, name: m.name, emoji: m.emoji, done: m.responded
      }));
      state.marks = data.unavailable || {};
      state.confirmed = data.confirmed
        ? { key: data.confirmed.date, known: data.confirmed.known || [] }
        : null;
      state.undoUntil = data.undo_until ? new Date(data.undo_until) : null;
      if (state.selectedId && !findPerson(state.selectedId)) state.selectedId = null;
    }

    // ===== 내 모임 목록 =====
    function roomLabel() {
      let s = state.participants.map(p => p.emoji).join('') || '빈 모임';
      if (state.confirmed) s += ` · ${shortLabel(keyToDate(state.confirmed.key))} 확정`;
      return s;
    }

    function rememberRoom(visit) {
      const i = local.rooms.findIndex(r => r.id === roomId);
      const prev = i >= 0 ? local.rooms[i] : null;
      const entry = {
        id: roomId,
        name: state.name,
        label: roomLabel(),
        visitedAt: visit || !prev ? Date.now() : prev.visitedAt
      };
      if (i >= 0) local.rooms[i] = entry;
      else local.rooms.push(entry);
      local.rooms.sort((a, b) => b.visitedAt - a.visitedAt);
      local.rooms = local.rooms.slice(0, 30);
      saveLocal();
    }

    function forgetRoom(id) {
      local.rooms = local.rooms.filter(r => r.id !== id);
      delete local.me[id];
      saveLocal();
    }

    function setLocalName(id, name) {
      const r = local.rooms.find(x => x.id === id);
      if (r) { r.name = name; saveLocal(); }
    }

    // 지금 모임에서 나가기: 목록의 다른 모임으로, 없으면 새 모임. 안내 문구는 이동 후 표시
    function leaveCurrent(message) {
      try { if (message) sessionStorage.setItem(FLASH_KEY, message); } catch (e) {}
      if (local.rooms.length) goRoom(local.rooms[0].id);
      else createAndGo();
    }

    function goRoom(id) {
      location.assign(location.pathname + '?g=' + encodeURIComponent(id));
    }

    // 새 모임: ?new 빈 화면으로 이동 (서버 모임은 첫 입력 때 만들어짐)
    function createAndGo() {
      location.assign(location.pathname + '?new');
    }

    // 다른 모임에서 넘어올 때 남긴 안내 문구 꺼내기 (한 번만)
    function takeFlash() {
      let flash = null;
      try { flash = sessionStorage.getItem(FLASH_KEY); sessionStorage.removeItem(FLASH_KEY); } catch (e) {}
      return flash;
    }

    function whenLabel(ts) {
      const days = Math.floor((Date.now() - ts) / 86400000);
      if (days <= 0) return '오늘';
      if (days === 1) return '어제';
      return `${days}일 전`;
    }

    // ===== 팝업 =====
    // position: 'bottom'(기본, 하단 시트) 또는 'top'(키보드 입력용 위쪽 팝업)
    let sheetOpenedAt = 0;
    function openSheet(build, position) {
      const body = $('sheetBody');
      body.innerHTML = '';
      body.className = '';
      build(body);
      sheetOpenedAt = Date.now();
      $('overlay').classList.toggle('top', position === 'top');
      $('overlay').classList.add('show');
    }
    function closeSheet() {
      $('overlay').classList.remove('show');
      document.activeElement && document.activeElement.blur();
    }
    $('overlay').addEventListener('click', e => {
      if (e.target === $('overlay') && Date.now() - sheetOpenedAt > 300) closeSheet();
    });

    // 확인 팝업 (취소 / 실행). kind: 'danger'(빨강) 또는 'primary'(보라)
    function confirmSheet(title, desc, okLabel, onOk, kind = 'danger') {
      openSheet(body => {
        body.append(h('h3', 'sheet-title', title), h('p', 'sheet-desc', desc));
        const row = h('div', 'btn-row');
        const cancelBtn = h('button', 'btn ghost', '취소');
        const okBtn = h('button', 'btn ' + kind, okLabel);
        cancelBtn.addEventListener('click', closeSheet);
        okBtn.addEventListener('click', () => { closeSheet(); onOk(); });
        row.append(cancelBtn, okBtn);
        body.append(row);
      });
    }

    // 24개 이모지 그리드. used: 고를 수 없는(이미 쓰인) 이모지들
    function emojiGrid(currentEmoji, used, onPick) {
      const grid = h('div', 'emoji-grid');
      for (const emoji of EMOJIS) {
        const btn = h('button', emoji === currentEmoji ? 'cur' : '', emoji);
        if (used.includes(emoji)) btn.disabled = true;
        btn.addEventListener('click', () => onPick(emoji));
        grid.append(btn);
      }
      return grid;
    }

    function openEmojiPicker(person) {
      openSheet(body => {
        body.append(
          h('h3', 'sheet-title', `${person.name} 님의 캐릭터 고르기`),
          h('p', 'sheet-desc', '흐린 이모지는 다른 사람이 쓰고 있어요.'),
          emojiGrid(person.emoji, usedEmojis(person.id), emoji => {
            closeSheet();
            write('save_member', { p_member_id: person.id, p_name: person.name, p_emoji: emoji },
              () => { person.emoji = emoji; });
          })
        );
      });
    }

    // ===== 참여자 =====
    // 빈자리를 채울 사람의 이모지: 아직 안 쓰인 것 중 하나를 자동으로
    function ensureNewEmoji() {
      const used = usedEmojis();
      if (!newEmoji || used.includes(newEmoji)) {
        const free = EMOJIS.filter(e => !used.includes(e));
        newEmoji = free[Math.floor(Math.random() * free.length)];
      }
    }

    // 빈자리를 저장하려는데 그사이 다른 사람이 들어온 경우: 안내 + 최신 상태로 새로고침
    function slotTaken() {
      closeSheet();
      toast('방금 다른 분이 이 자리에 들어왔어요. 다른 빈자리를 골라주세요');
      refetch();
    }

    // 빈자리 칩을 누르면: 이모지 버튼 + 이름 입력 + 저장
    function openFillSlot() {
      ensureNewEmoji();
      let input;
      openSheet(body => {
        body.className = 'add-sheet';
        body.append(h('h3', 'sheet-title', '내 이름 넣기'),
                    h('p', 'sheet-desc', '이모지를 누르면 캐릭터를 바꿀 수 있어요.'));

        const row = h('div', 'add-row');
        const emoBtn = h('button', 'emoji-btn', newEmoji);
        emoBtn.setAttribute('aria-label', '이모지 고르기');
        input = h('input');
        input.type = 'text';
        input.placeholder = '이름';
        input.maxLength = 20;
        input.autocomplete = 'off';
        const saveBtn = h('button', 'save-btn', '저장');
        row.append(emoBtn, input, saveBtn);
        body.append(row);

        // 이모지 버튼을 누르면 같은 팝업 안에 24개 그리드를 펼침
        let grid = null;
        emoBtn.addEventListener('click', () => {
          if (grid) { grid.remove(); grid = null; return; }
          grid = emojiGrid(newEmoji, usedEmojis(), emoji => {
            newEmoji = emoji;
            emoBtn.textContent = emoji;
            grid.remove();
            grid = null;
            input.focus();
          });
          body.append(grid);
        });

        let saving = false;
        const submit = async () => {
          if (saving) return;
          const name = input.value.trim();
          if (!name) return toast('이름을 입력해주세요');
          if (state.participants.some(p => p.name === name)) return toast('이미 있는 이름이에요');
          if (emptySlots() <= 0) return slotTaken();   // 팝업을 연 사이 실시간으로 자리가 찼음

          saving = true;
          saveBtn.disabled = true;
          const emoji = newEmoji;
          const res = await write('save_member', { p_member_id: null, p_name: name, p_emoji: emoji });
          saving = false;
          saveBtn.disabled = false;
          if (!res.ok) {
            // 서버가 모임을 잠그고 인원을 세서, 그사이 다른 사람이 자리를 채웠으면 room_full 로 거절함 (덮어쓰지 않음)
            if (res.error && res.error.message === 'room_full') slotTaken();
            return;
          }

          const id = res.data;
          if (!findPerson(id)) state.participants.push({ id, name, emoji, done: false });
          state.selectedId = id;          // 저장하면 바로 그 사람 입력 모드로
          local.me[roomId] = id;          // 이 기기에서 "나는 이 사람"
          saveLocal();
          newEmoji = null;
          closeSheet();
          render();
          toast(`${emoji} ${name} 님, 안 되는 날을 눌러주세요`);
        };
        saveBtn.addEventListener('click', submit);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); }
        });
      }, 'top');
      input.focus();
    }

    // ===== 인원 조절 =====
    function changeSize(delta) {
      if (delta > 0) {
        if (state.size >= MAX_PEOPLE) return toast(`최대 ${MAX_PEOPLE}명까지예요`);
        const size = state.size + 1;
        return write('set_room_size', { p_size: size }, () => { state.size = size; });
      }

      if (state.size <= MIN_PEOPLE) return toast(`최소 ${MIN_PEOPLE}명이에요`);
      if (emptySlots() > 0) {          // 빈자리부터 제거
        const size = state.size - 1;
        return write('set_room_size', { p_size: size }, () => { state.size = size; });
      }

      // 빈자리가 없으면 누구를 뺄지 고르기
      openSheet(body => {
        body.append(h('h3', 'sheet-title', '누구를 뺄까요?'),
                    h('p', 'sheet-desc', '뺀 사람이 표시한 날도 함께 지워져요.'));
        const list = h('div', 'pick-list');
        for (const person of state.participants) {
          const btn = h('button');
          btn.append(h('span', 'emo', person.emoji), h('span', '', person.name));
          btn.addEventListener('click', () => {
            confirmSheet(`${person.emoji} ${person.name} 님을 뺄까요?`,
              '표시한 안 되는 날도 함께 지워지고, 되돌릴 수 없어요.', '빼기', async () => {
                const res = await write('delete_member', { p_member_id: person.id }, () => {
                  state.participants = state.participants.filter(p => p.id !== person.id);
                  for (const key of Object.keys(state.marks)) {
                    state.marks[key] = state.marks[key].filter(id => id !== person.id);
                    if (!state.marks[key].length) delete state.marks[key];
                  }
                  if (state.selectedId === person.id) state.selectedId = null;
                  state.size = Math.max(MIN_PEOPLE, state.size - 1);
                });
                if (res.ok) toast(`${person.name} 님을 뺐어요`);
              });
          });
          list.append(btn);
        }
        body.append(list);
      });
    }

    function renderPeople() {
      const size = state.size;
      const answered = state.participants.filter(p => p.done).length;
      const allDone = answered === size;

      // 맨 위 한 줄: 인원 + 진행 상황
      $('sizeLabel').textContent = `${size}명`;
      $('minusBtn').disabled = size <= MIN_PEOPLE;
      $('plusBtn').disabled = size >= MAX_PEOPLE;
      $('barFill').style.width = `${(answered / size) * 100}%`;
      $('progressText').textContent = allDone ? '모두 응답 🎉' : `${answered}/${size} 응답`;
      $('progress').classList.toggle('all', allDone);

      // 칩: 이름 있는 사람들 → 빈자리들
      const chips = $('chips');
      chips.innerHTML = '';

      for (const person of state.participants) {
        let cls = 'chip';
        if (person.id === state.selectedId) cls += ' sel';
        if (!person.done) cls += ' pending';
        const chip = h('div', cls);
        chip.append(h('span', 'emo', person.emoji), h('span', 'nm', person.name));
        if (person.done) chip.append(h('span', 'check', '✓'));

        chip.addEventListener('click', e => {
          if (e.target.closest('.emo')) return openEmojiPicker(person);
          // 이름 부분: 입력 모드 / 이미 선택된 사람이면 보기 모드로
          if (state.selectedId === person.id) {
            state.selectedId = null;
          } else {
            state.selectedId = person.id;
            local.me[roomId] = person.id;   // 이 기기에서 "나는 이 사람"
            saveLocal();
          }
          render();
        });
        chips.append(chip);
      }

      for (let i = 0; i < emptySlots(); i++) {
        const chip = h('div', 'chip empty');
        chip.append(h('span', 'emo', '❔'), h('span', 'nm', '빈자리'));
        chip.addEventListener('click', openFillSlot);
        chips.append(chip);
      }

      // 안내 문구
      const hint = $('hint');
      hint.className = 'hint';
      hint.innerHTML = '';
      const sel = findPerson(state.selectedId);

      if (sel) {
        hint.classList.add('editing');
        const text = h('span');
        text.append(h('b', '', `${sel.emoji} ${sel.name}`), ' 님 입력 중');
        const done = h('button', 'done-btn', '완료');
        done.addEventListener('click', async () => {
          state.selectedId = null;
          const res = await write('set_responded', { p_member_id: sel.id, p_responded: true },
            () => { sel.done = true; });   // 완료 = 응답 완료 저장
          if (res.ok) toast('응답 완료! 이름을 다시 누르면 고칠 수 있어요');
        });
        hint.append(text, done);
      } else if (changing && activeConfirmed()) {
        hint.textContent = '다른 날짜를 탭해서 다시 확정하세요';
      } else if (emptySlots() > 0) {
        hint.textContent = '빈자리를 눌러 내 이름을 넣어보세요';
      }

      renderBanner();
      renderRecommend();
    }

    // ===== 날짜 확정 =====
    // state.confirmed = { key: '2026-11-07', known: [확정할 때 이미 안 된다고 했던 사람 id] }
    function todayKey() {
      return dateKey(today.getFullYear(), today.getMonth(), today.getDate());
    }

    function keyToDate(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function shortLabel(date) {
      return `${date.getMonth() + 1}/${date.getDate()} (${DOW[date.getDay()]})`;
    }

    // 아직 지나지 않은 확정 날짜 (지났으면 null)
    function activeConfirmed() {
      const c = state.confirmed;
      return c && c.key >= todayKey() ? c : null;
    }

    function renderBanner() {
      const banner = $('banner');
      banner.innerHTML = '';
      const c = state.confirmed;
      banner.hidden = !c;
      if (!c) return;

      const date = keyToDate(c.key);

      // 확정 날짜가 지났으면 "지난 모임"
      if (c.key < todayKey()) {
        banner.className = 'banner past';
        banner.append(h('div', 'banner-main', `지난 모임: ${shortLabel(date)}`));
        return;
      }

      banner.className = 'banner';
      const main = h('div', 'banner-main');
      const diff = Math.round((date - today) / 86400000);
      main.append(
        h('span', 'banner-title', `📌 ${shortLabel(date)} 모일날!`),
        h('span', 'dday', diff === 0 ? 'D-DAY' : `D-${diff}`)
      );
      const changeBtn = h('button', 'banner-btn', changing ? '닫기' : '변경');
      changeBtn.addEventListener('click', () => { changing = !changing; render(); });
      main.append(changeBtn);
      banner.append(main);

      // 확정한 뒤에 새로 "안 된다"고 한 사람이 있으면 경고
      const known = c.known || [];
      const newcomers = unavailablePeople(c.key).filter(p => !known.includes(p.id));
      if (newcomers.length) {
        banner.append(h('div', 'banner-warn',
          `⚠️ ${newcomers.map(p => p.name).join(', ')} 님이 이 날 안 된대요`));
      }
    }

    function confirmDate(date, key) {
      const people = unavailablePeople(key);
      const label = shortLabel(date);
      const prev = activeConfirmed();
      let title, desc;
      if (people.length) {
        title = `${people.length}명이 안 되는 날이에요. 그래도 확정할까요?`;
        desc = `${label} · 안 되는 사람: ${people.map(p => `${p.emoji} ${p.name}`).join(', ')}`;
      } else {
        title = `${label}로 확정할까요?`;
        desc = '모두 가능한 날이에요 🎉';
      }
      if (prev && prev.key !== key) desc += ` · 기존 확정(${shortLabel(keyToDate(prev.key))})은 취소돼요`;

      confirmSheet(title, desc, '확정하기', async () => {
        changing = false;
        const res = await write('set_confirmed_date', { p_day: key }, () => {
          state.confirmed = { key, known: people.map(p => p.id) };   // 확정은 한 번에 하나만
        });
        if (res.ok) toast(`📌 ${label}로 확정했어요`);
      }, 'primary');
    }

    function cancelConfirm(date) {
      confirmSheet('확정을 취소할까요?', `${shortLabel(date)} 확정이 취소돼요.`, '확정 취소', async () => {
        changing = false;
        const res = await write('set_confirmed_date', { p_day: null }, () => { state.confirmed = null; });
        if (res.ok) toast('확정을 취소했어요');
      });
    }

    // ===== 추천 날짜 =====
    // 지금 보고 있는 달에서(오늘·지난 날 제외): 안 되는 사람 적은 날 → 금·토·일 → 가까운 날 순서로 3개
    function recommendDates() {
      const list = [];
      const year = current.getFullYear();
      const month = current.getMonth();
      const lastDate = new Date(year, month + 1, 0).getDate();
      for (let d = 1; d <= lastDate; d++) {
        const date = new Date(year, month, d);
        if (date <= today) continue;
        const key = dateKey(year, month, d);
        const dow = date.getDay();
        list.push({
          date,
          key,
          count: unavailablePeople(key).length,
          weekend: dow === 5 || dow === 6 || dow === 0 ? 0 : 1,
          order: d
        });
      }
      list.sort((a, b) => a.count - b.count || a.weekend - b.weekend || a.order - b.order);
      return list.slice(0, 3);
    }

    function renderRecommend() {
      const rec = $('rec');
      const anyAnswered = state.participants.some(p => p.done);
      // 아직 아무도 응답 안 했거나, 확정된 날이 있으면(변경 중이 아닐 때) 숨김
      const recs = recommendDates();
      // 보고 있는 달에 추천할 날(오늘 이후)이 없어도 숨김
      const show = anyAnswered && (!activeConfirmed() || changing) && recs.length > 0;
      rec.hidden = !show;
      if (!show) return;

      $('recTitle').textContent = `✨ ${current.getMonth() + 1}월 추천`;

      const allAnswered = emptySlots() === 0 && state.participants.every(p => p.done);
      $('recPending').hidden = allAnswered;

      const box = $('recChips');
      box.innerHTML = '';
      for (const r of recs) {
        const d = r.date;
        const chip = h('button', 'rec-chip ' + (r.count === 0 ? 'ok' : 'some'),
          `${d.getMonth() + 1}/${d.getDate()} ${DOW[d.getDay()]}`);
        if (r.count > 0) chip.append(h('span', 'n', r.count));
        chip.addEventListener('click', () => goToDate(d, r.key));
        box.append(chip);
      }
    }

    // 모임을 열 때 보여줄 달: 확정 날짜의 달 → 오늘 이후 '안 되는 날' 표시가 가장 많은 달 → 이번 달
    function pickStartMonth() {
      const c = activeConfirmed();
      if (c) {
        const d = keyToDate(c.key);
        current = new Date(d.getFullYear(), d.getMonth(), 1);
        return;
      }
      const counts = {};   // { '2026-12': 표시 수 }
      const tk = todayKey();
      for (const [key, ids] of Object.entries(state.marks)) {
        if (key < tk || !ids.length) continue;
        const ym = key.slice(0, 7);
        counts[ym] = (counts[ym] || 0) + ids.length;
      }
      let best = null;
      for (const ym of Object.keys(counts).sort()) {   // 같은 수면 더 가까운 달
        if (!best || counts[ym] > counts[best]) best = ym;
      }
      if (best) {
        const [y, m] = best.split('-').map(Number);
        current = new Date(y, m - 1, 1);
      } else {
        current = new Date(today.getFullYear(), today.getMonth(), 1);
      }
    }

    // 달력을 그 달로 옮기고, 날짜 칸을 반짝인 뒤 상세 시트 열기
    function goToDate(date, key) {
      current = new Date(date.getFullYear(), date.getMonth(), 1);
      renderCalendar();
      renderRecommend();
      const cell = document.querySelector(`.cell[data-key="${key}"]`);
      if (cell) {
        cell.scrollIntoView({ behavior: 'smooth', block: 'center' });
        cell.classList.add('flash');
        cell.addEventListener('animationend', () => cell.classList.remove('flash'), { once: true });
      }
      setTimeout(() => showDayDetail(date, key), 700);
    }

    // ===== 설정 (⚙️) =====
    function openSettings() {
      openSheet(body => {
        body.append(h('h3', 'sheet-title', '설정'));
        const menu = h('div', 'menu');

        const newBtn = h('button', '', '➕ 새 모임 만들기');
        newBtn.addEventListener('click', () => { closeSheet(); createAndGo(); });

        const shareBtn = h('button', '', '📤 다른 모임에 모일날 알려주기');
        shareBtn.addEventListener('click', () => { closeSheet(); recommendApp(); });

        const resetBtn = h('button', '', '🔄 처음부터 다시 만들기');
        resetBtn.addEventListener('click', () => {
          confirmSheet('정말 처음부터 다시 만들까요?',
            '모든 참여자의 입력과 확정 날짜가 지워져요. 친구들 화면에도 바로 반영돼요. (24시간 안에는 되돌릴 수 있어요)',
            '처음부터', async () => {
              changing = false;
              const res = await write('reset_room', {}, () => {
                state.size = DEFAULT_SIZE;
                state.participants = [];
                state.marks = {};
                state.confirmed = null;
                state.selectedId = null;
                state.undoUntil = new Date(Date.now() + 86400000);
              });
              if (res.ok) toast('처음부터 다시 시작해요');
            });
        });

        menu.append(newBtn, shareBtn);
        if (!draft) menu.append(resetBtn);   // 임시 모임은 지울 게 없음
        body.append(menu);

        // 내 모임 목록 (지금 모임 포함). 오른쪽 ⋯ 로 이름 바꾸기 / 목록에서 삭제 / 모임 삭제
        if (local.rooms.length) {
          body.append(h('div', 'sheet-section', '내 모임'));
          const list = h('div', 'room-list');
          for (const r of local.rooms) {
            const isCurrent = r.id === roomId;
            const row = h('div', 'room-row' + (isCurrent ? ' current' : ''));
            const main = h('button', 'room-main');
            const sub = [isCurrent ? '지금 보는 모임' : whenLabel(r.visitedAt), r.label].filter(Boolean).join(' · ');
            main.append(h('span', 'room-name', r.name || DEFAULT_ROOM_NAME), h('span', 'room-sub', sub));
            main.addEventListener('click', () => { if (isCurrent) closeSheet(); else goRoom(r.id); });
            const more = h('button', 'more-btn', '⋯');
            more.setAttribute('aria-label', `${r.name || DEFAULT_ROOM_NAME} 더보기`);
            more.addEventListener('click', () => openRoomMore(r));
            row.append(main, more);
            list.append(row);
          }
          body.append(list);
        }
      });
    }

    // 내 모임 항목의 ⋯ 메뉴
    function openRoomMore(r) {
      const name = r.name || DEFAULT_ROOM_NAME;
      openSheet(body => {
        body.append(h('h3', 'sheet-title', name));
        const menu = h('div', 'menu');

        const renameBtn = h('button', '', '✏️ 이름 바꾸기');
        renameBtn.addEventListener('click', () => openRename(r.id, name));

        const removeBtn = h('button', '', '🙈 내 목록에서 삭제');
        removeBtn.addEventListener('click', () => {
          confirmSheet('내 목록에서 삭제할까요?',
            '내 목록에서만 사라져요. 친구들은 계속 볼 수 있고, 링크로 다시 들어올 수 있어요',
            '목록에서 삭제', () => {
              forgetRoom(r.id);
              if (r.id === roomId) leaveCurrent(`'${name}'을(를) 내 목록에서 삭제했어요`);
              else toast('내 목록에서 삭제했어요');
            }, 'primary');
        });

        const deleteBtn = h('button', 'danger-text', '🗑️ 모임 삭제');
        deleteBtn.addEventListener('click', () => {
          confirmSheet(`'${name}' 모임을 삭제할까요?`,
            '모든 참여자에게서 이 모임이 삭제돼요. 24시간 안에는 복구할 수 있어요. 삭제할까요?',
            '삭제', () => deleteRoom(r.id, name));
        });

        menu.append(renameBtn, removeBtn, deleteBtn);
        body.append(menu);
      });
    }

    // 모임 이름 바꾸기 팝업 (지금 모임 / 목록의 다른 모임 모두)
    function openRename(id, currentName) {
      let input;
      openSheet(body => {
        body.className = 'add-sheet';
        body.append(h('h3', 'sheet-title', '모임 이름'),
                    h('p', 'sheet-desc', '친구들 화면에도 바로 바뀌어요.'));
        const row = h('div', 'add-row');
        input = h('input');
        input.type = 'text';
        input.value = currentName;
        input.maxLength = 20;
        input.autocomplete = 'off';
        const saveBtn = h('button', 'save-btn', '저장');
        row.append(input, saveBtn);
        body.append(row);

        let saving = false;
        const submit = async () => {
          if (saving) return;
          const name = input.value.trim();
          if (!name) return toast('모임 이름을 입력해주세요');
          if (name === currentName) return closeSheet();
          saving = true;
          saveBtn.disabled = true;
          const res = id === roomId
            ? await write('set_room_name', { p_name: name }, () => { state.name = name; })
            : await runRpc('set_room_name', { p_room_id: id, p_name: name });
          saving = false;
          saveBtn.disabled = false;
          if (!res.ok) return;
          setLocalName(id, name);
          closeSheet();
          toast('모임 이름을 바꿨어요');
        };
        saveBtn.addEventListener('click', submit);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); }
        });
      }, 'top');
      input.focus();
      input.select();
    }

    // 모임 삭제 (모든 참여자에게서 삭제, 24시간 안에 복구 가능)
    async function deleteRoom(id, name) {
      const res = await runRpc('delete_room', { p_room_id: id });
      if (!res.ok) return;
      forgetRoom(id);
      const msg = `'${name}' 모임을 삭제했어요. 24시간 안에는 링크로 들어가 복구할 수 있어요`;
      if (id === roomId) leaveCurrent(msg);
      else toast(msg);
    }

    // 삭제된 모임 화면: 24시간 이내면 [복구], 지났으면 [새 모임 만들기]
    function showDeleted(data) {
      closeSheet();
      const until = data.restore_until ? new Date(data.restore_until) : null;
      const canRestore = until && until > new Date();
      if (!canRestore) forgetRoom(roomId);
      showStatus('삭제된 모임이에요',
        canRestore
          ? { label: '복구', onClick: restoreRoom }
          : { label: '새 모임 만들기', onClick: createAndGo },
        canRestore ? `'${data.name}' · 24시간 안에는 복구할 수 있어요` : `'${data.name}'`);
    }

    async function restoreRoom() {
      const res = await runRpc('restore_room', { p_room_id: roomId });
      if (!res.ok) return;
      toast('모임을 복구했어요');
      refetch();
    }

    async function undoReset() {
      const res = await write('undo_reset', {});
      if (res.ok) {
        state.undoUntil = null;
        toast('되돌렸어요');
        render();
      }
    }

    function renderUndoBar() {
      $('undoBar').hidden = !(state.undoUntil && state.undoUntil > new Date());
    }

    // ===== 공유 =====
    const APP_URL = 'https://moilnal.github.io/';   // 배포 주소 (파라미터 없음)

    // 글을 클립보드에 복사. 안 되면 직접 복사할 수 있게 팝업으로 보여줌
    async function copyText(text, successMsg, fallbackTitle) {
      try {
        // 권한 확인 등으로 응답이 늦어지면 1.5초 뒤 직접 복사 화면으로
        await Promise.race([
          navigator.clipboard.writeText(text),
          new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 1500))
        ]);
        toast(successMsg);
      } catch (e) {
        openSheet(body => {
          body.append(h('h3', 'sheet-title', fallbackTitle),
                      h('p', 'sheet-desc', '아래 내용을 길게 눌러 복사한 뒤 단톡에 붙여넣으세요.'));
          const box = h('textarea', 'copy-input');
          box.readOnly = true;
          box.rows = 3;
          box.value = text;
          body.append(box);
          box.addEventListener('focus', () => box.select());
        });
      }
    }

    // 👋 멤버 초대: 이 모임 링크가 담긴 초대 메시지
    async function inviteMembers() {
      if (draft) {   // 초대 링크에는 모임 ID가 필요하니 먼저 서버에 모임을 만듦
        pending++;
        setBusy();
        try { await ensureRoom(); }
        catch (e) { return toast(NETWORK_ERROR); }
        finally { pending--; setBusy(); }
      }
      const url = location.origin + location.pathname + '?g=' + encodeURIComponent(roomId);
      copyText(`[${state.name}] 모일날에서 안 되는 날 체크해줘! 📅\n${url}`,
        '초대 메시지를 복사했어요! 단톡에 붙여넣으세요',
        '초대 메시지');
    }

    // 📤 다른 모임에 모일날 알려주기: ?new 주소 (받은 사람은 항상 새 빈 모임으로 시작)
    function recommendApp() {
      copyText(`약속 날짜 잡을 때 써봐! 안 되는 날만 체크하면 돼 📅\n${APP_URL}?new`,
        '추천 메시지를 복사했어요! 받은 사람은 새 모임으로 시작해요',
        '모일날 추천 메시지');
    }

    // ===== 달력 =====
    function toggleMark(key) {
      const me = state.selectedId;
      write('toggle_unavailable', { p_member_id: me, p_day: key }, () => {
        const list = state.marks[key] || [];
        const i = list.indexOf(me);
        if (i >= 0) list.splice(i, 1);
        else list.push(me);
        if (list.length) state.marks[key] = list;
        else delete state.marks[key];
      });
    }

    // 그날 안 되는 사람들 (입력 중인 사람이 맨 앞)
    function unavailablePeople(key) {
      const ids = state.marks[key] || [];
      return state.participants
        .filter(p => ids.includes(p.id))
        .sort((a, b) => (b.id === state.selectedId) - (a.id === state.selectedId));
    }

    function showDayDetail(date, key) {
      const people = unavailablePeople(key);
      openSheet(body => {
        body.append(h('h3', 'sheet-title',
          `${date.getMonth() + 1}월 ${date.getDate()}일 (${DOW[date.getDay()]})`));
        if (state.participants.length === 0) {
          body.append(h('p', 'sheet-desc', '아직 참여자가 없어요.'));
        } else if (people.length === 0) {
          body.append(h('p', 'sheet-desc', '모두 가능해요 🎉'));
        } else {
          body.append(h('p', 'sheet-desc', `${people.length}명 안 됨`));
          const ul = h('ul', 'who-list');
          for (const p of people) {
            const li = h('li');
            li.append(h('span', 'emo', p.emoji), h('span', '', p.name));
            ul.append(li);
          }
          body.append(ul);
        }

        // 보기 모드에서만 확정/확정 취소 버튼 (지난 날짜·오늘은 확정 불가)
        if (state.selectedId) return;
        const active = activeConfirmed();
        const actions = h('div', 'sheet-actions');
        if (active && active.key === key) {
          const btn = h('button', 'btn ghost full', '확정 취소');
          btn.addEventListener('click', () => cancelConfirm(date));
          actions.append(btn);
        } else if (date > today && (!active || changing)) {
          const btn = h('button', 'btn primary full', '📌 이 날로 확정하기');
          btn.addEventListener('click', () => confirmDate(date, key));
          actions.append(btn);
        }
        if (actions.children.length) body.append(actions);
      });
    }

    function renderCalendar() {
      const year = current.getFullYear();
      const month = current.getMonth();
      $('title').textContent = `${year}년 ${month + 1}월`;

      const grid = $('grid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) grid.append(h('div'));

      for (let d = 1; d <= lastDate; d++) {
        const date = new Date(year, month, d);
        const key = dateKey(year, month, d);
        const cell = h('div', 'cell');
        cell.dataset.key = key;
        const dow = date.getDay();
        const isPast = date < today;

        if (dow === 0) cell.classList.add('sun');
        if (dow === 6) cell.classList.add('sat');
        if (isPast) cell.classList.add('past');
        if (date.getTime() === today.getTime()) cell.classList.add('today');

        cell.append(h('span', 'num', d));

        if (state.confirmed && state.confirmed.key === key) {
          cell.classList.add('confirmed');
          cell.append(h('span', 'pin', '📌'));
        }

        const people = unavailablePeople(key);
        if (people.length > 0) {
          // 전체 인원 중 안 되는 사람 비율이 높을수록 배경을 진하게
          const ratio = Math.min(1, people.length / state.size);
          cell.style.background = `rgba(var(--no-rgb), ${(0.08 + 0.4 * ratio).toFixed(2)})`;

          const faces = h('div', 'faces');
          for (const p of people.slice(0, MAX_FACES)) {
            const face = h('span', 'face' + (p.id === state.selectedId ? ' mine' : ''), p.emoji);
            face.append(h('i', 'x', '×'));
            faces.append(face);
          }
          if (people.length > MAX_FACES) faces.append(h('span', 'more', `+${people.length - MAX_FACES}`));
          cell.append(faces, h('span', 'cnt', `${people.length}명`));
        } else if (state.participants.length > 0 && !isPast) {
          cell.classList.add('allok');
        }

        if (!isPast) {
          onPress(cell,
            () => {
              if (state.selectedId) toggleMark(key);   // 입력 모드: 내 X 토글
              else showDayDetail(date, key);           // 보기 모드: 그날 안 되는 사람 보기
            },
            () => showDayDetail(date, key)              // 길게 누르기: 항상 상세 보기
          );
        }

        grid.append(cell);
      }
    }

    function render() {
      if (!roomId && !draft) return;
      renderTitle();
      renderUndoBar();
      renderPeople();
      renderCalendar();
    }

    // ===== 로딩 / 오류 화면 =====
    function showStatus(text, button, subText) {
      $('main').hidden = true;
      $('linkBtn').hidden = true;
      $('gearBtn').hidden = true;
      $('undoBar').hidden = true;
      $('roomTitleRow').hidden = true;
      const box = $('status');
      box.hidden = false;
      box.innerHTML = '';
      box.append(h('div', '', text));
      if (subText) box.append(h('div', 'sub', subText));
      if (button) {
        const btn = h('button', 'btn primary full', button.label);
        btn.addEventListener('click', button.onClick);
        box.append(btn);
      }
    }

    function showNotFound() {
      roomId = null;
      showStatus('모임을 찾을 수 없어요. 링크가 맞는지 확인해주세요.',
        { label: '새 모임 만들기', onClick: createAndGo });
    }

    function showMain() {
      $('status').hidden = true;
      $('main').hidden = false;
      $('linkBtn').hidden = false;
      $('gearBtn').hidden = false;
      $('roomTitleRow').hidden = false;
    }

    function renderTitle() {
      $('roomTitleText').textContent = state.name;
      document.title = `${state.name} · 모일날`;
    }

    // ===== 실시간: 모임 ID 이름의 broadcast 채널 =====
    // 서버가 저장할 때마다 'changed' 신호를 보냄 → 받으면 get_room 으로 다시 불러오기
    function subscribe() {
      let first = true;
      db.channel(roomId)
        .on('broadcast', { event: 'changed' }, () => scheduleRefetch())
        .subscribe(status => {
          if (status === 'SUBSCRIBED') {
            if (!first) scheduleRefetch();   // 다시 연결되면 놓친 변경이 있을 수 있으니 한 번 불러오기
            first = false;
          }
        });
    }

    // 다른 앱에 갔다가 돌아오면 최신 상태로
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && roomId) scheduleRefetch();
    });

    // ===== 시작 =====
    async function init() {
      if (!db) {
        return showStatus(NETWORK_ERROR, { label: '다시 시도', onClick: () => location.reload() });
      }

      const params = new URLSearchParams(location.search);

      // ?new: 최근 모임과 상관없이 새 빈 모임. 서버에는 첫 입력 때 만듦
      if (params.has('new')) {
        draft = true;
        roomId = null;
        showMain();
        render();
        const flash = takeFlash();
        if (flash) toast(flash);
        return;
      }

      let id = params.get('g');
      const fromList = !id;
      let data;

      try {
        if (!id) {
          // 링크 없이 열면: 최근 모임 → 없으면 새 모임
          id = local.rooms.length ? local.rooms[0].id : await callRpc('create_room', {});
          const url = location.pathname + '?g=' + encodeURIComponent(id);
          try { history.replaceState(null, '', url); }
          catch (e) { location.replace(url); return; }
        }

        roomId = id;
        data = await callRpc('get_room', { p_room_id: id });
      } catch (err) {
        if (err && err.message === 'room_not_found') {
          forgetRoom(id);
          if (fromList) {   // 내 목록의 모임이 사라졌으면(90일 미접속 삭제 등) 다시 시작
            const url = location.pathname;
            try { history.replaceState(null, '', url); } catch (e) {}
            return init();
          }
          return showNotFound();
        }
        roomId = null;
        return showStatus(NETWORK_ERROR, { label: '다시 시도', onClick: () => location.reload() });
      }

      if (data.deleted) {
        if (fromList) {   // 내 목록의 최근 모임이 삭제됐으면 목록에서 빼고 다음 모임으로
          forgetRoom(id);
          try { history.replaceState(null, '', location.pathname); } catch (e) {}
          return init();
        }
        subscribe();      // 친구가 복구하면 바로 다시 보이도록 알림은 계속 받음
        return showDeleted(data);
      }

      applyRoom(data);
      pickStartMonth();
      rememberRoom(true);
      showMain();
      render();
      subscribe();

      // 다른 모임에서 넘어올 때 남긴 안내가 있으면 그걸, 없으면 재접속 인사
      const flash = takeFlash();
      const me = findPerson(local.me[roomId]);
      if (flash) toast(flash);
      else if (me) toast(`${me.emoji} ${me.name} 님 반가워요 👋`);
    }

    // ===== 이벤트 연결 =====
    $('minusBtn').addEventListener('click', () => changeSize(-1));
    $('plusBtn').addEventListener('click', () => changeSize(1));
    $('gearBtn').addEventListener('click', openSettings);
    $('linkBtn').addEventListener('click', inviteMembers);
    $('roomTitle').addEventListener('click', () => openRename(roomId, state.name));
    $('undoBtn').addEventListener('click', undoReset);

    $('prev').addEventListener('click', () => {
      current.setMonth(current.getMonth() - 1);
      renderCalendar();
      renderRecommend();
    });
    $('next').addEventListener('click', () => {
      current.setMonth(current.getMonth() + 1);
      renderCalendar();
      renderRecommend();
    });

    init();
  </script>
</body>
</html>
