<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>모일날</title>
  <meta name="description" content="안 되는 날만 콕! 모두 되는 날을 찾아드려요">

  <!-- 카톡 등 공유 미리보기 (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="모일날">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="모일날 · 우리 언제 모일까? 📅">
  <meta property="og:description" content="안 되는 날만 콕! 모두 되는 날을 찾아드려요">
  <meta property="og:url" content="https://moilnal.github.io/">

  <meta property="og:image:alt" content="모일날 - 우리 언제 모일까?">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="모일날 · 우리 언제 모일까? 📅">
  <meta name="twitter:description" content="안 되는 날만 콕! 모두 되는 날을 찾아드려요">
  <meta name="twitter:image" content="https://moilnal.github.io/og-image.png?v=4">
  <meta name="theme-color" content="#fff8ee">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    /* 디자인 시스템 "밝고 경쾌하게" (CLAUDE.md 디자인 시스템 참고) */
    :root {
      --bg: #fff8ee;          /* 크림 배경 */
      --card: #ffffff;
      --text: #3a2a1f;        /* 진한 갈색 본문 */
      --muted: #8a7262;       /* 보조 글씨 */
      --line: #f0e4d6;        /* 얇은 테두리·구분선 */
      --accent: #ff7a59;      /* 코랄 포인트: 주요 버튼, 확정, 강조 칩 */
      --accent-soft: #ffe9e1; /* 연한 코랄: 오늘, 선택된 칩 */
      --accent-deep: #ff7a59; /* 확정된 날 (포인트와 같은 코랄) */
      --accent-text: #e85a37; /* 코랄을 글씨로 쓸 때 */
      --ok: #2bb3a3;          /* 청록: 모두 가능한 날, 응답 완료 */
      --ok-soft: #dff5f1;
      --ok-text: #16786d;     /* 청록을 글씨로 쓸 때 */
      --no-soft: #ffe6cc;     /* 주황: 안 되는 날 (연함 → 진함) */
      --no-deep: #ffc999;
      --no-text: #b85a1f;
      --sat: #3d8bfd;
      --sun: #ff5a5f;
      --ink: #3a2a1f;         /* 스티커 테두리·그림자 */
      --ink-border: 1.5px solid var(--ink); /* 카드·주요 버튼 테두리 (그림자 없음) */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px calc(96px + env(safe-area-inset-bottom)); /* 아래: 탭 바 높이만큼 */
    }

    button { font-family: inherit; color: inherit; }

    .app { max-width: 420px; margin: 0 auto; }

    /* ---------- 상단: 앱 이름 + 설정 ---------- */
    .top { position: relative; margin-bottom: 16px; }

    /* 앱 이름은 작게 (그 아래 모임명이 크게) */
    h1 {
      font-weight: 800;
      font-size: 15px;
      line-height: 40px;
      text-align: center;
      color: var(--accent-text);
    }

    .gear {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: none;
      font-size: 18px;
      cursor: pointer;
      opacity: 0.6;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      border: var(--ink-border);
    }

    /* ---------- 참여자 영역 ---------- */
    .people { padding: 12px 14px 14px; margin-bottom: 12px; }

    /* 맨 위 한 줄: 인원 조절 + 진행 상황 */
    .people-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stepper { display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; }
    .stepper .icon { font-size: 16px; margin-right: 2px; }
    .stepper button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }
    .stepper button:disabled { opacity: 0.35; cursor: default; }
    #sizeLabel { min-width: 36px; text-align: center; }

    .progress { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .bar {
      width: 56px;
      height: 6px;
      border-radius: 3px;
      background: var(--line);
      overflow: hidden;
    }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }
    .progress.all { color: var(--ok-text); }
    .progress.all .bar i { background: var(--ok); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .chip {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 12px 0 3px;
      border: 2px solid var(--line);
      border-radius: 19px;
      background: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .chip.pending { opacity: 0.6; }           /* 아직 응답 안 한 사람: 살짝 흐리게 */
    .chip.sel { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
    .chip.empty {
      border-style: dashed;
      border-color: #d9c6b2;
      background: #fffcf7;
      color: var(--muted);
    }

    /* 칩의 이모지 부분: 탭하면 이모지 변경 */
    .chip .emo {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fbf3ea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }
    .chip.sel .emo { background: #fff; }
    .chip.empty .emo { background: none; font-size: 15px; }
    /* 이 기기의 "나"가 없을 때 첫 빈자리: 강조색으로 채운 "＋ 내 이름 넣기" */
    .chip.empty.first {
      border-style: solid;
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .chip.empty.first .emo { font-size: 17px; font-weight: 800; }

    /* 칩의 이름 부분: 탭하면 입력 모드 */
    .chip .nm { padding-left: 7px; line-height: 34px; }
    .chip .check { margin-left: 4px; color: var(--ok-text); font-weight: 800; }

    /* 추천 줄: "✨ 추천" + 날짜 칩 3개 */
    /* 후보 줄: "✨ 12월 후보" + 날짜 칩 최대 5개 (가로 스크롤, 마지막 칩이 살짝 잘려 보이게) */
    .rec {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .rec[hidden] { display: none; }
    .rec-label { display: flex; align-items: baseline; gap: 6px; font-size: 13px; font-weight: 700; }
    .rec-label small { font-size: 11px; font-weight: 600; color: var(--muted); }
    .rec-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      padding: 6px 6px 6px 12px;
      border-radius: 12px;
      background: var(--accent-deep);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .rec-top[hidden] { display: none; }
    .rec-chips {
      display: flex;
      gap: 6px;
      margin: 8px -14px 0 0;
      padding-right: 14px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .rec-chips::-webkit-scrollbar { display: none; }
    .rec-chip {
      flex: 0 0 29%;
      padding: 7px 4px;
      border: 1.5px solid;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .rec-chip .rc-date { font-size: 13px; font-weight: 800; }
    .rec-chip .rc-heart { color: var(--accent-text); }
    .rec-chip .rc-time { color: var(--text); }
    .rec-chip.ok { background: var(--ok-soft); border-color: #a9e2d9; color: var(--ok-text); }
    .rec-chip.some { background: var(--no-soft); border-color: var(--no-deep); color: var(--no-text); }
    .rec-chip.mine { box-shadow: 0 0 0 2px var(--accent); }

    /* ❤️ 투표 시트 */
    .heart-btn {
      width: 100%;
      height: 48px;
      border: 1.5px solid #ffc9b8;
      border-radius: 14px;
      background: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .heart-btn.on { background: var(--accent-soft); border-color: var(--accent); }
    .pick-label { margin: 16px 0 8px; font-size: 14px; font-weight: 700; }

    /* 범위 슬라이더 (손잡이 44px) */
    .range { padding: 0 22px; }
    .range.off { opacity: 0.4; pointer-events: none; }
    .range-text { text-align: center; font-size: 15px; font-weight: 700; color: var(--accent-text); margin-bottom: 8px; }
    .range-track { position: relative; height: 44px; touch-action: none; }
    .range-track::before {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 19px;
      height: 6px;
      border-radius: 3px;
      background: #f6ebde;
    }
    .range-fill { position: absolute; top: 19px; height: 6px; border-radius: 3px; background: var(--accent); }
    .range-knob {
      position: absolute;
      top: 0;
      width: 44px;
      height: 44px;
      margin-left: -22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 3px var(--accent);
      touch-action: none;
      cursor: grab;
    }
    .range-ticks { position: relative; height: 16px; font-size: 11px; color: var(--muted); }
    .range-ticks span { position: absolute; transform: translateX(-50%); }

    /* 확정 시트: 시각 칩 한 줄 */
    .hour-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .hour-chips::-webkit-scrollbar { display: none; }
    .hour-chip {
      flex: none;
      height: 36px;
      padding: 0 12px;
      border: 1.5px solid #eadccb;
      border-radius: 18px;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .hour-chip.on { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }

    /* 상세 시트: ❤️ 줄 + 시간 타임라인 */
    .hearts-row { margin: 4px 0 12px; font-size: 15px; font-weight: 700; }
    .timeline { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .tl-row { display: flex; align-items: center; gap: 8px; height: 26px; }
    .tl-who { width: 24px; text-align: center; font-size: 17px; }
    .tl-bar { position: relative; flex: 1; height: 10px; border-radius: 5px; background: #f6ebde; }
    .tl-bar i { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: #ffb8a3; }
    .tl-row.all .tl-bar i { background: var(--ok); }
    .tl-more { margin: 2px 0 4px 32px; border: none; background: none; color: var(--accent-text); font-size: 13px; font-weight: 700; cursor: pointer; }
    .tl-scale { position: relative; height: 14px; margin-left: 32px; font-size: 10px; color: var(--muted); }
    .tl-scale span { position: absolute; transform: translateX(-50%); }
    .tl-sum { margin-top: 6px; font-size: 14px; font-weight: 700; color: var(--ok-text); }
    .tl-basis { margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--muted); }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }
    .hint:empty { display: none; }

    /* 이 기기의 "나" 칩 표시 */
    .chip .me-tag {
      margin-left: 5px;
      padding: 1px 5px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.4;
    }
    .chip.sel .me-tag { background: #fff; }
    /* [✏️ 🐸 내 안 되는 날 찍기] */
    .mark-btn {
      height: 36px;
      padding: 0 14px;
      border: 1.5px solid var(--accent);
      border-radius: 10px;
      background: var(--card);
      color: var(--accent-text) !important;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 입력 모드 안내: "멍청 님 입력 중" + 완료 */
    .hint.editing {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--accent-soft);
      border-radius: 12px;
      padding: 6px 6px 6px 12px;
      color: var(--text);
    }
    .hint.editing b { font-weight: 700; }
    .done-btn {
      height: 34px;
      padding: 0 16px;
      flex-shrink: 0;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff !important;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .done-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .done-btn.ghost {
      padding: 0 12px;
      background: var(--card);
      color: var(--accent-text) !important;
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }

    /* ---------- 달력 ---------- */
    .calendar { padding: 14px 4px 16px; }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      margin-bottom: 8px;
    }

    .month-nav button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-size: 22px;
      cursor: pointer;
    }
    .month-nav button:active { background: #ffd9cc; }

    #title { font-size: 19px; font-weight: 700; }

    .weekdays, #grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
    }

    .weekdays div {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      padding: 6px 0;
    }

    .cell {
      min-height: 66px;
      min-width: 0;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 0;
      container-type: inline-size;   /* 이모지 크기를 칸 폭 기준으로 정하기 위함 */
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      transition: background 0.15s;
    }

    .num {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
    }

    .weekdays .sun, .cell.sun .num { color: var(--sun); }
    .weekdays .sat, .cell.sat .num { color: var(--sat); }

    .cell.past { opacity: 0.35; cursor: default; }

    /* 추천 칩을 눌렀을 때 해당 날짜 칸이 잠깐 반짝임 */
    @keyframes flash {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 122, 89, 0); transform: scale(1); }
      25%, 75% { box-shadow: 0 0 0 3px var(--accent); transform: scale(1.08); }
      50% { box-shadow: 0 0 0 3px rgba(255, 122, 89, 0.3); transform: scale(1); }
    }
    .cell.flash { animation: flash 0.9s ease; position: relative; z-index: 1; }

    /* 모두 가능한 날: 초록 동그라미 테두리 */
    .cell.allok .num { box-shadow: 0 0 0 2px var(--ok); }

    /* 오늘: 보라색으로 채운 숫자 */
    .cell.today .num { background: var(--accent-soft); color: var(--accent-text); font-weight: 800; }

    /* 확정된 날: 진한 보라색으로 꽉 찬 동그라미 + 📌, 다른 표시보다 눈에 띄게 */
    .cell.confirmed { position: relative; box-shadow: inset 0 0 0 2px var(--accent-deep); }
    .cell.confirmed .num {
      width: 26px;
      height: 26px;
      background: var(--accent-deep);
      color: #fff;
      font-weight: 800;
      box-shadow: none;              /* 모두 가능 테두리 대신 꽉 찬 코랄만 */
    }
    .cell .pin { position: absolute; top: 1px; right: 2px; font-size: 10px; line-height: 1; }

    /* 이모지 최대 2개 + "+n", 한 줄로 겹치지 않게 */
    .faces {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 3px;               /* X 배지가 옆 이모지를 덮지 않을 만큼 띄움 */
      line-height: 1;
      max-width: 100%;
    }

    /* 칸 폭에 맞춰 이모지 크기를 살짝 줄여서 좁은 폰에서도 한 줄에 들어가게 */
    .face {
      position: relative;
      font-size: min(11px, 22cqw);
      line-height: 1;
    }

    .face .x {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 0 0 0 1px #fff;
      color: #fff;
      font-size: 7px;
      font-style: normal;
      font-weight: 800;
      line-height: 8px;
      text-align: center;
    }

    /* 지금 입력 중인 사람의 X는 조금 더 크게 */
    .face.mine .x {
      right: -3px;
      bottom: -3px;
      width: 11px;
      height: 11px;
      font-size: 9px;
      line-height: 11px;
    }

    .more { font-size: 9px; font-weight: 700; letter-spacing: -0.3px; }

    .cnt {
      margin-top: auto;
      font-size: 10px;
      font-weight: 700;
      color: var(--no-text);
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .lg-today { width: 12px; height: 12px; border-radius: 50%; background: var(--accent-soft); box-shadow: inset 0 0 0 1px #ffc9b8; }
    .lg-confirm { width: 12px; height: 12px; border-radius: 50%; background: var(--accent-deep); }
    .lg-ok { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ok); }

    .legend-tip {
      margin-top: 6px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ---------- 팝업 (하단 시트 / 위쪽 작은 팝업) ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(58, 42, 31, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      margin: 0 auto;
      background: #fff;
      border-radius: 22px 22px 0 0;
      padding: 10px 20px 28px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }
    .overlay.show .sheet { transform: none; }

    /* 이름 입력 팝업은 키보드에 가리지 않게 화면 위쪽에 띄움 */
    .overlay.top .sheet {
      top: 12vh;
      bottom: auto;
      left: 16px;
      right: 16px;
      max-width: 388px;
      border-radius: 20px;
      padding: 18px 18px 20px;
      transform: translateY(-16px);
    }
    .overlay.top.show .sheet { transform: none; }
    .overlay.top .handle { display: none; }

    .handle {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--line);
      margin: 0 auto 14px;
    }

    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .sheet-desc { font-size: 14px; color: var(--muted); margin-bottom: 16px; }

    .who-list { list-style: none; }
    .who-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
      font-weight: 600;
    }
    .who-list li:last-child { border-bottom: none; }
    .who-list .emo { font-size: 22px; }

    /* "누구를 뺄까요?" 선택 목록 */
    .pick-list { display: flex; flex-direction: column; gap: 8px; }
    .pick-list button {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 50px;
      padding: 0 14px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
      font-size: 16px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .pick-list .emo { font-size: 22px; }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .emoji-grid button {
      aspect-ratio: 1;
      border: 2px solid transparent;
      border-radius: 14px;
      background: #fffaf3;
      font-size: 26px;
      cursor: pointer;
    }
    .emoji-grid button.cur { border-color: var(--accent); background: var(--accent-soft); }
    .emoji-grid button:disabled { opacity: 0.2; cursor: default; }

    /* 빈자리 채우기 팝업: 이모지 버튼 + 이름 입력 + 저장 */
    .add-row { display: flex; gap: 8px; }
    .emoji-btn {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #fffcf7;
      font-size: 22px;
      cursor: pointer;
    }
    .add-row input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: #fffcf7;
      outline: none;
    }
    .add-row input:focus { border-color: var(--accent); }
    .save-btn {
      height: 46px;
      padding: 0 16px;
      border: var(--ink-border);
      border-radius: 12px;
      background: var(--accent);
      color: #fff !important;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .add-sheet .emoji-grid { margin-top: 14px; }
    .add-sheet .emoji-grid button { font-size: 22px; border-radius: 12px; }

    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      height: 48px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.ghost { background: #f6ebde; }
    .btn.danger { background: var(--sun); color: #fff; }
    .btn.primary { background: var(--accent); color: #fff; border: var(--ink-border); }
    .sheet-actions { margin-top: 18px; }

    /* 확정 배너 (추천 줄 자리) */
    .banner {
      margin-top: 12px;
      padding: 10px 10px 10px 12px;
      border-radius: 14px;
      background: var(--accent-deep);
      color: #fff;
      border: var(--ink-border);
    }
    .banner[hidden] { display: none; }
    .banner-main { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
    .banner-title { flex: 1; min-width: 0; }
    .dday {
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.22);
      font-size: 12px;
      font-weight: 800;
    }
    .banner-btn {
      height: 28px;
      padding: 0 10px;
      border: none;
      border-radius: 9px;
      background: #fff;
      color: var(--accent-text) !important;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .banner-warn {
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 9px;
      background: #fff4d6;
      color: #8a5a00;
      font-size: 13px;
      font-weight: 600;
    }
    .banner.past { background: #f6ebde; color: var(--muted); border-color: var(--line); }
    .banner.past .banner-main { font-size: 14px; }
    .btn.full { width: 100%; flex: none; }

    /* ---------- 안내 토스트 ---------- */
    .toast {
      position: fixed;
      left: 50%;
      top: 70px;                     /* 실제 위치는 toast()에서 상단 버튼 줄 바로 아래로 */
      transform: translate(-50%, -10px);
      background: rgba(58, 42, 31, 0.92);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 20px;
      width: max-content;
      max-width: calc(100vw - 32px);
      text-align: center;
      line-height: 1.4;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- 공유 버전 추가 ---------- */
    /* 상단 왼쪽: 멤버 초대 */
    .link-btn {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 34px;
      padding: 0 12px;
      border-radius: 17px;
      background: var(--accent);
      border: var(--ink-border);
      color: #fff !important;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    /* 이 기기의 "나"가 아직 없을 때: 테두리만 있는 보조 버튼 */
    .link-btn.quiet {
      background: transparent;
      box-shadow: none;
      border: 1.5px solid #d9c6b2;
      color: var(--muted) !important;
    }

    /* 저장 중일 때 화면 맨 위 얇은 진행 표시 */
    .busy-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent) no-repeat;
      background-size: 50% 100%;
      animation: busy 1s linear infinite;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 30;
    }
    .busy-bar.show { opacity: 1; }
    @keyframes busy {
      from { background-position: -100% 0; }
      to { background-position: 200% 0; }
    }

    /* 초기화 되돌리기 배너 */
    .undo-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 8px 8px 14px;
      border-radius: 14px;
      background: #fff4d6;
      color: #8a5a00;
      font-size: 14px;
      font-weight: 600;
    }
    .undo-bar[hidden] { display: none; }
    .undo-bar button {
      height: 32px;
      padding: 0 14px;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #8a5a00 !important;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 로딩 / 오류 화면 */
    .status {
      padding: 56px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
    .status .btn { display: block; margin: 18px auto 0; max-width: 240px; }
    .status[hidden], .main[hidden] { display: none; }

    /* 설정 시트 */
    .menu { display: flex; flex-direction: column; gap: 8px; }
    .menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 0 14px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .menu .room-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .menu .room-when { flex: none; font-size: 12px; color: var(--muted); font-weight: 500; }
    .sheet-section { margin: 20px 0 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .menu button.danger-text { color: var(--sun) !important; }

    /* 모임명 (앱 이름 아래 크게, 탭하면 이름 수정) */
    .room-title-row { text-align: center; margin: -10px 0 14px; }
    .room-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 4px 8px;
      border: none;
      border-radius: 10px;
      background: none;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      cursor: pointer;
    }
    .room-title-row[hidden] { display: none; }
    .room-title .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room-title .pen { flex: none; font-size: 14px; opacity: 0.55; }

    /* 내 모임 목록: 이름 + 정보, 오른쪽 ⋯ */
    .room-list { display: flex; flex-direction: column; gap: 8px; }
    .room-row {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }
    .room-row.current { border-color: var(--accent); background: var(--accent-soft); }
    .room-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 9px 4px 9px 14px;
      border: none;
      background: none;
      text-align: left;
      cursor: pointer;
    }
    .room-name { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .more-btn {
      flex: none;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: none;
      font-size: 20px;
      font-weight: 800;
      color: var(--muted) !important;
      cursor: pointer;
    }
    .status .sub { font-size: 13px; margin-top: 4px; }
    .copy-input {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      resize: none;
    }

    /* ---------- 단계: 날짜 / 장소 / 정산 (body data-tab) ---------- */
    body:not([data-tab="date"]) .date-only,
    body:not([data-tab="date"]) .hint.editing,
    body:not([data-tab="place"]) .place-only,
    body:not([data-tab="settle"]) .settle-only { display: none !important; }

    /* 날짜 확정 뒤 "📍 장소도 정할까요? →" */
    .place-nudge {
      display: block;
      width: 100%;
      height: 34px;
      margin-top: 8px;
      border: 1.5px dashed #d9c6b2;
      border-radius: 12px;
      background: transparent;
      color: var(--accent-text) !important;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .place-nudge[hidden] { display: none; }

    /* 장소·정산: 곧 열려요 */
    .soon { padding: 28px 20px 20px; text-align: center; }
    .soon-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    .soon-desc { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; word-break: keep-all; }

    /* 하단 탭 바: 동그라미 3개를 선으로 이은 타임라인 */
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff;
      border-top: 1.5px solid var(--ink);
      padding-bottom: env(safe-area-inset-bottom);
      transition: transform 0.25s ease;
      z-index: 5;                     /* 하단 시트(overlay 10)가 덮음 */
    }
    .tabbar[hidden] { display: none; }
    .tabbar.away { transform: translateY(100%); }
    .tabbar-in {
      display: flex;
      align-items: flex-start;
      max-width: 420px;
      margin: 0 auto;
      padding: 8px 8px 8px;
    }
    .step {
      flex: 0 0 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      border: none;
      background: none;
      cursor: pointer;
      min-width: 0;
    }
    .step .dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--line);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #fff;
      font-weight: 800;
    }
    .step b { font-size: 13px; font-weight: 700; margin-top: 2px; }
    .step small {
      max-width: 100%;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .step.done .dot { background: var(--ok); border-color: var(--ok); }
    .step.done small { color: var(--ok-text); font-weight: 600; }
    .step.cur .dot { background: var(--accent); border-color: var(--accent); }
    .step.cur b, .step.cur small { color: var(--accent-text); }
    .tabbar .link {
      flex: 1;
      margin-top: 14px;               /* 동그라미 가운데 높이 */
      border-top: 2px dashed #d9c6b2;
    }
    .tabbar .link.solid { border-top-style: solid; border-color: var(--ok); }

    /* ---------- 장소 단계 ---------- */
    .place { padding: 16px 14px; }
    .place-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .place-title { font-size: 18px; font-weight: 700; }
    .add-place-btn {
      flex: none;
      height: 34px;
      padding: 0 12px;
      border: var(--ink-border);
      border-radius: 17px;
      background: var(--accent);
      color: #fff !important;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .add-place-btn[hidden] { display: none; }
    .place-banner .banner { cursor: pointer; }
    .place-banner[hidden], .place #placeHint[hidden] { display: none; }

    .place-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .place-list:empty { display: none; }
    .place-card {
      border: 1.5px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
      cursor: pointer;
    }
    .place-card.top { border-color: var(--accent); }
    .place-card.picked { border-color: var(--accent); background: var(--accent-soft); }
    .place-photo { aspect-ratio: 16 / 9; background: #fbf3ea; }
    .place-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .place-body { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
    .place-info { flex: 1; min-width: 0; }
    .place-name { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .place-addr { margin-top: 2px; font-size: 12px; color: var(--text); opacity: 0.75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link-preview .place-addr { padding: 0 12px 10px; margin-top: -6px; }
    /* 사진이 없는 후보: 연한 배경에 작은 📍 */
    .place-pin {
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #fbf3ea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .detail-addr { margin: 6px 0 2px; font-size: 14px; line-height: 1.5; color: var(--text); }
    .place-sub { margin-top: 2px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .place-heart {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 52px;
      padding: 6px 8px;
      border: 1.5px solid #ffc9b8;
      border-radius: 14px;
      background: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .place-heart.on { background: var(--accent-soft); border-color: var(--accent); }
    .place-heart .who { font-size: 12px; letter-spacing: -1px; min-height: 14px; }

    .place-empty { margin-top: 14px; text-align: center; }
    .place-empty[hidden] { display: none; }
    .place-empty p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; word-break: keep-all; }
    .place-empty .btn { flex: none; padding: 0 20px; }
    .decided-btn {
      display: block;
      margin: 12px auto 0;
      border: none;
      background: none;
      color: var(--muted) !important;
      font-size: 13px;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .decided-btn[hidden] { display: none; }

    /* 링크 추가 시트 */
    .link-input {
      width: 100%;
      min-height: 46px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: #fffcf7;
      outline: none;
      resize: none;
    }
    .link-input:focus { border-color: var(--accent); }
    .link-hint { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.4; }
    .place-name-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .place-name-row .place-name { flex: 0 1 auto; min-width: 0; }
    .place-name-row .small-btn { height: 24px; padding: 0 8px; font-size: 11px; }
    .link-state { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
    .link-state.warn { color: var(--no-text); font-weight: 600; }
    .link-preview { margin-top: 10px; border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; }
    .link-preview .place-name { padding: 10px 12px; }
    .name-input { margin-top: 10px; }
    .name-input input {
      width: 100%;
      height: 46px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: #fffcf7;
      outline: none;
    }
    .name-input input:focus { border-color: var(--accent); }
    .name-input label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
    .btn:disabled { opacity: 0.4; cursor: default; }

    /* 장소 상세 시트 */
    .detail-photo { margin: 0 -20px 14px; aspect-ratio: 16 / 9; background: #fbf3ea; }
    .detail-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .title-row { display: flex; align-items: center; gap: 8px; }
    .title-row .sheet-title { margin-bottom: 0; min-width: 0; overflow-wrap: anywhere; }
    .small-btn {
      flex: none;
      height: 28px;
      padding: 0 10px;
      border: 1.5px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--muted) !important;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .map-link {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      margin: 12px 0;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }
    .voters { font-size: 14px; color: var(--muted); line-height: 1.7; }
    .voters b { color: var(--text); }
    .text-danger {
      display: block;
      margin: 14px auto 0;
      border: none;
      background: none;
      color: var(--sun) !important;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="busy" class="busy-bar"></div>

  <div class="app">
    <header class="top">
      <button id="linkBtn" class="link-btn" hidden>👋 멤버 초대</button>
      <h1>모일날</h1>
      <button id="gearBtn" class="gear" aria-label="설정" hidden>⚙️</button>
    </header>

    <div id="roomTitleRow" class="room-title-row" hidden>
      <button id="roomTitle" class="room-title" aria-label="모임 이름 바꾸기">
        <span id="roomTitleText" class="t"></span><span class="pen">✏️</span>
      </button>
    </div>

    <div id="undoBar" class="undo-bar" hidden>
      <span>초기화됨</span>
      <button id="undoBtn">되돌리기</button>
    </div>

    <div id="status" class="status">불러오는 중…</div>

    <div id="main" class="main" hidden>
      <section class="card people">
        <div class="people-top">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script>
    // ===== Supabase 연결 (공개용 publishable 키라 코드에 넣어도 됨) =====
    const SUPABASE_URL = 'https://tkwvtgolxzthojkfzhsd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MvRrvStiLVCCIkCX5Ktb6A_MlHF1uKk';

    // ===== 기본 설정 =====
    const EMOJIS = [
      '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮',
      '🐷', '🐸', '🐵', '🐧', '🐤', '🦄', '🐙', '🐳', '😀', '😎', '🤓', '🥳'
    ];
    const MAX_PEOPLE = 15;
    const MIN_PEOPLE = 2;
    const DEFAULT_SIZE = 4;
    const MAX_FACES = 2;
    const LOCAL_KEY = 'moilnal-local';
    const DOW = ['일', '월', '화', '수', '목', '금', '토'];

    // 서버 오류 코드 → 안내 문구
    const ERRORS = {
      name_taken: '이미 있는 이름이에요',
      emoji_taken: '다른 사람이 쓰고 있는 이모지예요',
      room_full: '빈자리가 없어요',
      invalid_name: '이름은 1~20자로 써주세요',
      invalid_emoji: '고를 수 없는 이모지예요',
      invalid_size: `인원은 ${MIN_PEOPLE}~${MAX_PEOPLE}명이에요`,
      size_below_members: '이름이 있는 사람보다 적게 줄일 수 없어요',
      member_not_found: '참여자를 찾을 수 없어요',
      date_out_of_range: '고를 수 없는 날짜예요',
      invalid_date: '고를 수 없는 날짜예요',
      nothing_to_undo: '되돌릴 내용이 없어요 (24시간이 지났어요)',
      room_not_found: '모임을 찾을 수 없어요',
      room_deleted: '삭제된 모임이에요',
      restore_expired: '삭제한 지 24시간이 지나서 복구할 수 없어요',
      invalid_room_name: '모임 이름은 1~20자로 써주세요',
      invalid_hours: '고를 수 없는 시간이에요',
      invalid_url: 'https:// 로 시작하는 링크만 올릴 수 있어요',
      invalid_place_title: '장소 이름은 1~40자로 써주세요',
      place_exists: '이미 올라온 곳이에요',
      too_many_places: '후보는 10개까지 올릴 수 있어요',
      place_not_found: '후보를 찾을 수 없어요'
    };
    const DEFAULT_ROOM_NAME = '새 모임';
    const FLASH_KEY = 'moilnal-flash';   // 다른 모임으로 이동한 뒤 보여줄 안내 (sessionStorage)
    const NETWORK_ERROR = '연결이 불안정해요, 다시 시도해주세요';

    const db = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    // ===== 이 기기에만 저장 (localStorage) =====
    // rooms: 내가 들어갔던 모임 목록 [{ id, name, label, visitedAt }]
    // me:    모임별 "나는 누구" { 모임ID: 참여자ID }
    function loadLocal() {
      try {
        const s = JSON.parse(localStorage.getItem(LOCAL_KEY));
        if (s && Array.isArray(s.rooms)) return { rooms: s.rooms, me: s.me || {} };
      } catch (e) {}
      return { rooms: [], me: {} };
    }
    function saveLocal() {
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(local)); } catch (e) {}
    }
    let local = loadLocal();

    // ===== 화면 상태 (서버의 get_room 결과로 채움) =====
    let roomId = null;
    let state = {
      name: DEFAULT_ROOM_NAME, // 모임명
      size: DEFAULT_SIZE,
      participants: [],     // [{ id, name, emoji, done }]
      marks: {},            // { '2026-11-12': [참여자 id, ...] }
      votes: {},            // ❤️ 투표 + 가능 시간 { '2026-12-06': [{ id, s: 19, e: 24 }, ...] }
      confirmed: null,      // { key: '2026-11-07', known: [id, ...], hour: 19 | null }
      places: [],           // 장소 후보 [{ id, url, title, image, by, votes: [참여자 id, ...] }]
      placeId: null,        // 확정 장소 id
      undoUntil: null,      // 초기화 되돌리기 가능한 시각
      selectedId: null      // 지금 입력 중인 사람 (null이면 보기 모드)
    };
    let newEmoji = null;   // 빈자리를 채울 때 자동으로 들어갈 이모지
    let changing = false;  // 확정 배너의 [변경]을 누른 상태
    let draft = false;     // ?new 로 연 임시 모임 (첫 입력 때 서버에 만들어짐)

    // 단계: 날짜 / 장소 / 정산. URL &tab= 으로 기억 (없으면 날짜)
    const TABS = ['date', 'place', 'settle'];
    let tab = new URLSearchParams(location.search).get('tab');
    if (!TABS.includes(tab)) tab = 'date';
    document.body.dataset.tab = tab;
    let creating = null;   // create_room 진행 중인 Promise (두 번 만들지 않게)

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let current = new Date(today.getFullYear(), today.getMonth(), 1);

    // ===== 작은 도우미들 =====
    const $ = id => document.getElementById(id);

    function h(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function dateKey(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function findPerson(id) {
      return state.participants.find(p => p.id === id);
    }

    function usedEmojis(exceptId) {
      return state.participants.filter(p => p.id !== exceptId).map(p => p.emoji);
    }

    function emptySlots() {
      return state.size - state.participants.length;
    }

    let toastTimer;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      // 위치: 상단 버튼 줄 바로 아래 (스크롤해서 안 보이면 화면 맨 위)
      const headerBottom = document.querySelector('.top').getBoundingClientRect().bottom;
      t.style.top = `${Math.max(12, headerBottom + 6)}px`;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    // 짧게 누르기(탭)와 길게 누르기(0.5초)를 구분
    function onPress(el, onTap, onLong) {
      let timer = null, fired = false, sx = 0, sy = 0;
      const cancel = () => { clearTimeout(timer); timer = null; };

      el.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        fired = false;
        sx = e.clientX; sy = e.clientY;
        cancel();
        timer = setTimeout(() => {
          timer = null;
          fired = true;
          if (navigator.vibrate) navigator.vibrate(15);
          onLong();
        }, 500);
      });
      el.addEventListener('pointermove', e => {
        if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel();
      });
      el.addEventListener('pointerup', cancel);
      el.addEventListener('pointerleave', cancel);
      el.addEventListener('pointercancel', cancel);
      el.addEventListener('click', e => {
        if (fired) { fired = false; return; }   // 길게 누른 뒤 손을 뗄 때는 탭으로 치지 않음
        onTap(e);
      });
      el.addEventListener('contextmenu', e => e.preventDefault());
    }

    // ===== 서버와 주고받기 =====
    let pending = 0;          // 진행 중인 저장 요청 수
    let writeSeq = 0;         // 저장을 시작할 때마다 1씩 증가 (오래된 불러오기 결과 버리기용)
    let refetchWanted = false;
    let refetchTimer = null;

    function setBusy() {
      $('busy').classList.toggle('show', pending > 0);
    }

    function errorMessage(err) {
      return (err && ERRORS[err.message]) || NETWORK_ERROR;
    }

    async function callRpc(name, args) {
      if (!db) throw new Error('network');
      const { data, error } = await db.rpc(name, args);
      if (error) throw error;
      return data;
    }

    // 화면을 먼저 바꾸고(optimistic) 서버에 저장. 실패하면 화면을 되돌림
    // quiet: 화면에서 따로 안내할 오류 코드 목록 (이 오류는 기본 안내 문구를 띄우지 않음)
    async function write(name, args, optimistic, quiet = []) {
      writeSeq++;
      const backup = JSON.stringify({
        name: state.name, size: state.size, participants: state.participants,
        marks: state.marks, votes: state.votes, confirmed: state.confirmed, undoUntil: state.undoUntil,
        places: state.places, placeId: state.placeId
      });
      if (optimistic) { optimistic(); render(); }

      pending++;
      setBusy();
      try {
        await ensureRoom();   // ?new 임시 모임이면 첫 입력 때 서버에 모임을 만듦
        const data = await callRpc(name, { p_room_id: roomId, ...args });
        return { ok: true, data };
      } catch (err) {
        if (optimistic) {
          const b = JSON.parse(backup);
          Object.assign(state, b, { undoUntil: b.undoUntil ? new Date(b.undoUntil) : null });
          render();
        }
        if (!(err && quiet.includes(err.message))) toast(errorMessage(err));
        return { ok: false, error: err };
      } finally {
        pending--;
        setBusy();
        scheduleRefetch();   // 저장이 끝나면 서버 최신 상태로 맞춤
      }
    }

    // ?new 임시 모임을 서버에 만들고 주소를 ?g=모임ID 로 바꿈
    function ensureRoom() {
      if (!draft) return Promise.resolve();
      if (!creating) {
        creating = callRpc('create_room', {}).then(id => {
          roomId = id;
          draft = false;
          try { history.replaceState(null, '', location.pathname + '?g=' + encodeURIComponent(id) + tabQuery()); } catch (e) {}
          rememberRoom(true);
          subscribe();
        }).finally(() => { creating = null; });
      }
      return creating;
    }

    function scheduleRefetch() {
      refetchWanted = true;
      clearTimeout(refetchTimer);
      refetchTimer = setTimeout(refetch, 300);
    }

    async function refetch() {
      if (!roomId || pending > 0) return;   // 저장이 끝나면 다시 예약됨
      refetchWanted = false;
      const seq = writeSeq;
      let data;
      try {
        data = await callRpc('get_room', { p_room_id: roomId });
      } catch (err) {
        if (err && err.message === 'room_not_found') return showNotFound();
        return;   // 잠깐 끊긴 경우: 다음 알림/화면 복귀 때 다시 시도
      }
      if (seq !== writeSeq || pending > 0) {   // 불러오는 사이 새 저장이 시작됨 → 이 결과는 버림
        scheduleRefetch();
        return;
      }
      if (data.deleted) return showDeleted(data);   // 누군가 모임을 삭제함
      if ($('main').hidden) showMain();             // 삭제됐던 모임이 복구됨
      applyRoom(data);
      rememberRoom(false);
      render();
    }

    // 다른 모임 등 현재 모임이 아닌 곳에 쓰기 (화면 되돌리기 없이 안내만)
    async function runRpc(name, args) {
      pending++;
      setBusy();
      try {
        return { ok: true, data: await callRpc(name, args) };
      } catch (err) {
        toast(errorMessage(err));
        return { ok: false, error: err };
      } finally {
        pending--;
        setBusy();
      }
    }

    function applyRoom(data) {
      state.name = data.name || DEFAULT_ROOM_NAME;
      state.size = data.size;
      state.participants = (data.members || []).map(m => ({
        id: m.id, name: m.name, emoji: m.emoji, done: m.responded
      }));
      state.marks = data.unavailable || {};
      state.votes = data.votes || {};
      state.places = data.places || [];
      state.placeId = data.confirmed_place || null;
      state.confirmed = data.confirmed
        ? { key: data.confirmed.date, known: data.confirmed.known || [], hour: data.confirmed.hour ?? null }
        : null;
      state.undoUntil = data.undo_until ? new Date(data.undo_until) : null;
      if (state.selectedId && !findPerson(state.selectedId)) state.selectedId = null;
      // 서버 목록에 없는 "나"(인원 감소, 처음부터 다시 만들기 등)는 풀어줌
      if (roomId && local.me[roomId] && !findPerson(local.me[roomId])) {
        delete local.me[roomId];
        saveLocal();
      }
    }

    // ===== 내 모임 목록 =====
    function roomLabel() {
      let s = state.participants.map(p => p.emoji).join('') || '빈 모임';
      if (state.confirmed) s += ` · ${shortLabel(keyToDate(state.confirmed.key))} 확정`;
      return s;
    }

    function rememberRoom(visit) {
      const i = local.rooms.findIndex(r => r.id === roomId);
      const prev = i >= 0 ? local.rooms[i] : null;
      const entry = {
        id: roomId,
        name: state.name,
        label: roomLabel(),
        visitedAt: visit || !prev ? Date.now() : prev.visitedAt
      };
      if (i >= 0) local.rooms[i] = entry;
      else local.rooms.push(entry);
      local.rooms.sort((a, b) => b.visitedAt - a.visitedAt);
      local.rooms = local.rooms.slice(0, 30);
      saveLocal();
    }

    function forgetRoom(id) {
      local.rooms = local.rooms.filter(r => r.id !== id);
      delete local.me[id];
      saveLocal();
    }

    function setLocalName(id, name) {
      const r = local.rooms.find(x => x.id === id);
      if (r) { r.name = name; saveLocal(); }
    }

    // 지금 모임에서 나가기: 목록의 다른 모임으로, 없으면 새 모임. 안내 문구는 이동 후 표시
    function leaveCurrent(message) {
      try { if (message) sessionStorage.setItem(FLASH_KEY, message); } catch (e) {}
      if (local.rooms.length) goRoom(local.rooms[0].id);
      else createAndGo();
    }

    function goRoom(id) {
      location.assign(location.pathname + '?g=' + encodeURIComponent(id));
    }

    // 새 모임: ?new 빈 화면으로 이동 (서버 모임은 첫 입력 때 만들어짐)
    function createAndGo() {
      location.assign(location.pathname + '?new');
    }

    // 다른 모임에서 넘어올 때 남긴 안내 문구 꺼내기 (한 번만)
    function takeFlash() {
      let flash = null;
      try { flash = sessionStorage.getItem(FLASH_KEY); sessionStorage.removeItem(FLASH_KEY); } catch (e) {}
      return flash;
    }

    function whenLabel(ts) {
      const days = Math.floor((Date.now() - ts) / 86400000);
      if (days <= 0) return '오늘';
      if (days === 1) return '어제';
      return `${days}일 전`;
    }

    // ===== 팝업 =====
    // position: 'bottom'(기본, 하단 시트) 또는 'top'(키보드 입력용 위쪽 팝업)
    let sheetOpenedAt = 0;
    function openSheet(build, position) {
      const body = $('sheetBody');
      body.innerHTML = '';
      body.className = '';
      build(body);
      sheetOpenedAt = Date.now();
      $('overlay').classList.toggle('top', position === 'top');
      $('overlay').classList.add('show');
    }
    function closeSheet() {
      $('overlay').classList.remove('show');
      document.activeElement && document.activeElement.blur();
    }
    $('overlay').addEventListener('click', e => {
      if (e.target === $('overlay') && Date.now() - sheetOpenedAt > 300) closeSheet();
    });

    // 확인 팝업 (취소 / 실행). kind: 'danger'(빨강) 또는 'primary'(보라)
    function confirmSheet(title, desc, okLabel, onOk, kind = 'danger') {
      openSheet(body => {
        body.append(h('h3', 'sheet-title', title), h('p', 'sheet-desc', desc));
        const row = h('div', 'btn-row');
        const cancelBtn = h('button', 'btn ghost', '취소');
        const okBtn = h('button', 'btn ' + kind, okLabel);
        cancelBtn.addEventListener('click', closeSheet);
        okBtn.addEventListener('click', () => { closeSheet(); onOk(); });
        row.append(cancelBtn, okBtn);
        body.append(row);
      });
    }

    // 24개 이모지 그리드. used: 고를 수 없는(이미 쓰인) 이모지들
    function emojiGrid(currentEmoji, used, onPick) {
      const grid = h('div', 'emoji-grid');
      for (const emoji of EMOJIS) {
        const btn = h('button', emoji === currentEmoji ? 'cur' : '', emoji);
        if (used.includes(emoji)) btn.disabled = true;
        btn.addEventListener('click', () => onPick(emoji));
        grid.append(btn);
      }
      return grid;
    }

    function openEmojiPicker(person) {
      openSheet(body => {
        body.append(
          h('h3', 'sheet-title', `${person.name} 님의 캐릭터 고르기`),
          h('p', 'sheet-desc', '흐린 이모지는 다른 사람이 쓰고 있어요.'),
          emojiGrid(person.emoji, usedEmojis(person.id), emoji => {
            closeSheet();
            write('save_member', { p_member_id: person.id, p_name: person.name, p_emoji: emoji },
              () => { person.emoji = emoji; });
          })
        );
      });
    }

    // ===== 참여자 =====
    // 빈자리를 채울 사람의 이모지: 아직 안 쓰인 것 중 하나를 자동으로
    function ensureNewEmoji() {
      const used = usedEmojis();
      if (!newEmoji || used.includes(newEmoji)) {
        const free = EMOJIS.filter(e => !used.includes(e));
        newEmoji = free[Math.floor(Math.random() * free.length)];
      }
    }

    // 빈자리 저장 성공: 그 사람 입력 모드로 + 이 기기의 "나"로 기억
    // after: "누구세요?"에서 이름을 넣었으면 하던 조작을 이어서 실행
    function joinedAs(id, name, emoji, after) {
      if (!findPerson(id)) state.participants.push({ id, name, emoji, done: false });
      setMe(id);                      // 이 기기에서 "나는 이 사람"
      newEmoji = null;
      closeSheet();
      if (after) {
        render();
        return after();
      }
      if (tab === 'date') {           // 날짜 화면이면 바로 내 안 되는 날 찍기
        state.selectedId = id;
        toast(`${emoji} ${name} 님, 안 되는 날을 눌러주세요`);
      } else {
        toast(`${emoji} ${name} 님 반가워요 👋`);
      }
      render();
    }

    // 빈자리를 저장하려는데 그사이 자리가 다 찬 경우 (서버가 room_full 로 거절, 덮어쓰지 않음)
    // → 최신 상태로 새로고침 후 [한 자리 늘리고 들어가기] / [취소]
    async function slotTaken(name, emoji, after) {
      closeSheet();
      await refetch();
      if (state.size >= MAX_PEOPLE) {
        return toast(`방금 빈자리가 다 찼어요. 최대 ${MAX_PEOPLE}명까지 참여할 수 있어요`);
      }
      confirmSheet('방금 빈자리가 다 찼어요', `${emoji} ${name} 님으로 들어가려면 한 자리를 늘려요.`,
        '한 자리 늘리고 들어가기', async () => {
          const size = Math.min(MAX_PEOPLE, Math.max(state.size, state.participants.length) + 1);
          const grow = await write('set_room_size', { p_size: size }, () => { state.size = size; });
          if (!grow.ok) return;
          const res = await write('save_member', { p_member_id: null, p_name: name, p_emoji: emoji },
            null, ['room_full']);   // 자리가 다 찼다는 안내는 팝업으로만
          if (res.ok) return joinedAs(res.data, name, emoji, after);
          if (res.error && res.error.message === 'room_full') slotTaken(name, emoji, after);   // 또 누가 먼저 들어옴
        }, 'primary');
    }

    // 빈자리 칩을 누르면: 이모지 버튼 + 이름 입력 + 저장
    function openFillSlot(after) {
      if (typeof after !== 'function') after = null;   // 칩 클릭 이벤트로 불렸을 때
      ensureNewEmoji();
      let input;
      openSheet(body => {
        body.className = 'add-sheet';
        body.append(h('h3', 'sheet-title', '내 이름 넣기'),
                    h('p', 'sheet-desc', '이모지를 누르면 캐릭터를 바꿀 수 있어요.'));

        const row = h('div', 'add-row');
        const emoBtn = h('button', 'emoji-btn', newEmoji);
        emoBtn.setAttribute('aria-label', '이모지 고르기');
        input = h('input');
        input.type = 'text';
        input.placeholder = '이름';
        input.maxLength = 20;
        input.autocomplete = 'off';
        const saveBtn = h('button', 'save-btn', '저장');
        row.append(emoBtn, input, saveBtn);
        body.append(row);

        // 이모지 버튼을 누르면 같은 팝업 안에 24개 그리드를 펼침
        let grid = null;
        emoBtn.addEventListener('click', () => {
          if (grid) { grid.remove(); grid = null; return; }
          grid = emojiGrid(newEmoji, usedEmojis(), emoji => {
            newEmoji = emoji;
            emoBtn.textContent = emoji;
            grid.remove();
            grid = null;
            input.focus();
          });
          body.append(grid);
        });

        let saving = false;
        const submit = async () => {
          if (saving) return;
          const name = input.value.trim();
          if (!name) return toast('이름을 입력해주세요');
          if (state.participants.some(p => p.name === name)) return toast('이미 있는 이름이에요');
          const emoji = newEmoji;
          if (emptySlots() <= 0) return slotTaken(name, emoji, after);   // 팝업을 연 사이 실시간으로 자리가 찼음

          saving = true;
          saveBtn.disabled = true;
          const res = await write('save_member', { p_member_id: null, p_name: name, p_emoji: emoji },
            null, ['room_full']);   // 자리가 다 찼다는 안내는 팝업으로만
          saving = false;
          saveBtn.disabled = false;
          if (!res.ok) {
            // 서버가 모임을 잠그고 인원을 세서, 그사이 다른 사람이 자리를 채웠으면 room_full 로 거절함 (덮어쓰지 않음)
            if (res.error && res.error.message === 'room_full') slotTaken(name, emoji, after);
            return;
          }
          joinedAs(res.data, name, emoji, after);
        };
        saveBtn.addEventListener('click', submit);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); }
        });
      }, 'top');
      input.focus();
    }

    // ===== 인원 조절 =====
    function changeSize(delta) {
      if (delta > 0) {
        if (state.size >= MAX_PEOPLE) return toast(`최대 ${MAX_PEOPLE}명까지예요`);
        const size = state.size + 1;
        return write('set_room_size', { p_size: size }, () => { state.size = size; });
      }

      if (state.size <= MIN_PEOPLE) return toast(`최소 ${MIN_PEOPLE}명이에요`);
      if (emptySlots() > 0) {          // 빈자리부터 제거
        const size = state.size - 1;
        return write('set_room_size', { p_size: size }, () => { state.size = size; });
      }

      // 빈자리가 없으면 누구를 뺄지 고르기
      openSheet(body => {
        body.append(h('h3', 'sheet-title', '누구를 뺄까요?'),
                    h('p', 'sheet-desc', '뺀 사람이 표시한 날도 함께 지워져요.'));
        const list = h('div', 'pick-list');
        for (const person of state.participants) {
          const btn = h('button');
          btn.append(h('span', 'emo', person.emoji), h('span', '', person.name));
          btn.addEventListener('click', () => {
            confirmSheet(`${person.emoji} ${person.name} 님을 뺄까요?`,
              '표시한 안 되는 날도 함께 지워지고, 되돌릴 수 없어요.', '빼기', async () => {
                const res = await write('delete_member', { p_member_id: person.id }, () => {
                  state.participants = state.participants.filter(p => p.id !== person.id);
                  for (const key of Object.keys(state.marks)) {
                    state.marks[key] = state.marks[key].filter(id => id !== person.id);
                    if (!state.marks[key].length) delete state.marks[key];
                  }
                  if (state.selectedId === person.id) state.selectedId = null;
                  state.size = Math.max(MIN_PEOPLE, state.size - 1);
                });
                if (res.ok) toast(`${person.name} 님을 뺐어요`);
              });
          });
          list.append(btn);
        }
        body.append(list);
      });
    }

    function renderPeople() {
      const size = state.size;
      const answered = state.participants.filter(p => p.done).length;
      const allDone = answered === size;

      // 맨 위 한 줄: 인원 + 진행 상황
      $('sizeLabel').textContent = `${size}명`;
      $('minusBtn').disabled = size <= MIN_PEOPLE;
      $('plusBtn').disabled = size >= MAX_PEOPLE;
      $('barFill').style.width = `${(answered / size) * 100}%`;
      $('progressText').textContent = allDone ? '모두 응답 🎉' : `${answered}/${size} 응답`;
      $('progress').classList.toggle('all', allDone);

      // 칩: 이름 있는 사람들 → 빈자리들
      const me = myId();
      const chips = $('chips');
      chips.innerHTML = '';

      for (const person of state.participants) {
        let cls = 'chip';
        if (person.id === state.selectedId) cls += ' sel';
        if (!person.done) cls += ' pending';
        const chip = h('div', cls);
        const isMe = person.id === me;
        chip.append(h('span', 'emo', person.emoji), h('span', 'nm', person.name));
        if (isMe) chip.append(h('span', 'me-tag', '나'));
        if (person.done) chip.append(h('span', 'check', '✓'));

        chip.addEventListener('click', e => {
          if (!isMe) return pickPerson(person);   // 남의 칩: 이모지를 눌러도 같은 동작
          if (e.target.closest('.emo')) return openEmojiPicker(person);   // 이모지 바꾸기는 내 칩에서만
          toggleMarking();                        // 내 칩 이름: 안 되는 날 찍기 켜기/끄기
        });
        chips.append(chip);
      }

      // 이 기기의 "나"가 아직 없으면: 첫 빈자리 강조 + 멤버 초대는 보조 버튼으로
      const noMe = !me;
      $('linkBtn').classList.toggle('quiet', noMe);

      for (let i = 0; i < emptySlots(); i++) {
        const first = noMe && i === 0;
        const chip = h('div', first ? 'chip empty first' : 'chip empty');
        if (first) chip.append(h('span', 'emo', '＋'), h('span', 'nm', '내 이름 넣기'));
        else chip.append(h('span', 'emo', '❔'), h('span', 'nm', '빈자리'));
        chip.addEventListener('click', openFillSlot);
        chips.append(chip);
      }

      // 안내 문구
      const hint = $('hint');
      hint.className = 'hint';
      hint.innerHTML = '';
      const sel = findPerson(state.selectedId);

      if (sel) {
        hint.classList.add('editing');
        const text = h('span');
        text.append(h('b', '', `${sel.emoji} ${sel.name}`), ' 님 입력 중');
        const btns = h('span', 'done-btns');
        // 표시한 날이 하나도 없으면: 다 돼요 = 응답 완료 저장
        if (!hasMarks(sel.id) && !sel.done) {
          const allOk = h('button', 'done-btn ghost', '다 돼요 👍');
          allOk.addEventListener('click', async () => {
            state.selectedId = null;
            const res = await write('set_responded', { p_member_id: sel.id, p_responded: true },
              () => { sel.done = true; });
            if (res.ok) toast('응답 완료!');
          });
          btns.append(allOk);
        }
        // 다 찍었어요 = 입력 모드 닫기만 (응답 완료는 날짜 표시로 자동 처리)
        const done = h('button', 'done-btn', '다 찍었어요');
        done.addEventListener('click', () => {
          state.selectedId = null;
          render();
        });
        btns.append(done);
        hint.append(text, btns);
      } else if (changing && activeConfirmed()) {
        hint.textContent = '다른 날짜를 탭해서 다시 확정하세요';
      } else if (noMe && state.participants.length > 0) {
        hint.textContent = emptySlots() > 0
          ? '누구세요? 내 캐릭터를 누르거나, 없으면 빈자리를 눌러주세요'
          : '누구세요? 내 캐릭터를 눌러주세요';
      } else if (noMe) {
        hint.textContent = '빈자리를 눌러 내 이름을 넣어보세요';
      } else if (tab === 'date') {
        const mine = findPerson(me);
        const btn = h('button', 'mark-btn', `✏️ ${mine.emoji} 내 안 되는 날 찍기`);
        btn.addEventListener('click', toggleMarking);
        hint.append(btn);
      }

      renderBanner();
      renderRecommend();
    }

    // ===== 날짜 확정 =====
    // state.confirmed = { key: '2026-11-07', known: [확정할 때 이미 안 된다고 했던 사람 id] }
    function todayKey() {
      return dateKey(today.getFullYear(), today.getMonth(), today.getDate());
    }

    function keyToDate(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function shortLabel(date) {
      return `${date.getMonth() + 1}/${date.getDate()} (${DOW[date.getDay()]})`;
    }

    // 아직 지나지 않은 확정 날짜 (지났으면 null)
    function activeConfirmed() {
      const c = state.confirmed;
      return c && c.key >= todayKey() ? c : null;
    }

    function renderBanner() {
      $('placeNudge').hidden = !activeConfirmed();   // 확정 뒤에만 "장소도 정할까요?"
      const banner = $('banner');
      banner.innerHTML = '';
      const c = state.confirmed;
      banner.hidden = !c;
      if (!c) return;

      const date = keyToDate(c.key);

      // 확정 날짜가 지났으면 "지난 모임"
      if (c.key < todayKey()) {
        banner.className = 'banner past date-only';
        banner.append(h('div', 'banner-main', `지난 모임: ${confirmedLabel(c)}`));
        return;
      }

      banner.className = 'banner date-only';
      const main = h('div', 'banner-main');
      const diff = Math.round((date - today) / 86400000);
      main.append(
        h('span', 'banner-title', `📌 ${confirmedLabel(c)}`),
        h('span', 'dday', diff === 0 ? 'D-DAY' : `D-${diff}`)
      );
      const calBtn = h('button', 'banner-btn', '📆');
      calBtn.setAttribute('aria-label', '내 캘린더에 추가');
      calBtn.addEventListener('click', () => openCalendarSheet(c.key));
      const changeBtn = h('button', 'banner-btn', changing ? '닫기' : '변경');
      changeBtn.addEventListener('click', () => { changing = !changing; render(); });
      main.append(calBtn, changeBtn);
      banner.append(main);

      // 확정한 뒤에 새로 "안 된다"고 한 사람이 있으면 경고
      const known = c.known || [];
      const newcomers = unavailablePeople(c.key).filter(p => !known.includes(p.id));
      if (newcomers.length) {
        banner.append(h('div', 'banner-warn',
          `⚠️ ${newcomers.map(p => p.name).join(', ')} 님이 이 날 안 된대요`));
      }
    }

    // ===== 내 캘린더에 추가 (확정 날짜, 종일 일정) =====
    function roomLink() {
      return location.origin + location.pathname + '?g=' + encodeURIComponent(roomId);
    }

    // 확정 시각이 있으면 그 시각부터 3시간(UTC '20261206T100000Z'),
    // 없으면 종일 일정('20261206' ~ 다음 날 '20261207')
    function calDates(key) {
      const d = keyToDate(key);
      const hour = state.confirmed && state.confirmed.key === key ? state.confirmed.hour : null;
      if (hour != null) {
        const utc = x => x.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
        const from = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hour);
        const to = new Date(from.getTime() + 3 * 3600000);
        return { timed: true, start: utc(from), end: utc(to), id: dateKey(d.getFullYear(), d.getMonth(), d.getDate()).replace(/-/g, '') };
      }
      const next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      const fmt = x => dateKey(x.getFullYear(), x.getMonth(), x.getDate()).replace(/-/g, '');
      return { timed: false, start: fmt(d), end: fmt(next), id: fmt(d) };
    }

    // 일정 제목/설명 (구글 캘린더, .ics 공통)
    function calTitle() {
      const name = state.name === DEFAULT_ROOM_NAME ? '친구들 모임' : state.name;
      return `${name} 📌`;
    }
    function calDetails() {
      // 확정 장소가 있으면 장소 이름 + 지도 링크도
      const place = confirmedPlace();
      const where = place ? `📍 ${place.title}\n${safeHttps(place.url) || ''}\n` : '';
      return `모일날에서 정한 약속이에요\n${where}${roomLink()}`;
    }
    // 일정 장소: "이름, 주소" (주소가 없으면 이름만, 확정 장소가 없으면 빈 값)
    function calLocation() {
      const place = confirmedPlace();
      if (!place) return '';
      return place.address ? `${place.title}, ${place.address}` : place.title;
    }

    function openCalendarSheet(key) {
      openSheet(body => {
        body.append(h('h3', 'sheet-title', '내 캘린더에 추가'));
        const col = h('div', 'menu');
        const google = h('button', '', '구글 캘린더');
        const ics = h('button', '', '아이폰 · 다른 캘린더');
        google.addEventListener('click', () => { closeSheet(); addToGoogle(key); });
        ics.addEventListener('click', () => { closeSheet(); downloadIcs(key); });
        col.append(google, ics);
        body.append(col);
      });
    }

    function addToGoogle(key) {
      const { start, end } = calDates(key);
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: calTitle(),
        dates: `${start}/${end}`,
        details: calDetails(),
        location: calLocation()
      });
      window.open('https://calendar.google.com/calendar/render?' + params.toString(), '_blank');
    }

    // .ics 글자 이스케이프 + 75바이트마다 줄 접기 (표준 규칙)
    function icsText(s) {
      return s.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
    }
    function icsFold(line) {
      const enc = new TextEncoder();
      const out = [];
      let cur = '', bytes = 0;
      for (const ch of line) {
        const n = enc.encode(ch).length;
        if (bytes + n > (out.length ? 74 : 75)) { out.push(cur); cur = ''; bytes = 0; }
        cur += ch; bytes += n;
      }
      out.push(cur);
      return out.join('\r\n ');
    }

    function downloadIcs(key) {
      // 카카오톡 안 브라우저는 파일 다운로드가 막힐 수 있어서 외부 브라우저로 연다
      if (/KAKAOTALK/i.test(navigator.userAgent)) {
        toast('브라우저에서 다시 [📆]를 눌러주세요');
        setTimeout(() => {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(roomLink());
        }, 600);
        return;
      }
      const { timed, start, end, id } = calDates(key);
      const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//moilnal//KO',
        'CALSCALE:GREGORIAN',
        'BEGIN:VEVENT',
        // 모임ID-날짜로 고정: 두 번 추가해도 같은 일정으로 인식
        `UID:${roomId}-${id}@moilnal.github.io`,
        `DTSTAMP:${stamp}`,
        timed ? `DTSTART:${start}` : `DTSTART;VALUE=DATE:${start}`,
        timed ? `DTEND:${end}` : `DTEND;VALUE=DATE:${end}`,
        `SUMMARY:${icsText(calTitle())}`,
        `DESCRIPTION:${icsText(calDetails())}`,
        ...(calLocation() ? [`LOCATION:${icsText(calLocation())}`] : []),
        `URL:${roomLink()}`,
        'END:VEVENT',
        'END:VCALENDAR'
      ];
      const blob = new Blob([lines.map(icsFold).join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `moilnal-${id}.ics`;
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    function confirmDate(date, key) {
      const people = unavailablePeople(key);
      const label = shortLabel(date);
      const prev = activeConfirmed();
      let title, desc;
      if (people.length) {
        title = `${people.length}명이 안 되는 날이에요. 그래도 확정할까요?`;
        desc = `${label} · 안 되는 사람: ${people.map(p => `${p.emoji} ${p.name}`).join(', ')}`;
      } else {
        title = `${label}로 확정할까요?`;
        desc = '모두 가능한 날이에요 🎉';
      }
      if (prev && prev.key !== key) desc += ` · 기존 확정(${shortLabel(keyToDate(prev.key))})은 취소돼요`;

      // 시각 선택 (기본값: ❤️한 사람들이 모두 되는 시간의 시작, 없으면 "시각 없음")
      const common = commonRange(key);
      let hour = common && common.s <= 23 && (common.s > HOUR_MIN || common.e < HOUR_MAX) ? common.s : null;

      openSheet(body => {
        body.append(h('h3', 'sheet-title', title), h('p', 'sheet-desc', desc));
        body.append(h('div', 'pick-label', '몇 시에 만나요? (선택)'));
        const row = h('div', 'hour-chips');
        const opts = [null];
        for (let x = HOUR_MIN; x < HOUR_MAX; x++) opts.push(x);
        const btns = [];
        for (const x of opts) {
          const b = h('button', 'hour-chip' + (x === hour ? ' on' : ''), x == null ? '시각 없음' : hourLabel(x));
          b.addEventListener('click', () => {
            hour = x;
            btns.forEach((o, i) => o.classList.toggle('on', opts[i] === hour));
          });
          btns.push(b);
          row.append(b);
        }
        body.append(row);
        const sel = btns[opts.indexOf(hour)];
        setTimeout(() => sel && sel.scrollIntoView({ block: 'nearest', inline: 'center' }), 50);

        const actions = h('div', 'btn-row sheet-actions');
        const cancelBtn = h('button', 'btn ghost', '취소');
        const okBtn = h('button', 'btn primary', '확정하기');
        cancelBtn.addEventListener('click', closeSheet);
        okBtn.addEventListener('click', async () => {
          closeSheet();
          changing = false;
          const res = await write('confirm_date', { p_day: key, p_hour: hour }, () => {
            state.confirmed = { key, known: people.map(p => p.id), hour };   // 확정은 한 번에 하나만
          });
          if (res.ok) toast(`📌 ${confirmedLabel(state.confirmed)}로 확정했어요`);
        });
        actions.append(cancelBtn, okBtn);
        body.append(actions);
      });
    }

    function cancelConfirm(date) {
      confirmSheet('확정을 취소할까요?', `${shortLabel(date)} 확정이 취소돼요.`, '확정 취소', async () => {
        changing = false;
        const res = await write('confirm_date', { p_day: null, p_hour: null }, () => { state.confirmed = null; });
        if (res.ok) toast('확정을 취소했어요');
      });
    }

    // ===== 시간 (❤️ 투표의 가능 시간, 확정 시각) =====
    const HOUR_MIN = 10;   // 가능 시간 범위: 10시 ~ 24시(자정)
    const HOUR_MAX = 24;

    // 19 → '오후 7시', 10 → '오전 10시', 12 → '오후 12시', 24 → '자정'
    function hourLabel(x) {
      if (x === 24) return '자정';
      if (x < 12) return `오전 ${x}시`;
      return `오후 ${x === 12 ? 12 : x - 12}시`;
    }

    // 배너 등: '12/6 (토) 오후 7시' / 시각 없으면 '12/6 (토)'
    function confirmedLabel(c) {
      const base = shortLabel(keyToDate(c.key));
      return c.hour != null ? `${base} ${hourLabel(c.hour)}` : base;
    }

    // 그 날 ❤️ 투표 목록 (참여자 순서, 지금 있는 사람만)
    function votesOf(key) {
      const list = state.votes[key] || [];
      return list.filter(v => findPerson(v.id));
    }
    function myVote(key, id) {
      return (state.votes[key] || []).find(v => v.id === id) || null;
    }

    // ❤️한 사람들이 모두 되는 시간 { s, e } (투표가 없거나 겹치지 않으면 null)
    function commonRange(key) {
      const list = votesOf(key);
      if (!list.length) return null;
      const s = Math.max(...list.map(v => v.s));
      const e = Math.min(...list.map(v => v.e));
      return s < e ? { s, e } : null;
    }

    // 칩/시트용 짧은 범위: '19~23시', 하루 종일이면 '종일'
    function rangeText(r) {
      if (r.s === HOUR_MIN && r.e === HOUR_MAX) return '종일';
      return `${r.s}~${r.e}시`;
    }

    // 후보 칩 탭 → 내 ❤️가 없을 때만 켜고 투표 시트 (이미 있으면 시트만, 취소는 시트 안에서)
    function voteForDate(date, key) {
      const me = myId();
      if (!me) return;
      if (!myVote(key, me)) toggleVote(key, me);
      showVoteSheet(date, key);
    }

    function toggleVote(key, me) {
      write('toggle_vote', { p_member_id: me, p_day: key }, () => {
        const list = state.votes[key] || [];
        const i = list.findIndex(v => v.id === me);
        if (i >= 0) list.splice(i, 1);
        else {
          list.push({ id: me, s: HOUR_MIN, e: HOUR_MAX });
          const person = findPerson(me);
          if (person) person.done = true;   // ❤️도 응답 (한 번 응답하면 유지)
        }
        if (list.length) state.votes[key] = list;
        else delete state.votes[key];
      });
    }

    function showVoteSheet(date, key) {
      const me = myId();
      openSheet(body => {
        body.append(h('h3', 'sheet-title', shortLabel(date)));

        const heart = h('button', 'heart-btn');
        const slider = rangeSlider();
        const paint = () => {
          const v = myVote(key, me);
          heart.classList.toggle('on', !!v);
          heart.textContent = v ? '❤️ 이 날 좋아요' : '🤍 이 날 좋아요';
          slider.set(v ? v.s : HOUR_MIN, v ? v.e : HOUR_MAX, !!v);
        };
        heart.addEventListener('click', () => { toggleVote(key, me); paint(); });

        slider.onChange = (s, e) => {
          write('set_vote_hours', { p_member_id: me, p_day: key, p_start: s, p_end: e }, () => {
            const v = myVote(key, me);
            if (v) { v.s = s; v.e = e; }
          });
        };

        body.append(heart, h('div', 'pick-label', '몇 시부터 몇 시까지 돼요? (선택)'), slider.el);
        // 그 날 누가 안 되는지 + 확정은 달력 상세에서
        const look = h('button', 'decided-btn', '📅 달력에서 보기');
        look.addEventListener('click', () => { closeSheet(); goToDate(date, key); });
        const close = h('button', 'btn ghost full sheet-actions', '닫기');
        close.addEventListener('click', closeSheet);
        body.append(look, close);
        paint();
      });
    }

    // 양쪽 손잡이 범위 슬라이더 (10~24시, 1시간 단위)
    function rangeSlider() {
      const el = h('div', 'range');
      const text = h('div', 'range-text');
      const track = h('div', 'range-track');
      const fill = h('div', 'range-fill');
      const a = h('div', 'range-knob');
      const b = h('div', 'range-knob');
      const ticks = h('div', 'range-ticks');
      for (const x of [10, 14, 18, 22, 24]) {
        const t = h('span', '', x === 24 ? '24' : String(x));
        t.style.left = `${((x - HOUR_MIN) / (HOUR_MAX - HOUR_MIN)) * 100}%`;
        ticks.append(t);
      }
      track.append(fill, a, b);
      el.append(text, track, ticks);

      const api = { el, onChange: null, s: HOUR_MIN, e: HOUR_MAX, enabled: true };
      const pct = x => ((x - HOUR_MIN) / (HOUR_MAX - HOUR_MIN)) * 100;
      const draw = () => {
        a.style.left = `${pct(api.s)}%`;
        b.style.left = `${pct(api.e)}%`;
        fill.style.left = `${pct(api.s)}%`;
        fill.style.width = `${pct(api.e) - pct(api.s)}%`;
        text.textContent = api.s === HOUR_MIN && api.e === HOUR_MAX
          ? '하루 종일 돼요'
          : `${hourLabel(api.s)} ~ ${hourLabel(api.e)}`;
        el.classList.toggle('off', !api.enabled);
      };
      api.set = (s, e, enabled) => { api.s = s; api.e = e; api.enabled = enabled; draw(); };

      const hourAt = clientX => {
        const r = track.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
        return Math.round(HOUR_MIN + ratio * (HOUR_MAX - HOUR_MIN));
      };
      const drag = which => ev => {
        if (!api.enabled) return;
        ev.preventDefault();
        const knob = which === 's' ? a : b;
        knob.setPointerCapture(ev.pointerId);
        const before = [api.s, api.e];
        const move = e2 => {
          const x = hourAt(e2.clientX);
          if (which === 's') api.s = Math.min(x, api.e - 1);
          else api.e = Math.max(x, api.s + 1);
          draw();
        };
        const up = () => {
          knob.removeEventListener('pointermove', move);
          knob.removeEventListener('pointerup', up);
          knob.removeEventListener('pointercancel', up);
          if ((before[0] !== api.s || before[1] !== api.e) && api.onChange) api.onChange(api.s, api.e);
        };
        knob.addEventListener('pointermove', move);
        knob.addEventListener('pointerup', up);
        knob.addEventListener('pointercancel', up);
      };
      a.addEventListener('pointerdown', drag('s'));
      b.addEventListener('pointerdown', drag('e'));
      draw();
      return api;
    }

    // 상세 시트의 시간 타임라인: 사람별 가능 막대 (최대 5명 + 더 보기) + "✅ 모두 가능"
    function timeline(key) {
      const list = votesOf(key);
      const box = h('div', 'timeline');
      const pct = x => ((x - HOUR_MIN) / (HOUR_MAX - HOUR_MIN)) * 100;
      const row = (label, s, e, cls) => {
        const r = h('div', 'tl-row' + (cls ? ' ' + cls : ''));
        const bar = h('div', 'tl-bar');
        if (s != null) {
          const seg = h('i');
          seg.style.left = `${pct(s)}%`;
          seg.style.width = `${pct(e) - pct(s)}%`;
          bar.append(seg);
        }
        r.append(h('span', 'tl-who', label), bar);
        return r;
      };
      const rows = list.map(v => row(findPerson(v.id).emoji, v.s, v.e));
      const shown = rows.slice(0, 5);
      box.append(...shown);
      if (rows.length > 5) {
        const more = h('button', 'tl-more', `더 보기 (${rows.length - 5}명)`);
        more.addEventListener('click', () => { more.replaceWith(...rows.slice(5)); });
        box.append(more);
      }
      const common = commonRange(key);
      box.append(row('✅', common ? common.s : null, common ? common.e : null, 'all'));
      // 눈금: 슬라이더와 같은 10 · 14 · 18 · 22 · 24
      const scale = h('div', 'tl-scale');
      for (const x of [10, 14, 18, 22, 24]) {
        const t = h('span', '', String(x));
        t.style.left = `${pct(x)}%`;
        scale.append(t);
      }
      box.append(scale);
      const sum = h('p', 'tl-sum', common
        ? (rangeText(common) === '종일' ? '하루 종일 모두 가능' : `${rangeText(common)} 모두 가능`)
        : '모두 되는 시간이 없어요');
      sum.append(h('small', 'tl-basis', `❤️ ${list.length}명 기준`));
      box.append(sum);
      return box;
    }

    // ===== 후보 날짜 =====
    // 지금 보고 있는 달에서(오늘·지난 날 제외) 최대 5개
    // ❤️ 있는 날 먼저(❤️ 많은 순 → 안 되는 사람 적은 순 → 가까운 날),
    // 남는 자리는 기존 추천 기준(안 되는 사람 적은 날 → 금·토·일 → 가까운 날)
    const MAX_CANDIDATES = 5;
    function candidateDates() {
      const list = [];
      const year = current.getFullYear();
      const month = current.getMonth();
