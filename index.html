<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모일날</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #f7f4fb;          /* 연한 라벤더 배경 */
      --card: #ffffff;
      --text: #3d3a4a;
      --muted: #9a96a8;
      --line: #ece8f3;
      --accent: #a78bdb;      /* 파스텔 보라: 오늘, 선택 강조 */
      --accent-soft: #efe9fa;
      --ok: #5bbf8a;          /* 초록: 모두 가능한 날, 응답 완료 */
      --no-rgb: 224, 90, 106; /* 빨강: 안 되는 날 (배경 진하기에 사용) */
      --sat: #4a7bd8;
      --sun: #e05a6a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    button { font-family: inherit; color: inherit; }

    .app { max-width: 420px; margin: 0 auto; }

    /* ---------- 상단: 앱 이름 + 설정 ---------- */
    .top { position: relative; margin-bottom: 16px; }

    h1 {
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .gear {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: none;
      font-size: 18px;
      cursor: pointer;
      opacity: 0.6;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(120, 100, 160, 0.08);
    }

    /* ---------- 참여자 영역 ---------- */
    .people { padding: 12px 14px 14px; margin-bottom: 12px; }

    /* 맨 위 한 줄: 인원 조절 + 진행 상황 */
    .people-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stepper { display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; }
    .stepper .icon { font-size: 16px; margin-right: 2px; }
    .stepper button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }
    .stepper button:disabled { opacity: 0.35; cursor: default; }
    #sizeLabel { min-width: 36px; text-align: center; }

    .progress { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .bar {
      width: 56px;
      height: 6px;
      border-radius: 3px;
      background: var(--line);
      overflow: hidden;
    }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }
    .progress.all { color: var(--ok); }
    .progress.all .bar i { background: var(--ok); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .chip {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 12px 0 3px;
      border: 2px solid var(--line);
      border-radius: 19px;
      background: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .chip.pending { opacity: 0.6; }           /* 아직 응답 안 한 사람: 살짝 흐리게 */
    .chip.sel { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
    .chip.empty {
      border-style: dashed;
      border-color: #cfc6e0;
      background: #fcfbfe;
      color: var(--muted);
    }

    /* 칩의 이모지 부분: 탭하면 이모지 변경 */
    .chip .emo {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #f4f1f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }
    .chip.sel .emo { background: #fff; }
    .chip.empty .emo { background: none; font-size: 15px; }

    /* 칩의 이름 부분: 탭하면 입력 모드 */
    .chip .nm { padding-left: 7px; line-height: 34px; }
    .chip .check { margin-left: 4px; color: var(--ok); font-weight: 800; }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }
    .hint:empty { display: none; }

    /* 입력 모드 안내: "멍청 님 입력 중" + 완료 */
    .hint.editing {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--accent-soft);
      border-radius: 12px;
      padding: 6px 6px 6px 12px;
      color: var(--text);
    }
    .hint.editing b { font-weight: 700; }
    .done-btn {
      height: 34px;
      padding: 0 16px;
      flex-shrink: 0;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff !important;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ---------- 달력 ---------- */
    .calendar { padding: 14px 4px 16px; }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      margin-bottom: 8px;
    }

    .month-nav button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 22px;
      cursor: pointer;
    }
    .month-nav button:active { background: #e2d8f5; }

    #title { font-size: 19px; font-weight: 700; }

    .weekdays, #grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
    }

    .weekdays div {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      padding: 6px 0;
    }

    .cell {
      min-height: 66px;
      min-width: 0;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 0;
      container-type: inline-size;   /* 이모지 크기를 칸 폭 기준으로 정하기 위함 */
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      transition: background 0.15s;
    }

    .num {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
    }

    .weekdays .sun, .cell.sun .num { color: var(--sun); }
    .weekdays .sat, .cell.sat .num { color: var(--sat); }

    .cell.past { opacity: 0.35; cursor: default; }

    /* 모두 가능한 날: 초록 동그라미 테두리 */
    .cell.allok .num { box-shadow: 0 0 0 2px var(--ok); }

    /* 오늘: 보라색으로 채운 숫자 */
    .cell.today .num { background: var(--accent); color: #fff; font-weight: 700; }

    /* 이모지 최대 2개 + "+n", 한 줄로 겹치지 않게 */
    .faces {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 3px;               /* X 배지가 옆 이모지를 덮지 않을 만큼 띄움 */
      line-height: 1;
      max-width: 100%;
    }

    /* 칸 폭에 맞춰 이모지 크기를 살짝 줄여서 좁은 폰에서도 한 줄에 들어가게 */
    .face {
      position: relative;
      font-size: min(11px, 22cqw);
      line-height: 1;
    }

    .face .x {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 0 0 0 1px #fff;
      color: #fff;
      font-size: 7px;
      font-style: normal;
      font-weight: 800;
      line-height: 8px;
      text-align: center;
    }

    /* 지금 입력 중인 사람의 X는 조금 더 크게 */
    .face.mine .x {
      right: -3px;
      bottom: -3px;
      width: 11px;
      height: 11px;
      font-size: 9px;
      line-height: 11px;
    }

    .more { font-size: 9px; font-weight: 700; letter-spacing: -0.3px; }

    .cnt {
      margin-top: auto;
      font-size: 10px;
      font-weight: 700;
      color: #a33d4b;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .lg-today { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
    .lg-ok { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ok); }

    .legend-tip {
      margin-top: 6px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ---------- 팝업 (하단 시트 / 위쪽 작은 팝업) ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(40, 30, 60, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      margin: 0 auto;
      background: #fff;
      border-radius: 22px 22px 0 0;
      padding: 10px 20px 28px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }
    .overlay.show .sheet { transform: none; }

    /* 이름 입력 팝업은 키보드에 가리지 않게 화면 위쪽에 띄움 */
    .overlay.top .sheet {
      top: 12vh;
      bottom: auto;
      left: 16px;
      right: 16px;
      max-width: 388px;
      border-radius: 20px;
      padding: 18px 18px 20px;
      transform: translateY(-16px);
    }
    .overlay.top.show .sheet { transform: none; }
    .overlay.top .handle { display: none; }

    .handle {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--line);
      margin: 0 auto 14px;
    }

    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .sheet-desc { font-size: 14px; color: var(--muted); margin-bottom: 16px; }

    .who-list { list-style: none; }
    .who-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
      font-weight: 600;
    }
    .who-list li:last-child { border-bottom: none; }
    .who-list .emo { font-size: 22px; }

    /* "누구를 뺄까요?" 선택 목록 */
    .pick-list { display: flex; flex-direction: column; gap: 8px; }
    .pick-list button {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 50px;
      padding: 0 14px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
      font-size: 16px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .pick-list .emo { font-size: 22px; }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .emoji-grid button {
      aspect-ratio: 1;
      border: 2px solid transparent;
      border-radius: 14px;
      background: #faf8fd;
      font-size: 26px;
      cursor: pointer;
    }
    .emoji-grid button.cur { border-color: var(--accent); background: var(--accent-soft); }
    .emoji-grid button:disabled { opacity: 0.2; cursor: default; }

    /* 빈자리 채우기 팝업: 이모지 버튼 + 이름 입력 + 저장 */
    .add-row { display: flex; gap: 8px; }
    .emoji-btn {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #fcfbfe;
      font-size: 22px;
      cursor: pointer;
    }
    .add-row input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: #fcfbfe;
      outline: none;
    }
    .add-row input:focus { border-color: var(--accent); }
    .save-btn {
      height: 46px;
      padding: 0 16px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff !important;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .add-sheet .emoji-grid { margin-top: 14px; }
    .add-sheet .emoji-grid button { font-size: 22px; border-radius: 12px; }

    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      height: 48px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.ghost { background: #f1eef6; }
    .btn.danger { background: var(--sun); color: #fff; }
    .btn.full { width: 100%; flex: none; }

    /* ---------- 안내 토스트 ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 36px;
      transform: translate(-50%, 20px);
      background: rgba(50, 42, 70, 0.92);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 20px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>모일날</h1>
      <button id="gearBtn" class="gear" aria-label="설정">⚙️</button>
    </header>

    <section class="card people">
      <div class="people-top">
        <div class="stepper">
          <span class="icon">👥</span>
          <button id="minusBtn" aria-label="인원 줄이기">−</button>
          <span id="sizeLabel"></span>
          <button id="plusBtn" aria-label="인원 늘리기">+</button>
        </div>
        <div id="progress" class="progress">
          <div class="bar"><i id="barFill"></i></div>
          <span id="progressText"></span>
        </div>
      </div>
      <div id="chips" class="chips"></div>
      <div id="hint" class="hint"></div>
    </section>

    <section class="card calendar">
      <div class="month-nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <div id="title"></div>
        <button id="next" aria-label="다음 달">›</button>
      </div>

      <div class="weekdays">
        <div class="sun">일</div><div>월</div><div>화</div><div>수</div>
        <div>목</div><div>금</div><div class="sat">토</div>
      </div>

      <div id="grid"></div>

      <div class="legend">
        <span><i class="lg-today"></i>오늘</span>
        <span><i class="lg-ok"></i>모두 가능</span>
      </div>
      <p class="legend-tip">
        날짜를 누르면 안 되는 사람을 볼 수 있어요<br>
        이름을 고른 뒤 누르면 내 안 되는 날로 표시돼요
      </p>
    </section>
  </div>

  <div id="overlay" class="overlay">
    <div class="sheet">
      <div class="handle"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // ===== 기본 설정 =====
    const EMOJIS = [
      '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮',
      '🐷', '🐸', '🐵', '🐧', '🐤', '🦄', '🐙', '🐳', '😀', '😎', '🤓', '🥳'
    ];
    const MAX_PEOPLE = 15;
    const MIN_PEOPLE = 2;
    const DEFAULT_SIZE = 4;
    const MAX_FACES = 2;
    const STORAGE_KEY = 'moilnal-v1';
    const DOW = ['일', '월', '화', '수', '목', '금', '토'];

    // ===== 저장/불러오기 =====
    // size: 전체 인원수 (이름 있는 사람 + 빈자리)
    // participants: [{ id, name, emoji, done }]  done = 응답 완료 여부
    // marks: { '2026-11-12': [참여자 id, ...] }  ← 그날 안 되는 사람들
    // selectedId: 지금 입력 중인 사람 (null이면 보기 모드, 저장하지 않음)
    function freshState() {
      return { size: DEFAULT_SIZE, participants: [], marks: {}, selectedId: null };
    }

    function load() {
      const s = freshState();
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && Array.isArray(saved.participants)) {
          s.participants = saved.participants.map(p => ({ ...p, done: !!p.done }));
          s.marks = saved.marks || {};
          // 예전 데이터에는 인원수가 없으므로 현재 참여자 수로 시작
          s.size = Number.isInteger(saved.size) ? saved.size : (s.participants.length || DEFAULT_SIZE);
        }
      } catch (e) {}
      s.size = Math.min(MAX_PEOPLE, Math.max(MIN_PEOPLE, s.size, s.participants.length));
      return s;
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          size: state.size,
          participants: state.participants,
          marks: state.marks
        }));
      } catch (e) {}
    }

    let state = load();
    let newEmoji = null;   // 빈자리를 채울 때 자동으로 들어갈 이모지

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let current = new Date(today.getFullYear(), today.getMonth(), 1);

    // ===== 작은 도우미들 =====
    const $ = id => document.getElementById(id);

    function h(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function dateKey(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function findPerson(id) {
      return state.participants.find(p => p.id === id);
    }

    function usedEmojis(exceptId) {
      return state.participants.filter(p => p.id !== exceptId).map(p => p.emoji);
    }

    function emptySlots() {
      return state.size - state.participants.length;
    }

    let toastTimer;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // 짧게 누르기(탭)와 길게 누르기(0.5초)를 구분
    function onPress(el, onTap, onLong) {
      let timer = null, fired = false, sx = 0, sy = 0;
      const cancel = () => { clearTimeout(timer); timer = null; };

      el.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        fired = false;
        sx = e.clientX; sy = e.clientY;
        cancel();
        timer = setTimeout(() => {
          timer = null;
          fired = true;
          if (navigator.vibrate) navigator.vibrate(15);
          onLong();
        }, 500);
      });
      el.addEventListener('pointermove', e => {
        if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel();
      });
      el.addEventListener('pointerup', cancel);
      el.addEventListener('pointerleave', cancel);
      el.addEventListener('pointercancel', cancel);
      el.addEventListener('click', e => {
        if (fired) { fired = false; return; }   // 길게 누른 뒤 손을 뗄 때는 탭으로 치지 않음
        onTap(e);
      });
      el.addEventListener('contextmenu', e => e.preventDefault());
    }

    // ===== 팝업 =====
    // position: 'bottom'(기본, 하단 시트) 또는 'top'(키보드 입력용 위쪽 팝업)
    let sheetOpenedAt = 0;
    function openSheet(build, position) {
      const body = $('sheetBody');
      body.innerHTML = '';
      body.className = '';
      build(body);
      sheetOpenedAt = Date.now();
      $('overlay').classList.toggle('top', position === 'top');
      $('overlay').classList.add('show');
    }
    function closeSheet() {
      $('overlay').classList.remove('show');
      document.activeElement && document.activeElement.blur();
    }
    $('overlay').addEventListener('click', e => {
      if (e.target === $('overlay') && Date.now() - sheetOpenedAt > 300) closeSheet();
    });

    // 확인 팝업 (취소 / 실행)
    function confirmSheet(title, desc, okLabel, onOk) {
      openSheet(body => {
        body.append(h('h3', 'sheet-title', title), h('p', 'sheet-desc', desc));
        const row = h('div', 'btn-row');
        const cancelBtn = h('button', 'btn ghost', '취소');
        const okBtn = h('button', 'btn danger', okLabel);
        cancelBtn.addEventListener('click', closeSheet);
        okBtn.addEventListener('click', () => { onOk(); closeSheet(); render(); });
        row.append(cancelBtn, okBtn);
        body.append(row);
      });
    }

    // 24개 이모지 그리드. used: 고를 수 없는(이미 쓰인) 이모지들
    function emojiGrid(currentEmoji, used, onPick) {
      const grid = h('div', 'emoji-grid');
      for (const emoji of EMOJIS) {
        const btn = h('button', emoji === currentEmoji ? 'cur' : '', emoji);
        if (used.includes(emoji)) btn.disabled = true;
        btn.addEventListener('click', () => onPick(emoji));
        grid.append(btn);
      }
      return grid;
    }

    function openEmojiPicker(person) {
      openSheet(body => {
        body.append(
          h('h3', 'sheet-title', `${person.name} 님의 캐릭터 고르기`),
          h('p', 'sheet-desc', '흐린 이모지는 다른 사람이 쓰고 있어요.'),
          emojiGrid(person.emoji, usedEmojis(person.id), emoji => {
            person.emoji = emoji;
            save();
            closeSheet();
            render();
          })
        );
      });
    }

    // ===== 참여자 =====
    // 빈자리를 채울 사람의 이모지: 아직 안 쓰인 것 중 하나를 자동으로
    function ensureNewEmoji() {
      const used = usedEmojis();
      if (!newEmoji || used.includes(newEmoji)) {
        const free = EMOJIS.filter(e => !used.includes(e));
        newEmoji = free[Math.floor(Math.random() * free.length)];
      }
    }

    // 빈자리 칩을 누르면: 이모지 버튼 + 이름 입력 + 저장
    function openFillSlot() {
      ensureNewEmoji();
      let input;
      openSheet(body => {
        body.className = 'add-sheet';
        body.append(h('h3', 'sheet-title', '내 이름 넣기'),
                    h('p', 'sheet-desc', '이모지를 누르면 캐릭터를 바꿀 수 있어요.'));

        const row = h('div', 'add-row');
        const emoBtn = h('button', 'emoji-btn', newEmoji);
        emoBtn.setAttribute('aria-label', '이모지 고르기');
        input = h('input');
        input.type = 'text';
        input.placeholder = '이름';
        input.maxLength = 10;
        input.autocomplete = 'off';
        const saveBtn = h('button', 'save-btn', '저장');
        row.append(emoBtn, input, saveBtn);
        body.append(row);

        // 이모지 버튼을 누르면 같은 팝업 안에 24개 그리드를 펼침
        let grid = null;
        emoBtn.addEventListener('click', () => {
          if (grid) { grid.remove(); grid = null; return; }
          grid = emojiGrid(newEmoji, usedEmojis(), emoji => {
            newEmoji = emoji;
            emoBtn.textContent = emoji;
            grid.remove();
            grid = null;
            input.focus();
          });
          body.append(grid);
        });

        const submit = () => {
          const name = input.value.trim();
          if (!name) return toast('이름을 입력해주세요');
          if (state.participants.some(p => p.name === name)) return toast('이미 있는 이름이에요');
          if (emptySlots() <= 0) return toast('빈자리가 없어요');

          const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          state.participants.push({ id, name, emoji: newEmoji, done: false });
          state.selectedId = id;   // 저장하면 바로 그 사람 입력 모드로
          toast(`${newEmoji} ${name} 님, 안 되는 날을 눌러주세요`);
          newEmoji = null;
          save();
          closeSheet();
          render();
        };
        saveBtn.addEventListener('click', submit);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); }
        });
      }, 'top');
      input.focus();
    }

    function removePerson(person) {
      state.participants = state.participants.filter(p => p.id !== person.id);
      for (const key of Object.keys(state.marks)) {
        state.marks[key] = state.marks[key].filter(id => id !== person.id);
        if (state.marks[key].length === 0) delete state.marks[key];
      }
      if (state.selectedId === person.id) state.selectedId = null;
    }

    // ===== 인원 조절 =====
    function changeSize(delta) {
      if (delta > 0) {
        if (state.size >= MAX_PEOPLE) return toast(`최대 ${MAX_PEOPLE}명까지예요`);
        state.size++;
        save();
        return render();
      }

      if (state.size <= MIN_PEOPLE) return toast(`최소 ${MIN_PEOPLE}명이에요`);
      if (emptySlots() > 0) {          // 빈자리부터 제거
        state.size--;
        save();
        return render();
      }

      // 빈자리가 없으면 누구를 뺄지 고르기
      openSheet(body => {
        body.append(h('h3', 'sheet-title', '누구를 뺄까요?'),
                    h('p', 'sheet-desc', '뺀 사람이 표시한 날도 함께 지워져요.'));
        const list = h('div', 'pick-list');
        for (const person of state.participants) {
          const btn = h('button');
          btn.append(h('span', 'emo', person.emoji), h('span', '', person.name));
          btn.addEventListener('click', () => {
            confirmSheet(`${person.emoji} ${person.name} 님을 뺄까요?`,
              '표시한 안 되는 날도 함께 지워지고, 되돌릴 수 없어요.', '빼기', () => {
                removePerson(person);
                state.size--;
                save();
                toast(`${person.name} 님을 뺐어요`);
              });
          });
          list.append(btn);
        }
        body.append(list);
      });
    }

    function renderPeople() {
      const size = state.size;
      const answered = state.participants.filter(p => p.done).length;
      const allDone = answered === size;

      // 맨 위 한 줄: 인원 + 진행 상황
      $('sizeLabel').textContent = `${size}명`;
      $('minusBtn').disabled = size <= MIN_PEOPLE;
      $('plusBtn').disabled = size >= MAX_PEOPLE;
      $('barFill').style.width = `${(answered / size) * 100}%`;
      $('progressText').textContent = allDone ? '모두 응답 🎉' : `${answered}/${size} 응답`;
      $('progress').classList.toggle('all', allDone);

      // 칩: 이름 있는 사람들 → 빈자리들
      const chips = $('chips');
      chips.innerHTML = '';

      for (const person of state.participants) {
        let cls = 'chip';
        if (person.id === state.selectedId) cls += ' sel';
        if (!person.done) cls += ' pending';
        const chip = h('div', cls);
        chip.append(h('span', 'emo', person.emoji), h('span', 'nm', person.name));
        if (person.done) chip.append(h('span', 'check', '✓'));

        chip.addEventListener('click', e => {
          if (e.target.closest('.emo')) return openEmojiPicker(person);
          // 이름 부분: 입력 모드 / 이미 선택된 사람이면 보기 모드로
          state.selectedId = state.selectedId === person.id ? null : person.id;
          render();
        });
        chips.append(chip);
      }

      for (let i = 0; i < emptySlots(); i++) {
        const chip = h('div', 'chip empty');
        chip.append(h('span', 'emo', '❔'), h('span', 'nm', '빈자리'));
        chip.addEventListener('click', openFillSlot);
        chips.append(chip);
      }

      // 안내 문구
      const hint = $('hint');
      hint.className = 'hint';
      hint.innerHTML = '';
      const sel = findPerson(state.selectedId);

      if (sel) {
        hint.classList.add('editing');
        const text = h('span');
        text.append(h('b', '', `${sel.emoji} ${sel.name}`), ' 님 입력 중');
        const done = h('button', 'done-btn', '완료');
        done.addEventListener('click', () => {
          sel.done = true;            // 완료 = 응답 완료 저장
          state.selectedId = null;
          save();
          render();
          toast('응답 완료! 이름을 다시 누르면 고칠 수 있어요');
        });
        hint.append(text, done);
      } else if (emptySlots() > 0) {
        hint.textContent = '빈자리를 눌러 내 이름을 넣어보세요';
      } else {
        hint.textContent = '이름을 누르면 입력, 이모지를 누르면 캐릭터 변경';
      }
    }

    // ===== 설정 =====
    function openSettings() {
      openSheet(body => {
        body.append(h('h3', 'sheet-title', '설정'));
        const resetBtn = h('button', 'btn ghost full', '처음부터 다시 만들기');
        resetBtn.addEventListener('click', () => {
          confirmSheet('처음부터 다시 만들까요?',
            '모든 참여자와 표시한 날이 지워지고, 되돌릴 수 없어요.', '초기화', () => {
              try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
              state = freshState();
              newEmoji = null;
              toast('새로 시작했어요');
            });
        });
        body.append(resetBtn);
      });
    }

    // ===== 달력 =====
    function toggleMark(key) {
      const list = state.marks[key] || [];
      const i = list.indexOf(state.selectedId);
      if (i >= 0) list.splice(i, 1);
      else list.push(state.selectedId);
      if (list.length) state.marks[key] = list;
      else delete state.marks[key];
      save();
      renderCalendar();
    }

    // 그날 안 되는 사람들 (입력 중인 사람이 맨 앞)
    function unavailablePeople(key) {
      const ids = state.marks[key] || [];
      return state.participants
        .filter(p => ids.includes(p.id))
        .sort((a, b) => (b.id === state.selectedId) - (a.id === state.selectedId));
    }

    function showDayDetail(date, key) {
      const people = unavailablePeople(key);
      openSheet(body => {
        body.append(h('h3', 'sheet-title',
          `${date.getMonth() + 1}월 ${date.getDate()}일 (${DOW[date.getDay()]})`));
        if (state.participants.length === 0) {
          body.append(h('p', 'sheet-desc', '아직 참여자가 없어요.'));
        } else if (people.length === 0) {
          body.append(h('p', 'sheet-desc', '모두 가능해요 🎉'));
        } else {
          body.append(h('p', 'sheet-desc', `${people.length}명 안 됨`));
          const ul = h('ul', 'who-list');
          for (const p of people) {
            const li = h('li');
            li.append(h('span', 'emo', p.emoji), h('span', '', p.name));
            ul.append(li);
          }
          body.append(ul);
        }
      });
    }

    function renderCalendar() {
      const year = current.getFullYear();
      const month = current.getMonth();
      $('title').textContent = `${year}년 ${month + 1}월`;

      const grid = $('grid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) grid.append(h('div'));

      for (let d = 1; d <= lastDate; d++) {
        const date = new Date(year, month, d);
        const key = dateKey(year, month, d);
        const cell = h('div', 'cell');
        const dow = date.getDay();
        const isPast = date < today;

        if (dow === 0) cell.classList.add('sun');
        if (dow === 6) cell.classList.add('sat');
        if (isPast) cell.classList.add('past');
        if (date.getTime() === today.getTime()) cell.classList.add('today');

        cell.append(h('span', 'num', d));

        const people = unavailablePeople(key);
        if (people.length > 0) {
          // 전체 인원 중 안 되는 사람 비율이 높을수록 배경을 진하게
          const ratio = Math.min(1, people.length / state.size);
          cell.style.background = `rgba(var(--no-rgb), ${(0.08 + 0.4 * ratio).toFixed(2)})`;

          const faces = h('div', 'faces');
          for (const p of people.slice(0, MAX_FACES)) {
            const face = h('span', 'face' + (p.id === state.selectedId ? ' mine' : ''), p.emoji);
            face.append(h('i', 'x', '×'));
            faces.append(face);
          }
          if (people.length > MAX_FACES) faces.append(h('span', 'more', `+${people.length - MAX_FACES}`));
          cell.append(faces, h('span', 'cnt', `${people.length}명`));
        } else if (state.participants.length > 0 && !isPast) {
          cell.classList.add('allok');
        }

        if (!isPast) {
          onPress(cell,
            () => {
              if (state.selectedId) toggleMark(key);   // 입력 모드: 내 X 토글
              else showDayDetail(date, key);           // 보기 모드: 그날 안 되는 사람 보기
            },
            () => showDayDetail(date, key)              // 길게 누르기: 항상 상세 보기
          );
        }

        grid.append(cell);
      }
    }

    function render() {
      renderPeople();
      renderCalendar();
    }

    // ===== 이벤트 연결 =====
    $('minusBtn').addEventListener('click', () => changeSize(-1));
    $('plusBtn').addEventListener('click', () => changeSize(1));
    $('gearBtn').addEventListener('click', openSettings);

    $('prev').addEventListener('click', () => {
      current.setMonth(current.getMonth() - 1);
      renderCalendar();
    });
    $('next').addEventListener('click', () => {
      current.setMonth(current.getMonth() + 1);
      renderCalendar();
    });

    render();
  </script>
</body>
</html>
