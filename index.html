      const lastDate = new Date(year, month + 1, 0).getDate();
      for (let d = 1; d <= lastDate; d++) {
        const date = new Date(year, month, d);
        if (date <= today) continue;
        const key = dateKey(year, month, d);
        const dow = date.getDay();
        list.push({
          date,
          key,
          hearts: votesOf(key).length,
          count: unavailablePeople(key).length,
          weekend: dow === 5 || dow === 6 || dow === 0 ? 0 : 1,
          order: d
        });
      }
      const voted = list.filter(r => r.hearts > 0)
        .sort((a, b) => b.hearts - a.hearts || a.count - b.count || a.order - b.order);
      const rest = list.filter(r => r.hearts === 0)
        .sort((a, b) => a.count - b.count || a.weekend - b.weekend || a.order - b.order);
      const picked = voted.concat(rest).slice(0, MAX_CANDIDATES);
      if (picked.length && picked[0].hearts > 0) picked[0].crown = true;   // 👑 ❤️ 최다
      return picked;
    }

    function renderRecommend() {
      const rec = $('rec');
      const recs = candidateDates();
      // 이름 있는 참여자가 없거나, 확정된 날이 있거나(변경 중 제외), 보고 있는 달에 후보가 없으면 숨김
      // (첫 사람도 바로 ❤️를 누를 수 있게 응답 여부와 상관없이 표시)
      const show = state.participants.length > 0 && (!activeConfirmed() || changing) && recs.length > 0;
      rec.hidden = !show;
      if (!show) return;

      $('recTitle').textContent = `✨ ${current.getMonth() + 1}월 후보`;

      const allAnswered = emptySlots() === 0 && state.participants.every(p => p.done);
      $('recPending').hidden = allAnswered;

      // 모두 응답했고 ❤️가 있으면: 가장 인기 있는 날 + [확정하기]
      const top = $('recTop');
      top.innerHTML = '';
      const crown = recs.find(r => r.crown);
      top.hidden = !(allAnswered && crown && !state.selectedId);
      if (!top.hidden) {
        const go = h('button', 'banner-btn', '확정하기');
        go.addEventListener('click', () => confirmDate(crown.date, crown.key));
        top.append(h('span', '', `👑 ${shortLabel(crown.date)}가 가장 인기 있어요`), go);
      }

      const box = $('recChips');
      box.innerHTML = '';
      for (const r of recs) {
        const d = r.date;
        const mine = myId() && myVote(r.key, myId());
        const chip = h('button', 'rec-chip ' + (r.count === 0 ? 'ok' : 'some') + (mine ? ' mine' : ''));
        chip.append(h('span', 'rc-date', `${r.crown ? '👑 ' : ''}${d.getMonth() + 1}/${d.getDate()} ${DOW[d.getDay()]}`));
        if (r.hearts > 0) chip.append(h('span', 'rc-heart', `❤️ ${r.hearts}`));
        const common = commonRange(r.key);
        if (common) chip.append(h('span', 'rc-time', `${rangeText(common)} OK`));
        chip.append(h('span', 'rc-no', r.count > 0 ? `${r.count}명 안 됨` : '모두 가능'));
        // 탭 → "나"로 ❤️ + 가능 시간 (달력 상세는 시트의 [📅 달력에서 보기])
        chip.addEventListener('click', () => requireMe(() => voteForDate(d, r.key)));
        box.append(chip);
      }
    }

    // 모임을 열 때 보여줄 달: 확정 날짜의 달 → 오늘 이후 '안 되는 날' 표시가 가장 많은 달 → 이번 달
    function pickStartMonth() {
      const c = activeConfirmed();
      if (c) {
        const d = keyToDate(c.key);
        current = new Date(d.getFullYear(), d.getMonth(), 1);
        return;
      }
      const counts = {};   // { '2026-12': 표시 수 }
      const tk = todayKey();
      for (const [key, ids] of Object.entries(state.marks)) {
        if (key < tk || !ids.length) continue;
        const ym = key.slice(0, 7);
        counts[ym] = (counts[ym] || 0) + ids.length;
      }
      let best = null;
      for (const ym of Object.keys(counts).sort()) {   // 같은 수면 더 가까운 달
        if (!best || counts[ym] > counts[best]) best = ym;
      }
      if (best) {
        const [y, m] = best.split('-').map(Number);
        current = new Date(y, m - 1, 1);
      } else {
        current = new Date(today.getFullYear(), today.getMonth(), 1);
      }
    }

    // 달력을 그 달로 옮기고, 날짜 칸을 반짝인 뒤 상세 시트 열기
    function goToDate(date, key) {
      current = new Date(date.getFullYear(), date.getMonth(), 1);
      renderCalendar();
      renderRecommend();
      const cell = document.querySelector(`.cell[data-key="${key}"]`);
      if (cell) {
        cell.scrollIntoView({ behavior: 'smooth', block: 'center' });
        cell.classList.add('flash');
        cell.addEventListener('animationend', () => cell.classList.remove('flash'), { once: true });
      }
      setTimeout(() => showDayDetail(date, key), 700);
    }

    // ===== 설정 (⚙️) =====
    function openSettings() {
      openSheet(body => {
        body.append(h('h3', 'sheet-title', '설정'));
        const menu = h('div', 'menu');

        const newBtn = h('button', '', '➕ 새 모임 만들기');
        newBtn.addEventListener('click', () => { closeSheet(); createAndGo(); });

        const shareBtn = h('button', '', '📤 다른 모임에 모일날 알려주기');
        shareBtn.addEventListener('click', () => { closeSheet(); recommendApp(); });

        const resetBtn = h('button', '', '🔄 처음부터 다시 만들기');
        resetBtn.addEventListener('click', () => {
          confirmSheet('정말 처음부터 다시 만들까요?',
            '모든 참여자의 입력, 확정 날짜, 장소 후보가 지워져요. 친구들 화면에도 바로 반영돼요. (24시간 안에는 되돌릴 수 있어요)',
            '처음부터', async () => {
              changing = false;
              const res = await write('reset_room', {}, () => {
                state.size = DEFAULT_SIZE;
                state.participants = [];
                state.marks = {};
                state.votes = {};
                state.places = [];
                state.placeId = null;
                state.confirmed = null;
                state.selectedId = null;
                state.undoUntil = new Date(Date.now() + 86400000);
              });
              if (res.ok) toast('처음부터 다시 시작해요');
            });
        });

        menu.append(newBtn, shareBtn);
        if (!draft) menu.append(resetBtn);   // 임시 모임은 지울 게 없음
        body.append(menu);

        // 내 모임 목록 (지금 모임 포함). 오른쪽 ⋯ 로 이름 바꾸기 / 목록에서 삭제 / 모임 삭제
        if (local.rooms.length) {
          body.append(h('div', 'sheet-section', '내 모임'));
          const list = h('div', 'room-list');
          for (const r of local.rooms) {
            const isCurrent = r.id === roomId;
            const row = h('div', 'room-row' + (isCurrent ? ' current' : ''));
            const main = h('button', 'room-main');
            const sub = [isCurrent ? '지금 보는 모임' : whenLabel(r.visitedAt), r.label].filter(Boolean).join(' · ');
            main.append(h('span', 'room-name', r.name || DEFAULT_ROOM_NAME), h('span', 'room-sub', sub));
            main.addEventListener('click', () => { if (isCurrent) closeSheet(); else goRoom(r.id); });
            const more = h('button', 'more-btn', '⋯');
            more.setAttribute('aria-label', `${r.name || DEFAULT_ROOM_NAME} 더보기`);
            more.addEventListener('click', () => openRoomMore(r));
            row.append(main, more);
            list.append(row);
          }
          body.append(list);
        }
      });
    }

    // 내 모임 항목의 ⋯ 메뉴
    function openRoomMore(r) {
      const name = r.name || DEFAULT_ROOM_NAME;
      openSheet(body => {
        body.append(h('h3', 'sheet-title', name));
        const menu = h('div', 'menu');

        const renameBtn = h('button', '', '✏️ 이름 바꾸기');
        renameBtn.addEventListener('click', () => openRename(r.id, name));

        const removeBtn = h('button', '', '🙈 내 목록에서 삭제');
        removeBtn.addEventListener('click', () => {
          confirmSheet('내 목록에서 삭제할까요?',
            '내 목록에서만 사라져요. 친구들은 계속 볼 수 있고, 링크로 다시 들어올 수 있어요',
            '목록에서 삭제', () => {
              forgetRoom(r.id);
              if (r.id === roomId) leaveCurrent(`'${name}'을(를) 내 목록에서 삭제했어요`);
              else toast('내 목록에서 삭제했어요');
            }, 'primary');
        });

        const deleteBtn = h('button', 'danger-text', '🗑️ 모임 삭제');
        deleteBtn.addEventListener('click', () => {
          confirmSheet(`'${name}' 모임을 삭제할까요?`,
            '모든 참여자에게서 이 모임이 삭제돼요. 24시간 안에는 복구할 수 있어요. 삭제할까요?',
            '삭제', () => deleteRoom(r.id, name));
        });

        menu.append(renameBtn, removeBtn, deleteBtn);
        body.append(menu);
      });
    }

    // 모임 이름 바꾸기 팝업 (지금 모임 / 목록의 다른 모임 모두)
    function openRename(id, currentName) {
      let input;
      openSheet(body => {
        body.className = 'add-sheet';
        body.append(h('h3', 'sheet-title', '모임 이름'),
                    h('p', 'sheet-desc', '친구들 화면에도 바로 바뀌어요.'));
        const row = h('div', 'add-row');
        input = h('input');
        input.type = 'text';
        input.value = currentName;
        input.maxLength = 20;
        input.autocomplete = 'off';
        const saveBtn = h('button', 'save-btn', '저장');
        row.append(input, saveBtn);
        body.append(row);

        let saving = false;
        const submit = async () => {
          if (saving) return;
          const name = input.value.trim();
          if (!name) return toast('모임 이름을 입력해주세요');
          if (name === currentName) return closeSheet();
          saving = true;
          saveBtn.disabled = true;
          const res = id === roomId
            ? await write('set_room_name', { p_name: name }, () => { state.name = name; })
            : await runRpc('set_room_name', { p_room_id: id, p_name: name });
          saving = false;
          saveBtn.disabled = false;
          if (!res.ok) return;
          setLocalName(id, name);
          closeSheet();
          toast('모임 이름을 바꿨어요');
        };
        saveBtn.addEventListener('click', submit);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); }
        });
      }, 'top');
      input.focus();
      input.select();
    }

    // 모임 삭제 (모든 참여자에게서 삭제, 24시간 안에 복구 가능)
    async function deleteRoom(id, name) {
      const res = await runRpc('delete_room', { p_room_id: id });
      if (!res.ok) return;
      forgetRoom(id);
      const msg = `'${name}' 모임을 삭제했어요. 24시간 안에는 링크로 들어가 복구할 수 있어요`;
      if (id === roomId) leaveCurrent(msg);
      else toast(msg);
    }

    // 삭제된 모임 화면: 24시간 이내면 [복구], 지났으면 [새 모임 만들기]
    function showDeleted(data) {
      closeSheet();
      const until = data.restore_until ? new Date(data.restore_until) : null;
      const canRestore = until && until > new Date();
      if (!canRestore) forgetRoom(roomId);
      showStatus('삭제된 모임이에요',
        canRestore
          ? { label: '복구', onClick: restoreRoom }
          : { label: '새 모임 만들기', onClick: createAndGo },
        canRestore ? `'${data.name}' · 24시간 안에는 복구할 수 있어요` : `'${data.name}'`);
    }

    async function restoreRoom() {
      const res = await runRpc('restore_room', { p_room_id: roomId });
      if (!res.ok) return;
      toast('모임을 복구했어요');
      refetch();
    }

    async function undoReset() {
      const res = await write('undo_reset', {});
      if (res.ok) {
        state.undoUntil = null;
        toast('되돌렸어요');
        render();
      }
    }

    function renderUndoBar() {
      $('undoBar').hidden = !(state.undoUntil && state.undoUntil > new Date());
    }

    // ===== 공유 =====
    const APP_URL = 'https://moilnal.github.io/';   // 배포 주소 (파라미터 없음)

    // 글을 클립보드에 복사. 안 되면 직접 복사할 수 있게 팝업으로 보여줌
    async function copyText(text, successMsg, fallbackTitle) {
      try {
        // 권한 확인 등으로 응답이 늦어지면 1.5초 뒤 직접 복사 화면으로
        await Promise.race([
          navigator.clipboard.writeText(text),
          new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 1500))
        ]);
        toast(successMsg);
      } catch (e) {
        openSheet(body => {
          body.append(h('h3', 'sheet-title', fallbackTitle),
                      h('p', 'sheet-desc', '아래 내용을 길게 눌러 복사한 뒤 단톡에 붙여넣으세요.'));
          const box = h('textarea', 'copy-input');
          box.readOnly = true;
          box.rows = 3;
          box.value = text;
          body.append(box);
          box.addEventListener('focus', () => box.select());
        });
      }
    }

    // 👋 멤버 초대: 이 모임 링크가 담긴 초대 메시지
    async function inviteMembers() {
      if (draft) {   // 초대 링크에는 모임 ID가 필요하니 먼저 서버에 모임을 만듦
        pending++;
        setBusy();
        try { await ensureRoom(); }
        catch (e) { return toast(NETWORK_ERROR); }
        finally { pending--; setBusy(); }
      }
      const url = location.origin + location.pathname + '?g=' + encodeURIComponent(roomId);
      copyText(`[${state.name}] 모일날에서 안 되는 날 체크해줘! 📅\n${url}`,
        '초대 메시지를 복사했어요! 단톡에 붙여넣으세요',
        '초대 메시지');
    }

    // 📤 다른 모임에 모일날 알려주기: ?new 주소 (받은 사람은 항상 새 빈 모임으로 시작)
    function recommendApp() {
      copyText(`약속 날짜 잡을 때 써봐! 안 되는 날만 체크하면 돼 📅\n${APP_URL}?new`,
        '추천 메시지를 복사했어요! 받은 사람은 새 모임으로 시작해요',
        '모일날 추천 메시지');
    }

    // ===== 달력 =====
    function toggleMark(key) {
      const me = state.selectedId;
      write('toggle_unavailable', { p_member_id: me, p_day: key }, () => {
        const list = state.marks[key] || [];
        const i = list.indexOf(me);
        if (i >= 0) list.splice(i, 1);
        else list.push(me);
        if (list.length) state.marks[key] = list;
        else delete state.marks[key];
        // 하나라도 표시하면 응답 완료, 해제해도 유지 (서버와 같은 규칙)
        const person = findPerson(me);
        if (person && hasMarks(me)) person.done = true;
      });
    }

    // 이 사람이 '안 되는 날'을 하나라도 표시했는지
    function hasMarks(id) {
      return Object.values(state.marks).some(list => list.includes(id));
    }

    // 그날 안 되는 사람들 (입력 중인 사람이 맨 앞)
    function unavailablePeople(key) {
      const ids = state.marks[key] || [];
      return state.participants
        .filter(p => ids.includes(p.id))
        .sort((a, b) => (b.id === state.selectedId) - (a.id === state.selectedId));
    }

    function showDayDetail(date, key) {
      const people = unavailablePeople(key);
      openSheet(body => {
        body.append(h('h3', 'sheet-title',
          `${date.getMonth() + 1}월 ${date.getDate()}일 (${DOW[date.getDay()]})`));
        if (state.participants.length === 0) {
          body.append(h('p', 'sheet-desc', '아직 참여자가 없어요.'));
        } else if (people.length === 0) {
          body.append(h('p', 'sheet-desc', '모두 가능해요 🎉'));
        } else {
          body.append(h('p', 'sheet-desc', `${people.length}명 안 됨`));
          const ul = h('ul', 'who-list');
          for (const p of people) {
            const li = h('li');
            li.append(h('span', 'emo', p.emoji), h('span', '', p.name));
            ul.append(li);
          }
          body.append(ul);
        }

        // ❤️ 투표한 사람 + 가능 시간 타임라인
        const voters = votesOf(key);
        if (voters.length) {
          body.append(h('div', 'hearts-row',
            `❤️ ${voters.length}명 좋아요 · ${voters.map(v => findPerson(v.id).emoji).join(' ')}`));
          body.append(timeline(key));
        }

        // 보기 모드에서만 확정/확정 취소 버튼 (지난 날짜·오늘은 확정 불가)
        if (state.selectedId) return;
        const active = activeConfirmed();
        const actions = h('div', 'sheet-actions');
        if (active && active.key === key) {
          const btn = h('button', 'btn ghost full', '확정 취소');
          btn.addEventListener('click', () => cancelConfirm(date));
          actions.append(btn);
        } else if (date > today && (!active || changing)) {
          const btn = h('button', 'btn primary full', '📌 이 날로 확정하기');
          btn.addEventListener('click', () => confirmDate(date, key));
          actions.append(btn);
        }
        if (actions.children.length) body.append(actions);
      });
    }

    function renderCalendar() {
      const year = current.getFullYear();
      const month = current.getMonth();
      $('title').textContent = `${year}년 ${month + 1}월`;

      const grid = $('grid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) grid.append(h('div'));

      for (let d = 1; d <= lastDate; d++) {
        const date = new Date(year, month, d);
        const key = dateKey(year, month, d);
        const cell = h('div', 'cell');
        cell.dataset.key = key;
        const dow = date.getDay();
        const isPast = date < today;

        if (dow === 0) cell.classList.add('sun');
        if (dow === 6) cell.classList.add('sat');
        if (isPast) cell.classList.add('past');
        if (date.getTime() === today.getTime()) cell.classList.add('today');

        cell.append(h('span', 'num', d));

        if (state.confirmed && state.confirmed.key === key) {
          cell.classList.add('confirmed');
          cell.append(h('span', 'pin', '📌'));
        }

        const people = unavailablePeople(key);
        if (people.length > 0) {
          // 전체 인원 중 안 되는 사람 비율이 높을수록 배경을 진하게
          const ratio = Math.min(1, people.length / state.size);
          // 연한 주황 #ffe6cc(255,230,204) → 진한 주황 #ffc999(255,201,153)
          cell.style.background = `rgb(255, ${Math.round(230 - 29 * ratio)}, ${Math.round(204 - 51 * ratio)})`;

          const faces = h('div', 'faces');
          for (const p of people.slice(0, MAX_FACES)) {
            const face = h('span', 'face' + (p.id === state.selectedId ? ' mine' : ''), p.emoji);
            face.append(h('i', 'x', '×'));
            faces.append(face);
          }
          if (people.length > MAX_FACES) faces.append(h('span', 'more', `+${people.length - MAX_FACES}`));
          cell.append(faces, h('span', 'cnt', `${people.length}명`));
        } else if (state.participants.length > 0 && !isPast) {
          cell.classList.add('allok');
        }

        if (!isPast) {
          onPress(cell,
            () => {
              if (state.selectedId) toggleMark(key);   // 입력 모드: 내 X 토글
              else showDayDetail(date, key);           // 보기 모드: 그날 안 되는 사람 보기
            },
            () => showDayDetail(date, key)              // 길게 누르기: 항상 상세 보기
          );
        }

        grid.append(cell);
      }
    }

    function render() {
      if (!roomId && !draft) return;
      renderTitle();
      renderUndoBar();
      renderPeople();
      renderCalendar();
      renderPlaces();
      renderTabbar();
    }

    // ===== 단계 이동 (하단 탭 바) =====
    function tabQuery() {
      return tab === 'date' ? '' : '&tab=' + tab;
    }

    function setTab(t) {
      if (!TABS.includes(t)) return;
      tab = t;
      document.body.dataset.tab = t;
      if (t !== 'date') state.selectedId = null;   // 날짜 입력 모드는 날짜 화면에서만
      const p = new URLSearchParams(location.search);
      if (t === 'date') p.delete('tab'); else p.set('tab', t);
      const qs = p.toString().replace(/^new=(&|$)/, 'new$1');   // ?new 모양 유지
      try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) {}
      window.scrollTo(0, 0);
      $('tabbar').classList.remove('away');
      render();
    }

    // 날짜가 확정되면 ✓ + "12/20 (토) 7시", 보고 있는 단계는 코랄
    function renderTabbar() {
      const c = activeConfirmed();
      const status = {
        date: c ? shortLabel(keyToDate(c.key)) + (c.hour != null ? ` ${c.hour % 12 || 12}시` : '') : '고르는 중',
        place: confirmedPlace() ? confirmedPlace().title : '아직',
        settle: '모인 뒤'
      };
      const finished = { date: !!c, place: !!confirmedPlace(), settle: false };
      const icons = { date: '📅', place: '📍', settle: '💸' };
      for (const step of document.querySelectorAll('.tabbar .step')) {
        const t = step.dataset.tab;
        const done = finished[t];
        step.classList.toggle('done', done);
        step.classList.toggle('cur', t === tab);
        step.querySelector('.dot').textContent = done ? '✓' : icons[t];
        step.querySelector('small').textContent = status[t];
      }
      const links = document.querySelectorAll('.tabbar .link');
      links[0].classList.toggle('solid', finished.date);    // 끝난 단계 → 다음 단계 선은 청록 실선
      links[1].classList.toggle('solid', finished.place);
    }

    // ===== 장소 단계: 지도 링크 후보 + ❤️ 투표 + 확정 =====
    // 미리보기를 읽을 수 있는 지도 링크 (Edge Function link-preview 의 허용 목록과 같음)
    const PREVIEW_HOSTS = [
      'naver.me', 'map.naver.com', 'm.map.naver.com', 'm.place.naver.com', 'pcmap.place.naver.com',
      'kko.to', 'map.kakao.com', 'place.map.kakao.com', 'applink.map.kakao.com'
    ];
    const MAX_PLACES = 10;
    let placeChanging = false;   // 확정 배너의 [변경]을 누른 상태
    let previewSeq = 0;          // 늦게 도착한 미리보기 결과 버리기용

    // 이 기기의 "나" (실제 참여자일 때만. 없어진 사람이면 null, 저장값은 applyRoom 에서 정리)
    function myId() {
      const p = findPerson(local.me[roomId]);
      return p ? p.id : null;
    }

    // "나" 바꾸기 (입력 모드는 닫음). ?new 임시 모임이면 서버 모임이 생긴 뒤 roomId 로 저장됨
    function setMe(id) {
      local.me[roomId] = id;
      saveLocal();
      state.selectedId = null;
    }

    // "나"로 하는 조작: "나"가 없으면 "누구세요?" 시트를 띄우고, 고르면 이어서 실행
    function requireMe(action) {
      if (myId()) return action();
      openWhoSheet(action);
    }

    function openWhoSheet(action) {
      openSheet(body => {
        body.append(h('h3', 'sheet-title', '누구세요?'),
                    h('p', 'sheet-desc', '내 캐릭터를 고르면 이어서 진행해요.'));
        const list = h('div', 'pick-list');
        for (const person of state.participants) {
          const btn = h('button');
          btn.append(h('span', 'emo', person.emoji), h('span', '', person.name));
          btn.addEventListener('click', () => {
            setMe(person.id);
            closeSheet();
            render();
            toast(`${person.emoji} ${person.name} 님 반가워요 👋`);
            action();
          });
          list.append(btn);
        }
        if (emptySlots() > 0) {
          const add = h('button');
          add.append(h('span', 'emo', '＋'), h('span', '', '내 이름 넣기'));
          add.addEventListener('click', () => openFillSlot(action));
          list.append(add);
        }
        body.append(list);
      });
    }

    // 남의 칩을 누르면: "나"가 없으면 바로 "나"로, 있으면 "OO 님으로 바꿀까요?" 확인
    function pickPerson(person) {
      const done = () => { setMe(person.id); render(); };
      if (!myId()) {
        done();
        return toast(`${person.emoji} ${person.name} 님 반가워요 👋`);
      }
      confirmSheet(`${person.emoji} ${person.name} 님으로 바꿀까요?`,
        `이 기기에서 ${person.name} 님으로 입력하게 돼요. 언제든 다시 바꿀 수 있어요.`, '맞아요', () => {
          done();
          toast(`${person.name} 님으로 바꿨어요`);
        }, 'primary');
    }

    // 내 안 되는 날 찍기 켜기/끄기 (다른 화면이면 날짜 화면으로 가서 켬)
    function toggleMarking() {
      const me = myId();
      if (!me) return;
      if (tab !== 'date') {
        setTab('date');
        state.selectedId = me;
      } else {
        state.selectedId = state.selectedId === me ? null : me;
      }
      render();
    }
    function findPlace(id) {
      return state.places.find(p => p.id === id);
    }
    function confirmedPlace() {
      return (state.placeId && findPlace(state.placeId)) || null;
    }
    // https 링크만 (아니면 null)
    function safeHttps(url) {
      try {
        const u = new URL(url);
        return u.protocol === 'https:' ? u.href : null;
      } catch (e) {
        return null;
      }
    }
    function hostOf(url) {
      try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
    }
    // ❤️ 최다 후보 (동점이면 먼저 추가된 것, ❤️ 0개면 없음)
    function topPlaceId() {
      let best = null;
      for (const p of state.places) {
        if (p.votes.length && (!best || p.votes.length > best.votes.length)) best = p;
      }
      return best ? best.id : null;
    }

    // 지도 서비스 공용 이미지(가게 사진이 아님)는 사진 없음으로 (link-preview 함수와 같은 규칙)
    const GENERIC_IMAGES = [
      'https://ssl.pstatic.net/static/maps/assets/images/og-map-',
      'https://t1.kakaocdn.net/localimg/localimages/07/common/ogtag'
    ];
    function placeImage(url) {
      const src = url && safeHttps(url);
      return src && !GENERIC_IMAGES.some(p => src.startsWith(p)) ? src : null;
    }

    // 링크로 짐작한 임시 이름 (이름을 못 읽었을 때)
    const TEMP_PLACE_NAMES = ['네이버지도 장소', '카카오맵 장소', '새 장소'];
    function defaultPlaceName(url) {
      const host = hostOf(url);
      if (/naver/.test(host)) return '네이버지도 장소';
      if (/kakao|kko\.to/.test(host)) return '카카오맵 장소';
      return '새 장소';
    }

    // 가게 사진 (16:9). 못 불러오면 사진 영역을 없앰
    function placePhoto(url, className, onFail) {
      const src = placeImage(url);
      if (!src) return null;
      const box = h('div', className);
      const img = document.createElement('img');
      img.referrerPolicy = 'no-referrer';
      img.alt = '';
      img.addEventListener('error', () => { box.remove(); if (onFail) onFail(); });
      img.src = src;
      box.append(img);
      return box;
    }

    function renderPlaces() {
      const picked = confirmedPlace();
      if (!picked) placeChanging = false;
      const showList = !picked || placeChanging;

      // 확정 배너: "📍 장소 이름" + [변경]
      const banner = $('placeBanner');
      banner.innerHTML = '';
      banner.hidden = !picked;
      if (picked) {
        const b = h('div', 'banner');
        const main = h('div', 'banner-main');
        const title = h('span', 'banner-title', `📍 ${picked.title}`);
        title.addEventListener('click', () => showPlaceDetail(picked.id));
        const change = h('button', 'banner-btn', placeChanging ? '닫기' : '변경');
        change.addEventListener('click', () => { placeChanging = !placeChanging; renderPlaces(); });
        main.append(title, change);
        b.append(main);
        banner.append(b);
      }
      const hint = $('placeHint');
      hint.hidden = !(picked && placeChanging);
      hint.textContent = '다른 곳을 골라 다시 확정하세요';

      const empty = state.places.length === 0;
      $('addPlaceBtn').hidden = empty && showList;
      $('placeEmpty').hidden = !(empty && showList);
      $('decidedBtn').hidden = !showList;

      const list = $('placeList');
      list.innerHTML = '';
      if (!showList) return;

      const me = myId();
      const top = topPlaceId();
      for (const p of state.places) {
        let cls = 'place-card';
        if (p.id === top) cls += ' top';
        if (p.id === state.placeId) cls += ' picked';
        const card = h('div', cls);
        const body = h('div', 'place-body');
        // 사진이 없으면 큰 사진 영역 대신 작은 📍 아이콘
        const pin = h('div', 'place-pin', '📍');
        const photo = placePhoto(p.image, 'place-photo', () => body.prepend(pin));
        if (photo) card.append(photo);
        else body.append(pin);

        const info = h('div', 'place-info');
        const nameEl = h('div', 'place-name', (p.id === top ? '👑 ' : '') + p.title);
        // 임시 이름이면 바로 [✏️ 이름 붙이기] (이름을 바꾸면 사라짐)
        if (TEMP_PLACE_NAMES.includes(p.title)) {
          const nameRow = h('div', 'place-name-row');
          const nameBtn = h('button', 'small-btn', '✏️ 이름 붙이기');
          nameBtn.addEventListener('click', e => { e.stopPropagation(); showPlaceDetail(p.id, true); });
          nameRow.append(nameEl, nameBtn);
          info.append(nameRow);
        } else {
          info.append(nameEl);
        }
        if (p.address) info.append(h('div', 'place-addr', p.address));
        const adder = findPerson(p.by);
        info.append(h('div', 'place-sub', hostOf(p.url) + (adder ? ` · ${adder.emoji} 추가` : '')));

        const mine = !!me && p.votes.includes(me);
        const heart = h('button', 'place-heart' + (mine ? ' on' : ''));
        heart.setAttribute('aria-label', '좋아요');
        heart.append(
          h('span', '', `${mine ? '❤️' : '🤍'} ${p.votes.length}`),
          h('span', 'who', p.votes.slice(0, 3).map(id => (findPerson(id) || {}).emoji || '').join(''))
        );
        heart.addEventListener('click', e => { e.stopPropagation(); togglePlaceVote(p.id); });

        body.append(info, heart);
        card.append(body);
        card.addEventListener('click', () => showPlaceDetail(p.id));
        list.append(card);
      }
    }

    function togglePlaceVote(id) {
      const me = myId();
      if (!me) return requireMe(() => togglePlaceVote(id));   // "누구세요?" 고른 뒤 이어서
      write('toggle_place_vote', { p_member_id: me, p_place_id: id }, () => {
        const p = findPlace(id);
        if (!p) return;
        const i = p.votes.indexOf(me);
        if (i >= 0) p.votes.splice(i, 1);
        else p.votes.push(me);
      });
    }

    async function confirmPlace(id) {
      const res = await write('confirm_place', { p_place_id: id }, () => {
        state.placeId = id;
        placeChanging = false;
      });
      if (res.ok) toast(id ? '📍 장소를 확정했어요' : '장소 확정을 취소했어요');
    }

    // 후보 올리기. decided = "이미 정했어요"로 열었으면 올리면서 바로 확정
    async function addPlace(url, title, image, address, decided) {
      const me = myId();
      const tempId = 'tmp-' + Date.now();
      const res = await write('add_place',
        { p_member_id: me, p_url: url, p_title: title, p_image: image, p_address: address }, () => {
          state.places.push({ id: tempId, url, title, image, address, by: me, votes: [] });
        });
      if (!res.ok) return;
      const p = findPlace(tempId);
      if (p) p.id = res.data;
      if (decided) return confirmPlace(res.data);
      toast('후보로 올렸어요');
    }

    // 미리보기 요청 (Edge Function, 8초 안에 답이 없으면 실패로)
    async function fetchPreview(url) {
      if (!db) throw new Error('network');
      const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000));
      const { data, error } = await Promise.race([
        db.functions.invoke('link-preview', { body: { url } }),
        timeout
      ]);
      if (error || !data) throw error || new Error('empty');
      return data;
    }

    // 지도 앱 공유 문구 읽기
    // 예: "[네이버지도]\n바람난수제비\n서울 중구 을지로45길 46 ...\nhttps://naver.me/FdGx5s9U"
    //  → [..] 표시는 지우고(같은 줄에 남는 글은 이름 후보), https:// 줄은 링크,
    //    링크가 아닌 첫 줄은 이름, 그다음 줄은 주소
    function parseShare(text) {
      const out = { link: null, name: '', address: '' };
      for (const raw of text.split(/\r?\n/)) {
        const line = raw.replace(/^\s*(\[[^\]]*\]\s*)+/, '').trim();
        if (!line) continue;
        const m = line.match(/https:\/\/\S+/);
        if (m) {
          if (!out.link) out.link = m[0];
          continue;
        }
        if (/^http:\/\//i.test(line)) continue;   // https 가 아닌 링크는 이름/주소로 쓰지 않음
        if (!out.name) out.name = line;
        else if (!out.address) out.address = line;
      }
      out.name = [...out.name.replace(/\s+/g, ' ')].slice(0, 40).join('');
      out.address = [...out.address.replace(/\s+/g, ' ')].slice(0, 80).join('').trim();
      return out;
    }

    function openAddPlace(decided) {
      if (!myId()) return requireMe(() => openAddPlace(decided));   // 추가한 사람 = "나"
      if (state.places.length >= MAX_PLACES) return toast(`후보는 ${MAX_PLACES}개까지 올릴 수 있어요`);
      let input;
      openSheet(body => {
        body.append(h('h3', 'sheet-title', decided ? '어디로 정했어요?' : '📍 후보 올리기'));

        input = document.createElement('textarea');
        input.className = 'link-input';
        input.rows = 2;
        input.placeholder = '지도 링크를 붙여넣어 주세요';
        const status = h('div', 'link-state');
        const previewBox = h('div');
        // 이름 칸은 선택 (못 읽었을 때만 보임)
        const nameWrap = h('div', 'name-input');
        const nameInput = document.createElement('input');
        nameInput.maxLength = 40;
        nameWrap.append(h('label', '', '이름을 알면 적어주세요'), nameInput);
        nameWrap.hidden = true;
        const submit = h('button', 'btn primary full sheet-actions', '후보로 올리기');

        // shared: 공유 문구에서 읽은 이름·주소, image: 미리보기 사진
        let link = null, shared = { name: '', address: '' }, previewTitle = '', image = null;
        const typedName = () => nameInput.value.trim().replace(/\s+/g, ' ');
        const knownName = () => shared.name || previewTitle;
        const update = () => { submit.disabled = !link; };   // 링크만 있으면 바로 올릴 수 있음
        const warn = msg => { status.className = 'link-state warn'; status.textContent = msg; };

        // 미리보기 카드 (사진 + 이름 + 주소). 이름을 모르면 이름 칸
        const paint = () => {
          previewBox.innerHTML = '';
          const name = knownName();
          if (name) {
            const card = h('div', 'link-preview');
            const photo = placePhoto(image, 'place-photo');
            if (photo) card.append(photo);
            card.append(h('div', 'place-name', name));
            if (shared.address) card.append(h('div', 'place-addr', shared.address));
            previewBox.append(card);
          }
          nameWrap.hidden = !link || !!name;
        };

        const handle = async () => {
          const seq = ++previewSeq;
          link = null; previewTitle = ''; image = null;
          status.className = 'link-state';
          status.textContent = '';

          const text = input.value.trim();
          shared = parseShare(text);
          const url = shared.link;
          if (!url) {
            if (/http:\/\//i.test(text)) warn('https:// 로 시작하는 링크만 올릴 수 있어요');
            paint();
            return update();
          }
          if (url.length > 2000 || !safeHttps(url)) { warn('링크를 확인해주세요'); paint(); return update(); }
          if (state.places.some(p => p.url === url)) { warn('이미 올라온 곳이에요'); paint(); return update(); }
          link = url;
          paint();
          update();

          // 미리보기를 읽을 수 없는 링크는 여기까지
          if (!PREVIEW_HOSTS.includes(hostOf(url))) return;

          // 이름을 이미 읽었으면 미리보기는 사진용으로만
          if (!shared.name) status.textContent = '미리보기를 불러오는 중…';
          let data = null;
          try { data = await fetchPreview(url); } catch (e) {}
          if (seq !== previewSeq) return;   // 그사이 다른 링크를 붙여넣음
          status.textContent = '';
          previewTitle = data && typeof data.title === 'string' ? [...data.title.trim()].slice(0, 40).join('') : '';
          image = data && typeof data.image === 'string' ? placeImage(data.image) : null;
          paint();
        };

        input.addEventListener('input', handle);
        nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') submit.click(); });
        submit.addEventListener('click', () => {
          if (submit.disabled) return;
          const title = knownName() || typedName() || defaultPlaceName(link);
          closeSheet();
          addPlace(link, title, image, shared.address || null, decided);
        });

        const guide = h('div', 'link-hint', '네이버지도 → 공유 → 복사해서 붙여넣으면 이름과 주소가 자동으로 들어가요');
        body.append(input, guide, status, previewBox, nameWrap, submit);
        update();
      }, 'top');
      input.focus();
    }

    // startRename: 열자마자 이름 고치기 칸으로 (카드의 [✏️ 이름 붙이기])
    function showPlaceDetail(id, startRename) {
      const p = findPlace(id);
      if (!p) return;
      openSheet(body => {
        const photo = placePhoto(p.image, 'detail-photo');
        if (photo) body.append(photo);

        // 이름 + 작은 [이름 고치기]
        const row = h('div', 'title-row');
        const renameBtn = h('button', 'small-btn', '이름 고치기');
        row.append(h('h3', 'sheet-title', p.title), renameBtn);
        body.append(row);
        renameBtn.addEventListener('click', () => {
          const wrap = h('div', 'add-row');
          const input = document.createElement('input');
          input.maxLength = 40;
          // 임시 이름이면 비워서 "가게 이름" 안내만, 진짜 이름이면 채워서
          if (TEMP_PLACE_NAMES.includes(p.title)) input.placeholder = '가게 이름';
          else input.value = p.title;
          const save = h('button', 'save-btn', '저장');
          wrap.append(input, save);
          row.replaceWith(wrap);
          input.focus();
          setTimeout(() => input.focus(), 50);   // 시트가 막 열린 경우에도 포커스
          const go = async () => {
            const name = input.value.trim().replace(/\s+/g, ' ');
            if (!name) return toast('이름을 입력해주세요');
            closeSheet();
            const res = await write('rename_place', { p_place_id: id, p_title: name }, () => {
              const q = findPlace(id);
              if (q) q.title = name;
            });
            if (res.ok) toast('이름을 고쳤어요');
          };
          save.addEventListener('click', go);
          input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
        });

        if (p.address) body.append(h('p', 'detail-addr', p.address));
        const adder = findPerson(p.by);
        body.append(h('p', 'sheet-desc', hostOf(p.url) + (adder ? ` · ${adder.emoji} ${adder.name} 님이 추가` : '')));

        const href = safeHttps(p.url);
        if (href) {
          const a = h('a', 'map-link', '🔗 지도에서 보기');
          a.href = href;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          body.append(a);
        }

        // 투표한 사람 전체
        const voters = h('div', 'voters');
        const names = p.votes.map(v => findPerson(v)).filter(Boolean).map(q => `${q.emoji} ${q.name}`);
        if (names.length) voters.append(h('b', '', `❤️ ${names.length}명`), ` · ${names.join(', ')}`);
        else voters.textContent = '아직 ❤️가 없어요';
        body.append(voters);

        const isPicked = state.placeId === id;
        const main = h('button', isPicked ? 'btn ghost full sheet-actions' : 'btn primary full sheet-actions',
          isPicked ? '확정 취소' : '📍 이 장소로 확정');
        main.addEventListener('click', () => { closeSheet(); confirmPlace(isPicked ? null : id); });
        body.append(main);

        const del = h('button', 'text-danger', '후보 삭제');
        del.addEventListener('click', () => {
          confirmSheet('후보를 삭제할까요?', `"${p.title}" 후보와 ❤️가 함께 지워져요.`, '삭제', async () => {
            const res = await write('delete_place', { p_place_id: id }, () => {
              state.places = state.places.filter(q => q.id !== id);
              if (state.placeId === id) state.placeId = null;
            });
            if (res.ok) toast('후보를 삭제했어요');
          });
        });
        body.append(del);
        if (startRename) renameBtn.click();
      });
    }

    // ===== 로딩 / 오류 화면 =====
    function showStatus(text, button, subText) {
      $('main').hidden = true;
      $('linkBtn').hidden = true;
      $('gearBtn').hidden = true;
      $('undoBar').hidden = true;
      $('roomTitleRow').hidden = true;
      $('tabbar').hidden = true;
      const box = $('status');
      box.hidden = false;
      box.innerHTML = '';
      box.append(h('div', '', text));
      if (subText) box.append(h('div', 'sub', subText));
      if (button) {
        const btn = h('button', 'btn primary full', button.label);
        btn.addEventListener('click', button.onClick);
        box.append(btn);
      }
    }

    function showNotFound() {
      roomId = null;
      showStatus('모임을 찾을 수 없어요. 링크가 맞는지 확인해주세요.',
        { label: '새 모임 만들기', onClick: createAndGo });
    }

    function showMain() {
      $('status').hidden = true;
      $('main').hidden = false;
      $('linkBtn').hidden = false;
      $('gearBtn').hidden = false;
      $('roomTitleRow').hidden = false;
      $('tabbar').hidden = false;
    }

    function renderTitle() {
      $('roomTitleText').textContent = state.name;
      document.title = `${state.name} · 모일날`;
    }

    // ===== 실시간: 모임 ID 이름의 broadcast 채널 =====
    // 서버가 저장할 때마다 'changed' 신호를 보냄 → 받으면 get_room 으로 다시 불러오기
    function subscribe() {
      let first = true;
      db.channel(roomId)
        .on('broadcast', { event: 'changed' }, () => scheduleRefetch())
        .subscribe(status => {
          if (status === 'SUBSCRIBED') {
            if (!first) scheduleRefetch();   // 다시 연결되면 놓친 변경이 있을 수 있으니 한 번 불러오기
            first = false;
          }
        });
    }

    // 다른 앱에 갔다가 돌아오면 최신 상태로
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && roomId) scheduleRefetch();
    });

    // ===== 시작 =====
    async function init() {
      if (!db) {
        return showStatus(NETWORK_ERROR, { label: '다시 시도', onClick: () => location.reload() });
      }

      const params = new URLSearchParams(location.search);

      // ?new: 최근 모임과 상관없이 새 빈 모임. 서버에는 첫 입력 때 만듦
      if (params.has('new')) {
        draft = true;
        roomId = null;
        showMain();
        render();
        const flash = takeFlash();
        if (flash) toast(flash);
        return;
      }

      let id = params.get('g');
      const fromList = !id;
      let data;

      try {
        if (!id) {
          // 링크 없이 열면: 최근 모임 → 없으면 새 모임
          id = local.rooms.length ? local.rooms[0].id : await callRpc('create_room', {});
          const url = location.pathname + '?g=' + encodeURIComponent(id) + tabQuery();
          try { history.replaceState(null, '', url); }
          catch (e) { location.replace(url); return; }
        }

        roomId = id;
        data = await callRpc('get_room', { p_room_id: id });
      } catch (err) {
        if (err && err.message === 'room_not_found') {
          forgetRoom(id);
          if (fromList) {   // 내 목록의 모임이 사라졌으면(90일 미접속 삭제 등) 다시 시작
            const url = location.pathname;
            try { history.replaceState(null, '', url); } catch (e) {}
            return init();
          }
          return showNotFound();
        }
        roomId = null;
        return showStatus(NETWORK_ERROR, { label: '다시 시도', onClick: () => location.reload() });
      }

      if (data.deleted) {
        if (fromList) {   // 내 목록의 최근 모임이 삭제됐으면 목록에서 빼고 다음 모임으로
          forgetRoom(id);
          try { history.replaceState(null, '', location.pathname); } catch (e) {}
          return init();
        }
        subscribe();      // 친구가 복구하면 바로 다시 보이도록 알림은 계속 받음
        return showDeleted(data);
      }

      applyRoom(data);
      pickStartMonth();
      rememberRoom(true);
      showMain();
      render();
      subscribe();

      // 다른 모임에서 넘어올 때 남긴 안내가 있으면 그걸, 없으면 재접속 인사
      const flash = takeFlash();
      const me = findPerson(local.me[roomId]);
      if (flash) toast(flash);
      else if (me) toast(`${me.emoji} ${me.name} 님 반가워요 👋`);
    }

    // ===== 이벤트 연결 =====
    $('minusBtn').addEventListener('click', () => changeSize(-1));
    $('plusBtn').addEventListener('click', () => changeSize(1));
    $('gearBtn').addEventListener('click', openSettings);
    $('linkBtn').addEventListener('click', inviteMembers);
    $('roomTitle').addEventListener('click', () => openRename(roomId, state.name));
    $('undoBtn').addEventListener('click', undoReset);

    // 단계 이동
    for (const step of document.querySelectorAll('.tabbar .step')) {
      step.addEventListener('click', () => setTab(step.dataset.tab));
    }
    for (const b of document.querySelectorAll('.back-date')) {
      b.addEventListener('click', () => setTab('date'));
    }
    $('placeNudge').addEventListener('click', () => setTab('place'));
    $('addPlaceBtn').addEventListener('click', () => openAddPlace(false));
    $('addPlaceBtn2').addEventListener('click', () => openAddPlace(false));
    $('decidedBtn').addEventListener('click', () => openAddPlace(true));

    // 탭 바: 아래로 스크롤하면 숨고, 위로 스크롤하면 다시 보임
    let lastScrollY = window.scrollY;
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      const bar = $('tabbar');
      if (y > lastScrollY + 6 && y > 40) bar.classList.add('away');
      else if (y < lastScrollY - 6) bar.classList.remove('away');
      else return;
      lastScrollY = y;
    }, { passive: true });

    $('prev').addEventListener('click', () => {
      current.setMonth(current.getMonth() - 1);
      renderCalendar();
      renderRecommend();
    });
    $('next').addEventListener('click', () => {
      current.setMonth(current.getMonth() + 1);
      renderCalendar();
      renderRecommend();
    });

    init();
  </script>
</body>
</html>
