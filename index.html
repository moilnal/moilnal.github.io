<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모일날</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #f7f4fb;          /* 연한 라벤더 배경 */
      --card: #ffffff;
      --text: #3d3a4a;
      --muted: #9a96a8;
      --line: #ece8f3;
      --accent: #a78bdb;      /* 파스텔 보라: 오늘, 선택 강조 */
      --accent-soft: #efe9fa;
      --ok: #5bbf8a;          /* 초록: 모두 가능한 날 */
      --no-rgb: 224, 90, 106; /* 빨강: 안 되는 날 (배경 진하기에 사용) */
      --sat: #4a7bd8;
      --sun: #e05a6a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    button { font-family: inherit; color: inherit; }

    .app { max-width: 420px; margin: 0 auto; }

    h1 {
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      color: var(--accent);
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(120, 100, 160, 0.08);
    }

    /* ---------- 참여자 영역 ---------- */
    .people { padding: 14px; margin-bottom: 12px; }

    .add-row { display: flex; gap: 8px; }

    .emoji-btn {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #fcfbfe;
      font-size: 22px;
      cursor: pointer;
    }

    .add-row input {
      flex: 1;
      min-width: 0;
      height: 44px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: #fcfbfe;
      outline: none;
    }
    .add-row input:focus { border-color: var(--accent); }

    .add-btn {
      height: 44px;
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff !important;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chips:empty { display: none; }

    .chip {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 2px 0 3px;
      border: 2px solid var(--line);
      border-radius: 19px;
      background: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .chip.sel { border-color: var(--accent); background: var(--accent-soft); }

    /* 칩의 이모지 부분: 탭하면 이모지 변경 */
    .chip .emo {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #f4f1f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }
    .chip.sel .emo { background: #fff; }

    /* 칩의 이름 부분: 탭하면 입력할 사람 선택 */
    .chip .nm { padding: 0 4px 0 7px; line-height: 34px; }

    .chip .del {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* 입력 모드 안내: "멍청 님 입력 중" + 완료 */
    .hint.editing {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--accent-soft);
      border-radius: 12px;
      padding: 6px 6px 6px 12px;
      color: var(--text);
    }
    .hint.editing b { font-weight: 700; }
    .done-btn {
      height: 34px;
      padding: 0 16px;
      flex-shrink: 0;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff !important;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ---------- 달력 ---------- */
    .calendar { padding: 14px 4px 16px; }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      margin-bottom: 8px;
    }

    .month-nav button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 22px;
      cursor: pointer;
    }
    .month-nav button:active { background: #e2d8f5; }

    #title { font-size: 19px; font-weight: 700; }

    .weekdays, #grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
    }

    .weekdays div {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      padding: 6px 0;
    }

    .cell {
      min-height: 66px;
      min-width: 0;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 0;
      container-type: inline-size;   /* 이모지 크기를 칸 폭 기준으로 정하기 위함 */
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      transition: background 0.15s;
    }

    .num {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
    }

    .weekdays .sun, .cell.sun .num { color: var(--sun); }
    .weekdays .sat, .cell.sat .num { color: var(--sat); }

    .cell.past { opacity: 0.35; cursor: default; }

    /* 모두 가능한 날: 초록 동그라미 테두리 */
    .cell.allok .num { box-shadow: 0 0 0 2px var(--ok); }

    /* 오늘: 보라색으로 채운 숫자 */
    .cell.today .num { background: var(--accent); color: #fff; font-weight: 700; }

    /* 이모지 최대 2개 + "+n", 한 줄로 겹치지 않게 */
    .faces {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 3px;               /* X 배지가 옆 이모지를 덮지 않을 만큼 띄움 */
      line-height: 1;
      max-width: 100%;
    }

    /* 칸 폭에 맞춰 이모지 크기를 살짝 줄여서 좁은 폰에서도 한 줄에 들어가게 */
    .face {
      position: relative;
      font-size: min(11px, 22cqw);
      line-height: 1;
    }

    .face .x {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 0 0 0 1px #fff;
      color: #fff;
      font-size: 7px;
      font-style: normal;
      font-weight: 800;
      line-height: 8px;
      text-align: center;
    }

    /* 지금 입력 중인 사람의 X는 조금 더 크게 */
    .face.mine .x {
      right: -3px;
      bottom: -3px;
      width: 11px;
      height: 11px;
      font-size: 9px;
      line-height: 11px;
    }

    .more { font-size: 9px; font-weight: 700; letter-spacing: -0.3px; }

    .cnt {
      margin-top: auto;
      font-size: 10px;
      font-weight: 700;
      color: #a33d4b;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .lg-today { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
    .lg-ok { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ok); }

    .legend-tip {
      margin-top: 6px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ---------- 하단 시트 ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(40, 30, 60, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      margin: 0 auto;
      background: #fff;
      border-radius: 22px 22px 0 0;
      padding: 10px 20px 28px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }
    .overlay.show .sheet { transform: none; }

    .handle {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--line);
      margin: 0 auto 14px;
    }

    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .sheet-desc { font-size: 14px; color: var(--muted); margin-bottom: 16px; }

    .who-list { list-style: none; }
    .who-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
      font-weight: 600;
    }
    .who-list li:last-child { border-bottom: none; }
    .who-list .emo { font-size: 22px; }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .emoji-grid button {
      aspect-ratio: 1;
      border: 2px solid transparent;
      border-radius: 14px;
      background: #faf8fd;
      font-size: 26px;
      cursor: pointer;
    }
    .emoji-grid button.cur { border-color: var(--accent); background: var(--accent-soft); }
    .emoji-grid button:disabled { opacity: 0.2; cursor: default; }

    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      height: 48px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.ghost { background: #f1eef6; }
    .btn.danger { background: var(--sun); color: #fff; }

    /* ---------- 안내 토스트 ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 36px;
      transform: translate(-50%, 20px);
      background: rgba(50, 42, 70, 0.92);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 20px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="app">
    <h1>모일날</h1>

    <section class="card people">
      <div class="add-row">
        <button id="emojiBtn" class="emoji-btn" aria-label="이모지 고르기"></button>
        <input id="nameInput" type="text" placeholder="이름 입력" maxlength="10" autocomplete="off">
        <button id="addBtn" class="add-btn">추가</button>
      </div>
      <div id="chips" class="chips"></div>
      <div id="hint" class="hint"></div>
    </section>

    <section class="card calendar">
      <div class="month-nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <div id="title"></div>
        <button id="next" aria-label="다음 달">›</button>
      </div>

      <div class="weekdays">
        <div class="sun">일</div><div>월</div><div>화</div><div>수</div>
        <div>목</div><div>금</div><div class="sat">토</div>
      </div>

      <div id="grid"></div>

      <div class="legend">
        <span><i class="lg-today"></i>오늘</span>
        <span><i class="lg-ok"></i>모두 가능</span>
      </div>
      <p class="legend-tip">
        날짜를 누르면 안 되는 사람을 볼 수 있어요<br>
        이름을 고른 뒤 누르면 내 안 되는 날로 표시돼요
      </p>
    </section>
  </div>

  <div id="overlay" class="overlay">
    <div class="sheet">
      <div class="handle"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // ===== 기본 설정 =====
    const EMOJIS = [
      '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮',
      '🐷', '🐸', '🐵', '🐧', '🐤', '🦄', '🐙', '🐳', '😀', '😎', '🤓', '🥳'
    ];
    const MAX_PEOPLE = 15;
    const MIN_PEOPLE = 2;
    const MAX_FACES = 2;
    const STORAGE_KEY = 'moilnal-v1';
    const DOW = ['일', '월', '화', '수', '목', '금', '토'];

    // ===== 저장/불러오기 =====
    // participants: [{ id, name, emoji }]
    // marks: { '2026-11-12': [참여자 id, ...] }  ← 그날 안 되는 사람들
    // selectedId: 지금 입력 중인 사람 (null이면 보기 모드, 저장하지 않음)
    function load() {
      const s = { participants: [], marks: {}, selectedId: null };
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && Array.isArray(saved.participants)) {
          s.participants = saved.participants;
          s.marks = saved.marks || {};
        }
      } catch (e) {}
      return s;
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          participants: state.participants,
          marks: state.marks
        }));
      } catch (e) {}
    }

    let state = load();
    let newEmoji = null;   // 이름 입력칸 왼쪽 이모지 버튼에 들어갈 이모지

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let current = new Date(today.getFullYear(), today.getMonth(), 1);

    // ===== 작은 도우미들 =====
    const $ = id => document.getElementById(id);

    function h(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function dateKey(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function findPerson(id) {
      return state.participants.find(p => p.id === id);
    }

    function usedEmojis(exceptId) {
      return state.participants.filter(p => p.id !== exceptId).map(p => p.emoji);
    }

    let toastTimer;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // 짧게 누르기(탭)와 길게 누르기(0.5초)를 구분
    function onPress(el, onTap, onLong) {
      let timer = null, fired = false, sx = 0, sy = 0;
      const cancel = () => { clearTimeout(timer); timer = null; };

      el.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        fired = false;
        sx = e.clientX; sy = e.clientY;
        cancel();
        timer = setTimeout(() => {
          timer = null;
          fired = true;
          if (navigator.vibrate) navigator.vibrate(15);
          onLong();
        }, 500);
      });
      el.addEventListener('pointermove', e => {
        if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel();
      });
      el.addEventListener('pointerup', cancel);
      el.addEventListener('pointerleave', cancel);
      el.addEventListener('pointercancel', cancel);
      el.addEventListener('click', e => {
        if (fired) { fired = false; return; }   // 길게 누른 뒤 손을 뗄 때는 탭으로 치지 않음
        onTap(e);
      });
      el.addEventListener('contextmenu', e => e.preventDefault());
    }

    // ===== 하단 시트 =====
    let sheetOpenedAt = 0;
    function openSheet(build) {
      const body = $('sheetBody');
      body.innerHTML = '';
      build(body);
      sheetOpenedAt = Date.now();
      $('overlay').classList.add('show');
    }
    function closeSheet() {
      $('overlay').classList.remove('show');
    }
    $('overlay').addEventListener('click', e => {
      if (e.target === $('overlay') && Date.now() - sheetOpenedAt > 300) closeSheet();
    });

    // 24개 이모지 그리드 팝업. used: 고를 수 없는(이미 쓰인) 이모지들
    function openEmojiPicker(title, currentEmoji, used, onPick) {
      openSheet(body => {
        body.append(
          h('h3', 'sheet-title', title),
          h('p', 'sheet-desc', '흐린 이모지는 다른 사람이 쓰고 있어요.')
        );
        const grid = h('div', 'emoji-grid');
        for (const emoji of EMOJIS) {
          const btn = h('button', emoji === currentEmoji ? 'cur' : '', emoji);
          if (used.includes(emoji)) btn.disabled = true;
          btn.addEventListener('click', () => {
            onPick(emoji);
            closeSheet();
            render();
          });
          grid.append(btn);
        }
        body.append(grid);
      });
    }

    // ===== 참여자 =====
    // 새로 추가할 사람의 이모지: 아직 안 쓰인 것 중 하나를 자동으로
    function ensureNewEmoji() {
      const used = usedEmojis();
      if (!newEmoji || used.includes(newEmoji)) {
        const free = EMOJIS.filter(e => !used.includes(e));
        newEmoji = free[Math.floor(Math.random() * free.length)];
      }
    }

    function addPerson() {
      const input = $('nameInput');
      const name = input.value.trim();
      if (!name) return toast('이름을 입력해주세요');
      if (state.participants.length >= MAX_PEOPLE) return toast(`최대 ${MAX_PEOPLE}명까지 추가할 수 있어요`);
      if (state.participants.some(p => p.name === name)) return toast('이미 있는 이름이에요');

      ensureNewEmoji();
      const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      state.participants.push({ id, name, emoji: newEmoji });
      state.selectedId = id;   // 방금 추가한 사람이 바로 입력할 수 있게 (입력 모드로 전환)
      toast(`${newEmoji} ${name} 님 입력 중이에요`);
      newEmoji = null;   // 다음 사람을 위해 새로 뽑음
      input.value = '';
      save();
      render();
    }

    function deletePerson(person) {
      openSheet(body => {
        body.append(
          h('h3', 'sheet-title', `${person.emoji} ${person.name} 님을 삭제할까요?`),
          h('p', 'sheet-desc', '표시한 안 되는 날도 함께 지워져요.')
        );
        const row = h('div', 'btn-row');
        const cancelBtn = h('button', 'btn ghost', '취소');
        const okBtn = h('button', 'btn danger', '삭제');
        cancelBtn.addEventListener('click', closeSheet);
        okBtn.addEventListener('click', () => {
          state.participants = state.participants.filter(p => p.id !== person.id);
          for (const key of Object.keys(state.marks)) {
            state.marks[key] = state.marks[key].filter(id => id !== person.id);
            if (state.marks[key].length === 0) delete state.marks[key];
          }
          if (state.selectedId === person.id) state.selectedId = null;
          save();
          closeSheet();
          render();
          toast('삭제했어요');
        });
        row.append(cancelBtn, okBtn);
        body.append(row);
      });
    }

    function renderPeople() {
      ensureNewEmoji();
      $('emojiBtn').textContent = newEmoji;

      const chips = $('chips');
      chips.innerHTML = '';

      for (const person of state.participants) {
        const chip = h('div', 'chip' + (person.id === state.selectedId ? ' sel' : ''));
        const emo = h('span', 'emo', person.emoji);
        const nm = h('span', 'nm', person.name);
        const del = h('button', 'del', '×');
        del.setAttribute('aria-label', `${person.name} 삭제`);
        chip.append(emo, nm, del);

        chip.addEventListener('click', e => {
          if (e.target.closest('.del')) return deletePerson(person);
          if (e.target.closest('.emo')) {
            return openEmojiPicker(`${person.name} 님의 캐릭터 고르기`, person.emoji,
              usedEmojis(person.id), emoji => { person.emoji = emoji; save(); });
          }
          // 이름 부분: 입력할 사람 선택 / 이미 선택된 사람이면 보기 모드로
          state.selectedId = state.selectedId === person.id ? null : person.id;
          render();
        });
        chips.append(chip);
      }

      // 상황에 맞는 안내 문구
      const hint = $('hint');
      hint.className = 'hint';
      hint.innerHTML = '';
      const count = state.participants.length;
      const sel = findPerson(state.selectedId);

      if (sel) {
        hint.classList.add('editing');
        const text = h('span');
        text.append(h('b', '', `${sel.emoji} ${sel.name}`), ' 님 입력 중');
        const done = h('button', 'done-btn', '완료');
        done.addEventListener('click', () => { state.selectedId = null; render(); });
        hint.append(text, done);
      } else if (count === 0) {
        hint.textContent = `함께할 사람 이름을 추가해주세요 (${MIN_PEOPLE}~${MAX_PEOPLE}명)`;
      } else if (count < MIN_PEOPLE) {
        hint.textContent = `${MIN_PEOPLE - count}명 더 추가해주세요`;
      } else {
        hint.textContent = '내 이름을 누르면 안 되는 날을 입력할 수 있어요 · 이모지를 누르면 캐릭터 변경';
      }
    }

    // ===== 달력 =====
    function toggleMark(key) {
      const list = state.marks[key] || [];
      const i = list.indexOf(state.selectedId);
      if (i >= 0) list.splice(i, 1);
      else list.push(state.selectedId);
      if (list.length) state.marks[key] = list;
      else delete state.marks[key];
      save();
      renderCalendar();
    }

    // 그날 안 되는 사람들 (입력 중인 사람이 맨 앞)
    function unavailablePeople(key) {
      const ids = state.marks[key] || [];
      return state.participants
        .filter(p => ids.includes(p.id))
        .sort((a, b) => (b.id === state.selectedId) - (a.id === state.selectedId));
    }

    function showDayDetail(date, key) {
      const people = unavailablePeople(key);
      openSheet(body => {
        body.append(h('h3', 'sheet-title',
          `${date.getMonth() + 1}월 ${date.getDate()}일 (${DOW[date.getDay()]})`));
        if (state.participants.length === 0) {
          body.append(h('p', 'sheet-desc', '아직 참여자가 없어요.'));
        } else if (people.length === 0) {
          body.append(h('p', 'sheet-desc', '모두 가능해요 🎉'));
        } else {
          body.append(h('p', 'sheet-desc', `${people.length}명 안 됨`));
          const ul = h('ul', 'who-list');
          for (const p of people) {
            const li = h('li');
            li.append(h('span', 'emo', p.emoji), h('span', '', p.name));
            ul.append(li);
          }
          body.append(ul);
        }
      });
    }

    function renderCalendar() {
      const year = current.getFullYear();
      const month = current.getMonth();
      $('title').textContent = `${year}년 ${month + 1}월`;

      const grid = $('grid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const total = state.participants.length;

      for (let i = 0; i < firstDay; i++) grid.append(h('div'));

      for (let d = 1; d <= lastDate; d++) {
        const date = new Date(year, month, d);
        const key = dateKey(year, month, d);
        const cell = h('div', 'cell');
        const dow = date.getDay();
        const isPast = date < today;

        if (dow === 0) cell.classList.add('sun');
        if (dow === 6) cell.classList.add('sat');
        if (isPast) cell.classList.add('past');
        if (date.getTime() === today.getTime()) cell.classList.add('today');

        cell.append(h('span', 'num', d));

        const people = unavailablePeople(key);
        if (people.length > 0) {
          // 안 되는 사람 비율이 높을수록 배경을 진하게
          const ratio = people.length / total;
          cell.style.background = `rgba(var(--no-rgb), ${(0.08 + 0.4 * ratio).toFixed(2)})`;

          const faces = h('div', 'faces');
          for (const p of people.slice(0, MAX_FACES)) {
            const face = h('span', 'face' + (p.id === state.selectedId ? ' mine' : ''), p.emoji);
            face.append(h('i', 'x', '×'));
            faces.append(face);
          }
          if (people.length > MAX_FACES) faces.append(h('span', 'more', `+${people.length - MAX_FACES}`));
          cell.append(faces, h('span', 'cnt', `${people.length}명`));
        } else if (total > 0 && !isPast) {
          cell.classList.add('allok');
        }

        if (!isPast) {
          onPress(cell,
            () => {
              if (state.selectedId) toggleMark(key);   // 입력 모드: 내 X 토글
              else showDayDetail(date, key);           // 보기 모드: 그날 안 되는 사람 보기
            },
            () => showDayDetail(date, key)              // 길게 누르기: 항상 상세 보기
          );
        }

        grid.append(cell);
      }
    }

    function render() {
      renderPeople();
      renderCalendar();
    }

    // ===== 이벤트 연결 =====
    $('emojiBtn').addEventListener('click', () => {
      ensureNewEmoji();
      openEmojiPicker('새 참여자의 캐릭터 고르기', newEmoji, usedEmojis(),
        emoji => { newEmoji = emoji; });
    });

    $('addBtn').addEventListener('click', addPerson);
    $('nameInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        addPerson();
      }
    });

    $('prev').addEventListener('click', () => {
      current.setMonth(current.getMonth() - 1);
      renderCalendar();
    });
    $('next').addEventListener('click', () => {
      current.setMonth(current.getMonth() + 1);
      renderCalendar();
    });

    render();
  </script>
</body>
</html>
